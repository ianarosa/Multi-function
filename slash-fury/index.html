<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>SLASH FURY</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0008; font-family: 'Barlow', sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; touch-action: none; user-select: none; }

  #top-bar {
    display: flex; align-items: center; width: 100%;
    padding: 6px 8px; gap: 12px; z-index: 20; flex-shrink: 0;
    background: rgba(10,0,8,0.85); border-bottom: 2px solid rgba(255,102,34,0.4);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  #back-btn {
    background: rgba(0,0,0,0.5); border: 1px solid rgba(255,102,34,0.3);
    color: rgba(255,102,34,0.8); font-family: 'Barlow', sans-serif;
    font-size: 11px; font-weight: 600; letter-spacing: 1px; padding: 5px 12px;
    cursor: pointer; text-decoration: none; border-radius: 4px;
    white-space: nowrap; flex-shrink: 0; transition: background 0.15s, color 0.15s;
  }
  #back-btn:hover { background: rgba(255,102,34,0.15); color: #ff8844; }

  h1 {
    font-family: 'Bebas Neue', cursive; color: #ff6622; font-size: 1.8rem;
    letter-spacing: 0.15em; text-shadow: 0 0 20px rgba(255,102,34,0.6); flex: 1; text-align: center;
  }
  #top-spacer { width: 70px; flex-shrink: 0; display: flex; justify-content: flex-end; align-items: center; }
  #fs-btn {
    background: rgba(0,0,0,0.5); border: 1px solid rgba(255,102,34,0.3);
    color: rgba(255,102,34,0.7); border-radius: 4px; cursor: pointer;
    width: 32px; height: 28px; display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, color 0.15s; flex-shrink: 0; font-size: 16px;
  }
  #fs-btn:hover { background: rgba(255,102,34,0.15); color: #ff8844; }

  #game-wrap {
    flex: 1; display: flex; align-items: center; justify-content: center;
    width: 100%; min-height: 0; padding: 0 4px 4px;
  }
  #gameCanvas {
    display: block; max-width: 100%; max-height: 100%;
    border: 1px solid rgba(255,102,34,0.12); border-radius: 6px;
    box-shadow: 0 0 60px rgba(255,102,34,0.08), 0 0 0 1px rgba(255,102,34,0.06);
  }
</style>
</head>
<body>
<div id="top-bar">
  <a id="back-btn" href="/">&#8592; HUB</a>
  <h1>SLASH FURY</h1>
  <div id="top-spacer"><button id="fs-btn">⛶</button></div>
</div>
<div id="game-wrap"><canvas id="gameCanvas"></canvas></div>

<script>
// --- Fullscreen ---
document.getElementById('fs-btn').addEventListener('click', () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
  else document.exitFullscreen();
});

// --- Canvas setup ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const wrap = document.getElementById('game-wrap');

function resize() {
  const r = window.devicePixelRatio || 1;
  const w = wrap.clientWidth;
  const h = wrap.clientHeight;
  canvas.width = w * r;
  canvas.height = h * r;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx.setTransform(r, 0, 0, r, 0, 0);
  W = w; H = h;
}
let W = 0, H = 0;
window.addEventListener('resize', resize);
resize();

// --- Constants ---
const ACCENT = '#ff6622';
const BG = '#0a0008';
const GRAVITY = 0.35;
const MAX_LIVES = 3;

// Object types
const TYPES = {
  CIRCLE:    { name: 'circle',    points: 10, colors: ['#ff3333','#ff8822','#33dd55'], radius: 22 },
  DIAMOND:   { name: 'diamond',   points: 25, colors: ['#aa44ff','#cc66ff'],           radius: 20 },
  STAR:      { name: 'star',      points: 50, colors: ['#ffdd33','#ffaa00'],           radius: 22 },
  BOMB:      { name: 'bomb',      points: 0,  colors: ['#332233','#221122'],           radius: 24 },
  FREEZE:    { name: 'freeze',    points: 0,  colors: ['#44ccff','#2299dd'],           radius: 20 },
};

// --- Game State ---
let state = 'menu'; // menu, playing, gameover
let score = 0, highScore = parseInt(localStorage.getItem('slashFury_hi')) || 0;
let lives = MAX_LIVES;
let combo = 0, comboTimer = 0, comboMultiplier = 1;
let frenzyTimer = 0, frenzyComboCount = 0;
let freezeTimer = 0;
let difficulty = 0;
let spawnTimer = 0;
let objects = [], halves = [], particles = [], slashTrail = [], embers = [];
let screenFlash = 0;
let totalTime = 0;

// --- Input ---
let dragging = false;
let dragPoints = [];
let slashLines = []; // stored slash segments for collision

function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const t = e.touches ? e.touches[0] : e;
  return { x: t.clientX - rect.left, y: t.clientY - rect.top };
}

canvas.addEventListener('mousedown', (e) => { startDrag(getPos(e)); });
canvas.addEventListener('mousemove', (e) => { if (dragging) moveDrag(getPos(e)); });
canvas.addEventListener('mouseup', () => { endDrag(); });
canvas.addEventListener('mouseleave', () => { endDrag(); });

canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDrag(getPos(e)); }, { passive: false });
canvas.addEventListener('touchmove', (e) => { e.preventDefault(); if (dragging) moveDrag(getPos(e)); }, { passive: false });
canvas.addEventListener('touchend', (e) => { e.preventDefault(); endDrag(); }, { passive: false });
canvas.addEventListener('touchcancel', () => { endDrag(); });

function startDrag(p) {
  if (state === 'menu') { startGame(); return; }
  if (state === 'gameover') { startGame(); return; }
  dragging = true;
  dragPoints = [{ ...p, t: performance.now() }];
  slashLines = [];
}

function moveDrag(p) {
  const now = performance.now();
  dragPoints.push({ ...p, t: now });
  if (dragPoints.length >= 2) {
    const a = dragPoints[dragPoints.length - 2];
    const b = dragPoints[dragPoints.length - 1];
    slashTrail.push({ x1: a.x, y1: a.y, x2: b.x, y2: b.y, life: 1 });
    checkSlashHit(a, b);
  }
}

function endDrag() {
  dragging = false;
  dragPoints = [];
  slashLines = [];
}

// --- Collision ---
function distPointToSeg(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const len2 = dx * dx + dy * dy;
  if (len2 === 0) return Math.hypot(px - x1, py - y1);
  let t = ((px - x1) * dx + (py - y1) * dy) / len2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
}

function checkSlashHit(a, b) {
  const slashedInSwipe = [];
  for (let i = objects.length - 1; i >= 0; i--) {
    const obj = objects[i];
    if (obj.slashed) continue;
    const dist = distPointToSeg(obj.x, obj.y, a.x, a.y, b.x, b.y);
    if (dist < obj.radius + 8) {
      obj.slashed = true;
      slashedInSwipe.push(obj);
    }
  }

  for (const obj of slashedInSwipe) {
    if (obj.type === TYPES.BOMB) {
      hitBomb(obj);
      continue;
    }
    if (obj.type === TYPES.FREEZE) {
      freezeTimer = 3;
      spawnFreezeParticles(obj);
      removeObject(obj);
      continue;
    }
    slashObject(obj);
  }
}

function slashObject(obj) {
  combo++;
  comboTimer = 1.5;
  comboMultiplier = Math.min(combo, 8);
  frenzyComboCount++;

  if (frenzyComboCount >= 15 && frenzyTimer <= 0) {
    frenzyTimer = 4;
    frenzyComboCount = 0;
  }

  const pts = obj.type.points * comboMultiplier;
  score += pts;

  // Spawn halves
  const color = obj.color;
  const angle = Math.random() * Math.PI;
  for (let s = -1; s <= 1; s += 2) {
    halves.push({
      x: obj.x, y: obj.y, vx: obj.vx + Math.cos(angle) * s * 3,
      vy: obj.vy - 2, rotation: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.3, type: obj.type,
      color, side: s, radius: obj.radius, life: 1
    });
  }

  // Juice particles
  for (let i = 0; i < 12; i++) {
    const a = Math.random() * Math.PI * 2;
    const spd = 2 + Math.random() * 5;
    particles.push({
      x: obj.x, y: obj.y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd - 2,
      life: 1, color, radius: 2 + Math.random() * 3
    });
  }

  // Score popup particle
  particles.push({
    x: obj.x, y: obj.y - 20, vx: 0, vy: -1.5, life: 1,
    color: '#fff', radius: 0, text: '+' + pts, isText: true
  });

  removeObject(obj);
}

function hitBomb(obj) {
  lives--;
  screenFlash = 0.5;
  combo = 0; comboTimer = 0; comboMultiplier = 1;

  // Explosion particles
  for (let i = 0; i < 20; i++) {
    const a = Math.random() * Math.PI * 2;
    const spd = 3 + Math.random() * 6;
    particles.push({
      x: obj.x, y: obj.y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd,
      life: 1, color: '#ff2200', radius: 3 + Math.random() * 4
    });
  }

  removeObject(obj);
  if (lives <= 0) gameOver();
}

function spawnFreezeParticles(obj) {
  for (let i = 0; i < 15; i++) {
    const a = Math.random() * Math.PI * 2;
    const spd = 2 + Math.random() * 4;
    particles.push({
      x: obj.x, y: obj.y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd,
      life: 1, color: '#66ddff', radius: 2 + Math.random() * 3
    });
  }
}

function removeObject(obj) {
  const idx = objects.indexOf(obj);
  if (idx >= 0) objects.splice(idx, 1);
}

// --- Spawning ---
function spawnObject() {
  const d = difficulty;
  // Weighted random type selection
  let roll = Math.random();
  let type;
  const bombChance = Math.min(0.08 + d * 0.015, 0.3);
  const freezeChance = 0.05;
  const starChance = 0.04;
  const diamondChance = 0.12;

  if (roll < bombChance) type = TYPES.BOMB;
  else if (roll < bombChance + freezeChance) type = TYPES.FREEZE;
  else if (roll < bombChance + freezeChance + starChance) type = TYPES.STAR;
  else if (roll < bombChance + freezeChance + starChance + diamondChance) type = TYPES.DIAMOND;
  else type = TYPES.CIRCLE;

  const color = type.colors[Math.floor(Math.random() * type.colors.length)];
  const margin = 60;
  const x = margin + Math.random() * (W - margin * 2);
  // Scale launch speed to screen height so objects reach 60-80% up
  const targetHeight = H * (0.6 + Math.random() * 0.2);
  const baseSpeed = Math.sqrt(2 * GRAVITY * targetHeight);
  const launchSpeed = baseSpeed + d * 0.3;
  const vx = (Math.random() - 0.5) * 6;

  objects.push({
    x, y: H + 30,
    vx, vy: -launchSpeed,
    type, color,
    radius: type.radius + Math.random() * 4,
    rotation: Math.random() * Math.PI * 2,
    rotSpeed: (Math.random() - 0.5) * 0.1,
    slashed: false, missed: false,
    glowPhase: Math.random() * Math.PI * 2
  });
}

// --- Game flow ---
function startGame() {
  state = 'playing';
  score = 0; lives = MAX_LIVES; combo = 0; comboTimer = 0; comboMultiplier = 1;
  frenzyTimer = 0; frenzyComboCount = 0; freezeTimer = 0;
  difficulty = 0; spawnTimer = 0; totalTime = 0;
  objects = []; halves = []; particles = []; slashTrail = [];
  screenFlash = 0;
}

function gameOver() {
  state = 'gameover';
  if (score > highScore) {
    highScore = score;
    localStorage.setItem('slashFury_hi', highScore);
  }
}

// --- Embers (background) ---
function spawnEmber() {
  embers.push({
    x: Math.random() * W, y: H + 5,
    vy: -0.3 - Math.random() * 0.8,
    vx: (Math.random() - 0.5) * 0.3,
    life: 1, size: 1 + Math.random() * 2,
    color: Math.random() > 0.5 ? '#ff6622' : '#ff3311'
  });
}

// --- Drawing helpers ---
function drawShape(x, y, type, radius, color, rotation, glowPhase, alpha) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rotation);
  ctx.globalAlpha = alpha || 1;

  const glow = 0.5 + 0.5 * Math.sin(glowPhase || 0);

  // Neon glow
  ctx.shadowColor = color;
  ctx.shadowBlur = 12 + glow * 8;

  if (type === TYPES.CIRCLE) {
    ctx.beginPath();
    ctx.arc(0, 0, radius, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.strokeStyle = lighten(color, 0.4);
    ctx.lineWidth = 2;
    ctx.stroke();
  } else if (type === TYPES.DIAMOND) {
    ctx.beginPath();
    ctx.moveTo(0, -radius);
    ctx.lineTo(radius * 0.7, 0);
    ctx.lineTo(0, radius);
    ctx.lineTo(-radius * 0.7, 0);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
    ctx.strokeStyle = lighten(color, 0.5);
    ctx.lineWidth = 2;
    ctx.stroke();
    // Sparkle
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,' + (0.3 + glow * 0.4) + ')';
    ctx.beginPath();
    ctx.arc(-radius * 0.2, -radius * 0.3, 2, 0, Math.PI * 2);
    ctx.fill();
  } else if (type === TYPES.STAR) {
    drawStar(0, 0, 5, radius, radius * 0.5);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    // Golden glow overlay
    ctx.shadowBlur = 20 + glow * 15;
    ctx.shadowColor = '#ffdd33';
  } else if (type === TYPES.BOMB) {
    // Hexagon
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = (Math.PI / 3) * i - Math.PI / 6;
      const px = Math.cos(a) * radius;
      const py = Math.sin(a) * radius;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
    // Red pulse
    ctx.shadowColor = '#ff0000';
    ctx.shadowBlur = 10 + glow * 20;
    ctx.strokeStyle = 'rgba(255,0,0,' + (0.4 + glow * 0.6) + ')';
    ctx.lineWidth = 3;
    ctx.stroke();
    // Skull-ish marker
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,0,0,' + (0.5 + glow * 0.5) + ')';
    ctx.font = (radius * 0.9) + 'px Barlow';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('X', 0, 1);
  } else if (type === TYPES.FREEZE) {
    // Snowflake
    ctx.shadowColor = '#44ccff';
    ctx.shadowBlur = 15 + glow * 10;
    ctx.strokeStyle = color;
    ctx.lineWidth = 2.5;
    for (let i = 0; i < 6; i++) {
      const a = (Math.PI / 3) * i;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      const ex = Math.cos(a) * radius;
      const ey = Math.sin(a) * radius;
      ctx.lineTo(ex, ey);
      ctx.stroke();
      // Branches
      const mx = Math.cos(a) * radius * 0.6;
      const my = Math.sin(a) * radius * 0.6;
      for (let s = -1; s <= 1; s += 2) {
        const ba = a + s * 0.6;
        ctx.beginPath();
        ctx.moveTo(mx, my);
        ctx.lineTo(mx + Math.cos(ba) * radius * 0.3, my + Math.sin(ba) * radius * 0.3);
        ctx.stroke();
      }
    }
    // Center dot
    ctx.fillStyle = '#aaeeff';
    ctx.beginPath();
    ctx.arc(0, 0, 3, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore();
}

function drawStar(cx, cy, spikes, outerR, innerR) {
  ctx.beginPath();
  for (let i = 0; i < spikes * 2; i++) {
    const r = i % 2 === 0 ? outerR : innerR;
    const a = (Math.PI / spikes) * i - Math.PI / 2;
    const px = cx + Math.cos(a) * r;
    const py = cy + Math.sin(a) * r;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
}

function drawHalf(h) {
  ctx.save();
  ctx.translate(h.x, h.y);
  ctx.rotate(h.rotation);
  ctx.globalAlpha = h.life;

  // Clip to half
  ctx.beginPath();
  if (h.side === -1) {
    ctx.rect(-h.radius - 2, -h.radius - 2, h.radius + 2, (h.radius + 2) * 2);
  } else {
    ctx.rect(0, -h.radius - 2, h.radius + 2, (h.radius + 2) * 2);
  }
  ctx.clip();

  drawShape(0, 0, h.type, h.radius, h.color, 0, 0, h.life);
  ctx.restore();
}

function lighten(color, amount) {
  const r = parseInt(color.slice(1, 3), 16);
  const g = parseInt(color.slice(3, 5), 16);
  const b = parseInt(color.slice(5, 7), 16);
  const nr = Math.min(255, r + (255 - r) * amount);
  const ng = Math.min(255, g + (255 - g) * amount);
  const nb = Math.min(255, b + (255 - b) * amount);
  return `rgb(${nr|0},${ng|0},${nb|0})`;
}

// --- HUD ---
function drawHUD() {
  ctx.save();
  ctx.shadowBlur = 0;

  // Score
  ctx.font = '600 16px Barlow';
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'left';
  ctx.fillText('SCORE', 12, 28);
  ctx.font = '32px "Bebas Neue"';
  ctx.fillStyle = ACCENT;
  ctx.fillText(score, 12, 58);

  // High score
  ctx.font = '600 11px Barlow';
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.fillText('HI ' + highScore, 12, 74);

  // Lives (hearts)
  ctx.textAlign = 'right';
  ctx.font = '20px Barlow';
  for (let i = 0; i < MAX_LIVES; i++) {
    ctx.fillStyle = i < lives ? '#ff3344' : 'rgba(255,51,68,0.2)';
    ctx.fillText('♥', W - 12 - i * 26, 30);
  }

  // Combo
  if (comboTimer > 0 && combo > 1) {
    ctx.textAlign = 'center';
    ctx.font = '28px "Bebas Neue"';
    const ca = Math.min(comboTimer / 0.3, 1);
    ctx.fillStyle = `rgba(255,102,34,${ca})`;
    ctx.fillText(combo + 'x COMBO', W / 2, 56);
  }

  // Frenzy
  if (frenzyTimer > 0) {
    ctx.textAlign = 'center';
    ctx.font = '22px "Bebas Neue"';
    const fa = Math.min(frenzyTimer / 0.5, 1);
    ctx.fillStyle = `rgba(255,220,50,${fa})`;
    ctx.fillText('FRENZY!', W / 2, 80);
  }

  // Freeze indicator
  if (freezeTimer > 0) {
    ctx.textAlign = 'center';
    ctx.font = '18px "Bebas Neue"';
    ctx.fillStyle = `rgba(100,220,255,0.8)`;
    ctx.fillText('FROZEN ' + freezeTimer.toFixed(1) + 's', W / 2, H - 20);
  }

  ctx.restore();
}

// --- Screens ---
function drawMenu() {
  ctx.save();
  ctx.shadowBlur = 0;
  ctx.textAlign = 'center';

  ctx.font = '64px "Bebas Neue"';
  ctx.fillStyle = ACCENT;
  ctx.shadowColor = ACCENT;
  ctx.shadowBlur = 30;
  ctx.fillText('SLASH FURY', W / 2, H * 0.32);

  ctx.shadowBlur = 0;
  ctx.font = '600 16px Barlow';
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.fillText('Swipe through objects to slash them!', W / 2, H * 0.42);
  ctx.fillText('Avoid the bombs!', W / 2, H * 0.48);

  const pulse = 0.6 + 0.4 * Math.sin(performance.now() / 400);
  ctx.font = '600 20px Barlow';
  ctx.fillStyle = `rgba(255,102,34,${pulse})`;
  ctx.fillText('TAP TO START', W / 2, H * 0.62);

  if (highScore > 0) {
    ctx.font = '600 14px Barlow';
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.fillText('HIGH SCORE: ' + highScore, W / 2, H * 0.72);
  }

  ctx.restore();
}

function drawGameOver() {
  ctx.save();
  ctx.shadowBlur = 0;

  // Overlay
  ctx.fillStyle = 'rgba(10,0,8,0.7)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.font = '56px "Bebas Neue"';
  ctx.fillStyle = '#ff3333';
  ctx.shadowColor = '#ff0000';
  ctx.shadowBlur = 20;
  ctx.fillText('GAME OVER', W / 2, H * 0.32);

  ctx.shadowBlur = 0;
  ctx.font = '32px "Bebas Neue"';
  ctx.fillStyle = ACCENT;
  ctx.fillText('SCORE: ' + score, W / 2, H * 0.44);

  if (score >= highScore && score > 0) {
    ctx.font = '600 16px Barlow';
    ctx.fillStyle = '#ffdd33';
    ctx.fillText('NEW HIGH SCORE!', W / 2, H * 0.52);
  } else {
    ctx.font = '600 14px Barlow';
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.fillText('BEST: ' + highScore, W / 2, H * 0.52);
  }

  const pulse = 0.6 + 0.4 * Math.sin(performance.now() / 400);
  ctx.font = '600 18px Barlow';
  ctx.fillStyle = `rgba(255,102,34,${pulse})`;
  ctx.fillText('TAP TO RETRY', W / 2, H * 0.66);

  ctx.restore();
}

// --- Main loop ---
let lastTime = 0;
function loop(timestamp) {
  requestAnimationFrame(loop);
  let dt = (timestamp - lastTime) / 1000;
  lastTime = timestamp;
  if (dt > 0.1) dt = 0.016;

  // Time scale for freeze
  let timeScale = 1;
  if (freezeTimer > 0 && state === 'playing') {
    timeScale = 0.3;
    freezeTimer -= dt;
    if (freezeTimer < 0) freezeTimer = 0;
  }

  const gdt = dt * timeScale;

  // Clear
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, W, H);

  // Embers (always)
  if (Math.random() < dt * 3) spawnEmber();
  for (let i = embers.length - 1; i >= 0; i--) {
    const e = embers[i];
    e.x += e.vx * dt * 60;
    e.y += e.vy * dt * 60;
    e.life -= dt * 0.15;
    if (e.life <= 0 || e.y < -10) { embers.splice(i, 1); continue; }
    ctx.globalAlpha = e.life * 0.4;
    ctx.fillStyle = e.color;
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Freeze tint
  if (freezeTimer > 0) {
    ctx.fillStyle = 'rgba(30,80,120,0.1)';
    ctx.fillRect(0, 0, W, H);
  }

  if (state === 'menu') {
    drawMenu();
    requestAnimationFrame(() => {});
    return;
  }

  if (state === 'playing') {
    totalTime += dt;
    difficulty = Math.min(totalTime / 10, 20);

    // Spawn
    let spawnRate = 1.2 - difficulty * 0.04;
    if (spawnRate < 0.25) spawnRate = 0.25;
    if (frenzyTimer > 0) {
      spawnRate = 0.15;
      frenzyTimer -= dt;
    }
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnTimer = spawnRate + Math.random() * spawnRate * 0.3;
      const count = frenzyTimer > 0 ? 2 + Math.floor(Math.random() * 3) : 1 + (Math.random() < 0.3 + difficulty * 0.02 ? 1 : 0);
      for (let i = 0; i < count; i++) spawnObject();
    }

    // Combo timer
    if (comboTimer > 0) {
      comboTimer -= dt;
      if (comboTimer <= 0) { combo = 0; comboMultiplier = 1; }
    }

    // Update objects
    for (let i = objects.length - 1; i >= 0; i--) {
      const obj = objects[i];
      obj.x += obj.vx * gdt * 60;
      obj.y += obj.vy * gdt * 60;
      obj.vy += GRAVITY * gdt * 60;
      obj.rotation += obj.rotSpeed * gdt * 60;
      obj.glowPhase += gdt * 4;

      // Fell off screen
      if (obj.y > H + 50 && obj.vy > 0) {
        if (!obj.slashed && obj.type !== TYPES.BOMB) {
          lives--;
          if (lives <= 0) { gameOver(); break; }
        }
        objects.splice(i, 1);
      }
    }
  }

  // Draw objects
  for (const obj of objects) {
    drawShape(obj.x, obj.y, obj.type, obj.radius, obj.color, obj.rotation, obj.glowPhase, 1);
  }

  // Halves
  for (let i = halves.length - 1; i >= 0; i--) {
    const h = halves[i];
    h.x += h.vx * gdt * 60;
    h.y += h.vy * gdt * 60;
    h.vy += GRAVITY * 0.7 * gdt * 60;
    h.rotation += h.rotSpeed * gdt * 60;
    h.life -= dt * 1.5;
    if (h.life <= 0) { halves.splice(i, 1); continue; }
    drawHalf(h);
  }

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * gdt * 60;
    p.y += p.vy * gdt * 60;
    if (!p.isText) p.vy += 0.15 * gdt * 60;
    p.life -= dt * 1.8;
    if (p.life <= 0) { particles.splice(i, 1); continue; }

    ctx.globalAlpha = p.life;
    if (p.isText) {
      ctx.save();
      ctx.shadowBlur = 0;
      ctx.font = '600 16px Barlow';
      ctx.fillStyle = p.color;
      ctx.textAlign = 'center';
      ctx.fillText(p.text, p.x, p.y);
      ctx.restore();
    } else {
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 6;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius * p.life, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }
  ctx.globalAlpha = 1;

  // Slash trail
  for (let i = slashTrail.length - 1; i >= 0; i--) {
    const s = slashTrail[i];
    s.life -= dt * 4;
    if (s.life <= 0) { slashTrail.splice(i, 1); continue; }
    ctx.save();
    ctx.globalAlpha = s.life;
    ctx.strokeStyle = `rgba(255,255,255,${s.life})`;
    ctx.lineWidth = 4 * s.life;
    ctx.shadowColor = ACCENT;
    ctx.shadowBlur = 15 * s.life;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(s.x1, s.y1);
    ctx.lineTo(s.x2, s.y2);
    ctx.stroke();

    // Orange inner glow
    ctx.strokeStyle = `rgba(255,102,34,${s.life * 0.6})`;
    ctx.lineWidth = 2 * s.life;
    ctx.shadowBlur = 8 * s.life;
    ctx.beginPath();
    ctx.moveTo(s.x1, s.y1);
    ctx.lineTo(s.x2, s.y2);
    ctx.stroke();
    ctx.restore();
  }

  // Screen flash (bomb)
  if (screenFlash > 0) {
    ctx.fillStyle = `rgba(255,0,0,${screenFlash * 0.5})`;
    ctx.fillRect(0, 0, W, H);
    screenFlash -= dt * 2;
  }

  // HUD
  if (state === 'playing' || state === 'gameover') drawHUD();
  if (state === 'gameover') drawGameOver();
}

requestAnimationFrame(loop);
</script>
</body>
</html>
