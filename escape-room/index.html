<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ESCAPE ROOM</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #05050a;
    color: #fff;
    font-family: 'Barlow', 'Courier New', sans-serif;
    height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    user-select: none;
  }

  #hud {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 18px;
    background: rgba(0,0,0,0.7);
    border-bottom: 1px solid var(--accent-dim);
    flex-shrink: 0;
    z-index: 10;
  }

  #back-btn {
    font-family: 'Bebas Neue', cursive;
    font-size: 13px;
    letter-spacing: 2px;
    color: var(--accent-mid);
    text-decoration: none;
  }

  #hud-center { text-align: center; }

  #level-info {
    font-family: 'Bebas Neue', cursive;
    font-size: 17px;
    letter-spacing: 4px;
    color: var(--accent);
  }

  #level-sub {
    font-size: 9px;
    letter-spacing: 3px;
    color: var(--accent-dim);
    text-transform: uppercase;
    margin-top: 2px;
  }

  #hud-right {
    font-family: 'Bebas Neue', cursive;
    font-size: 13px;
    letter-spacing: 2px;
    color: var(--accent-dim);
    text-align: right;
  }

  #room-wrap {
    flex: 1;
    position: relative;
    overflow: hidden;
    min-height: 0;
  }

  #room-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 20;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.5s;
    background: transparent;
  }

  #overlay.active {
    pointer-events: auto;
    opacity: 1;
  }

  #overlay-box {
    text-align: center;
    padding: 36px 48px;
    border: 1px solid var(--accent-mid);
    border-radius: 12px;
    background: rgba(5,5,15,0.92);
    backdrop-filter: blur(8px);
  }

  #overlay-title {
    font-family: 'Bebas Neue', cursive;
    font-size: clamp(36px, 7vw, 64px);
    letter-spacing: 8px;
    color: var(--accent);
    text-shadow: 0 0 28px var(--accent-glow);
  }

  #overlay-sub {
    font-size: 11px;
    letter-spacing: 4px;
    color: var(--accent-mid);
    margin-top: 8px;
    text-transform: uppercase;
  }

  #overlay-btn {
    margin-top: 28px;
    padding: 11px 38px;
    border: 1px solid var(--accent-mid);
    border-radius: 6px;
    background: rgba(255,255,255,0.04);
    color: var(--accent);
    font-family: 'Bebas Neue', cursive;
    font-size: 17px;
    letter-spacing: 4px;
    cursor: pointer;
    transition: background 0.15s;
    display: block;
    width: 100%;
  }

  #overlay-btn:hover { background: var(--accent-dim); }

  #bottom-panel {
    background: rgba(5,5,15,0.97);
    border-top: 1px solid var(--accent-dim);
    flex-shrink: 0;
  }

  #examine-panel {
    padding: 8px 18px 8px;
    border-bottom: 1px solid var(--accent-xdim);
    min-height: 62px;
    max-height: 80px;
    overflow: hidden;
  }

  #examine-title {
    font-family: 'Bebas Neue', cursive;
    font-size: 12px;
    letter-spacing: 3px;
    color: var(--accent-mid);
    margin-bottom: 3px;
  }

  #examine-text {
    font-size: 11px;
    line-height: 1.5;
    color: rgba(255,255,255,0.5);
  }

  #code-panel {
    padding: 8px 18px 10px;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  #code-display {
    display: flex;
    gap: 5px;
    flex-shrink: 0;
  }

  .code-digit {
    width: 30px;
    height: 38px;
    border: 1px solid var(--accent-mid);
    border-radius: 4px;
    background: var(--accent-xdim);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Bebas Neue', cursive;
    font-size: 20px;
    color: var(--accent);
    transition: border-color 0.15s, background 0.15s;
  }

  .code-digit.filled { border-color: var(--accent); }

  .code-digit.wrong {
    border-color: #ff4444 !important;
    background: rgba(255,0,0,0.12) !important;
    color: #ff6666 !important;
    animation: shake 0.35s ease;
  }

  .code-digit.correct {
    border-color: #44ff88 !important;
    background: rgba(0,255,80,0.1) !important;
    color: #44ff88 !important;
  }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-5px); }
    60% { transform: translateX(5px); }
  }

  #keypad {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
    flex: 1;
  }

  .key-btn {
    width: 30px;
    height: 30px;
    border: 1px solid var(--accent-dim);
    border-radius: 4px;
    background: var(--accent-xdim);
    color: var(--accent);
    font-family: 'Bebas Neue', cursive;
    font-size: 15px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.1s;
    -webkit-tap-highlight-color: transparent;
    flex-shrink: 0;
  }

  .key-btn:active, .key-btn:hover { background: var(--accent-dim); }
  .key-btn.del { color: #ff6666; border-color: rgba(255,80,80,0.3); }
</style>
</head>
<body>

<div id="hud">
  <a id="back-btn" href="/">← HUB</a>
  <div id="hud-center">
    <div id="level-info">LEVEL 1 — THE STUDY</div>
    <div id="level-sub">Find the code · Escape the room</div>
  </div>
  <div id="hud-right">1 / 3</div>
</div>

<div id="room-wrap">
  <canvas id="room-canvas"></canvas>
  <div id="overlay">
    <div id="overlay-box">
      <div id="overlay-title">ESCAPED!</div>
      <div id="overlay-sub">Level 1 clear</div>
      <button id="overlay-btn">NEXT LEVEL →</button>
    </div>
  </div>
</div>

<div id="bottom-panel">
  <div id="examine-panel">
    <div id="examine-title">EXAMINE</div>
    <div id="examine-text">Click on an object in the room to inspect it.</div>
  </div>
  <div id="code-panel">
    <div id="code-display">
      <div class="code-digit" id="d0">_</div>
      <div class="code-digit" id="d1">_</div>
      <div class="code-digit" id="d2">_</div>
      <div class="code-digit" id="d3">_</div>
    </div>
    <div id="keypad"></div>
  </div>
</div>

<script>
(() => {
'use strict';

// ── Level data ────────────────────────────────────────────────────
const LEVELS = [
  {
    name: 'THE STUDY',
    accent: '#ff9933',
    accentRgb: [255, 153, 51],
    bgColors: ['#160a00', '#08040a'],
    floorColor: '#1e0f00',
    code: '4821',
    secretId: 'painting',
    hint: 'Roman numerals hold the key.',
    objects: [
      {
        id: 'bookshelf', label: 'BOOKSHELF',
        rx: 0.04, ry: 0.12, rw: 0.13, rh: 0.72,
        icon: 'bookshelf',
        text: 'Rows of dusty books crowd the shelves. Most spines are worn beyond reading. One thick volume is labelled "Vol. IV" — inside the cover, someone has pencilled the word "incomplete".',
      },
      {
        id: 'desk', label: 'WRITING DESK',
        rx: 0.35, ry: 0.55, rw: 0.30, rh: 0.32,
        icon: 'desk',
        text: 'A heavy oak desk with three drawers. All empty except for a dried-up ink pen and a crumpled receipt. Nothing useful here.',
      },
      {
        id: 'painting', label: 'OIL PAINTING',
        rx: 0.37, ry: 0.07, rw: 0.26, rh: 0.34,
        icon: 'painting',
        isSecret: true,
        text: 'A dark landscape — rolling hills beneath a moonlit sky. In the lower-right corner a small brass placard reads: "R.A.  —  IV · VIII · II · I".',
      },
      {
        id: 'clock', label: 'WALL CLOCK',
        rx: 0.75, ry: 0.07, rw: 0.12, rh: 0.22,
        icon: 'clock',
        text: 'An antique pendulum clock, hands frozen at 3:15. The winding key is missing. The mechanism stopped long ago.',
      },
      {
        id: 'door', label: 'LOCKED DOOR',
        rx: 0.83, ry: 0.18, rw: 0.14, rh: 0.70,
        icon: 'door',
        text: 'A heavy wooden door fitted with an electronic keypad lock. The display pulses: "ENTER 4-DIGIT CODE".',
      },
    ],
  },
  {
    name: 'THE LABORATORY',
    accent: '#00ddff',
    accentRgb: [0, 221, 255],
    bgColors: ['#001018', '#00080f'],
    floorColor: '#001520',
    code: '7364',
    secretId: 'whiteboard',
    hint: 'Check the classified note on the board.',
    objects: [
      {
        id: 'microscope', label: 'MICROSCOPE',
        rx: 0.04, ry: 0.44, rw: 0.14, rh: 0.34,
        icon: 'microscope',
        text: 'A high-powered research microscope. A slide is loaded showing cellular structures. The stage label reads: "Sample B-12 — control group". Nothing out of the ordinary.',
      },
      {
        id: 'whiteboard', label: 'WHITEBOARD',
        rx: 0.26, ry: 0.07, rw: 0.38, rh: 0.44,
        icon: 'whiteboard',
        isSecret: true,
        text: 'Equations and molecular diagrams cover the board. Most are crossed out in frustration. One entry is circled in red: "COMPOUND #7364 — CLASSIFIED. DO NOT SHARE."',
      },
      {
        id: 'cabinet', label: 'FILING CABINET',
        rx: 0.72, ry: 0.28, rw: 0.13, rh: 0.52,
        icon: 'cabinet',
        text: 'A tall metal filing cabinet — every drawer locked. A red sticker reads: "CLASSIFIED — LEVEL 3 ACCESS REQUIRED". You don\'t have clearance.',
      },
      {
        id: 'terminal', label: 'COMPUTER',
        rx: 0.06, ry: 0.08, rw: 0.16, rh: 0.30,
        icon: 'computer',
        text: 'An old computer terminal. The screen flickers with a login prompt: "PASSWORD REQUIRED". You don\'t know the password.',
      },
      {
        id: 'door2', label: 'LOCKED DOOR',
        rx: 0.83, ry: 0.18, rw: 0.14, rh: 0.70,
        icon: 'door',
        text: 'A reinforced steel door with a digital keypad. The display pulses green: "ENTER SECURITY CODE".',
      },
    ],
  },
  {
    name: 'THE VAULT',
    accent: '#ffd700',
    accentRgb: [255, 215, 0],
    bgColors: ['#100800', '#080500'],
    floorColor: '#180a00',
    code: '9150',
    secretId: 'fireplace',
    hint: 'The founding date is carved in stone.',
    objects: [
      {
        id: 'portrait', label: 'PORTRAIT',
        rx: 0.35, ry: 0.05, rw: 0.24, rh: 0.42,
        icon: 'portrait',
        text: 'An oil portrait of a stern figure in formal Victorian attire. A brass nameplate below reads: "LORD HENSLEY, FOUNDER". The painted eyes seem to follow you around the room.',
      },
      {
        id: 'fireplace', label: 'FIREPLACE',
        rx: 0.03, ry: 0.28, rw: 0.24, rh: 0.50,
        icon: 'fireplace',
        isSecret: true,
        text: 'An ornate stone fireplace — long cold. Carved into the mantle above it: "FOUNDED · 9 · 1 · 5 · 0 · IN FIRE AND GOLD". The numbers are deeply etched.',
      },
      {
        id: 'bookcase', label: 'BOOKCASE',
        rx: 0.72, ry: 0.10, rw: 0.14, rh: 0.64,
        icon: 'bookshelf',
        text: 'An ornate bookcase filled with leather-bound volumes. A set of encyclopaedias dominates one shelf. You leaf through a few — nothing unusual.',
      },
      {
        id: 'trophy', label: 'TROPHY CASE',
        rx: 0.35, ry: 0.60, rw: 0.24, rh: 0.26,
        icon: 'trophy',
        text: 'A glass case displaying trophies, medals, and commendations. A small card reads: "HENSLEY ESTATE — COLLECTION OF EXCELLENCE". All purely decorative.',
      },
      {
        id: 'door3', label: 'VAULT DOOR',
        rx: 0.83, ry: 0.15, rw: 0.14, rh: 0.73,
        icon: 'door',
        text: 'A massive circular vault door. A modern digital keypad has been retrofitted to the frame. "ENTER COMBINATION" blinks on the display.',
      },
    ],
  },
];

// ── State ─────────────────────────────────────────────────────────
let lvlIdx = 0;
let entered = '';
let selected = null;
let hovered = null;
let phase = 'playing'; // 'playing' | 'levelclear' | 'complete'
let wrongFlash = 0;
let pulse = 0;

// ── Canvas setup ──────────────────────────────────────────────────
const canvas = document.getElementById('room-canvas');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width  = canvas.parentElement.clientWidth;
  canvas.height = canvas.parentElement.clientHeight;
}
window.addEventListener('resize', () => { resize(); draw(); });
resize();

// ── CSS variables (accent color theming) ──────────────────────────
function applyTheme() {
  const L = LEVELS[lvlIdx];
  const [r,g,b] = L.accentRgb;
  const s = document.documentElement.style;
  s.setProperty('--accent',      L.accent);
  s.setProperty('--accent-glow', `rgba(${r},${g},${b},0.6)`);
  s.setProperty('--accent-mid',  `rgba(${r},${g},${b},0.55)`);
  s.setProperty('--accent-dim',  `rgba(${r},${g},${b},0.22)`);
  s.setProperty('--accent-xdim', `rgba(${r},${g},${b},0.06)`);
}

// ── Draw ──────────────────────────────────────────────────────────
function draw() {
  const W = canvas.width, H = canvas.height;
  const L = LEVELS[lvlIdx];
  const [r,g,b] = L.accentRgb;
  const floorY = H * 0.84;

  ctx.clearRect(0, 0, W, H);

  // Background gradient
  const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, L.bgColors[0]);
  bgGrad.addColorStop(1, L.bgColors[1]);
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  // Floor
  ctx.fillStyle = L.floorColor;
  ctx.fillRect(0, floorY, W, H - floorY);

  // Floor/wall divider
  ctx.strokeStyle = `rgba(${r},${g},${b},0.25)`;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, floorY); ctx.lineTo(W, floorY);
  ctx.stroke();

  // Subtle wall planks
  ctx.strokeStyle = `rgba(255,255,255,0.025)`;
  ctx.lineWidth = 1;
  const planks = 10;
  for (let i = 1; i < planks; i++) {
    ctx.beginPath();
    ctx.moveTo(W/planks*i, 0);
    ctx.lineTo(W/planks*i, floorY);
    ctx.stroke();
  }

  // Objects
  for (const obj of L.objects) drawObject(obj, W, H, L);

  // Wrong flash overlay
  if (wrongFlash > 0) {
    ctx.fillStyle = `rgba(255,0,0,${wrongFlash * 0.18})`;
    ctx.fillRect(0, 0, W, H);
  }
}

function drawObject(obj, W, H, L) {
  const [r,g,b] = L.accentRgb;
  const x = obj.rx * W, y = obj.ry * H;
  const w = obj.rw * W, h = obj.rh * H;
  const isHov = hovered && hovered.id === obj.id;
  const isSel = selected && selected.id === obj.id;

  // Secret object pulse ring
  const isSecret = obj.isSecret;
  const pAlpha = isSecret ? 0.12 + Math.sin(pulse * 0.05) * 0.08 : 0;

  ctx.save();

  // Glow
  if (isSel || isHov) {
    ctx.shadowColor = L.accent;
    ctx.shadowBlur = isSel ? 22 : 12;
  }

  // Body fill
  const fillA = isSel ? 0.14 : isHov ? 0.08 : isSecret ? pAlpha : 0.04;
  ctx.fillStyle = `rgba(${r},${g},${b},${fillA})`;
  const borderA = isSel ? 1.0 : isHov ? 0.75 : isSecret ? 0.35 + Math.sin(pulse * 0.05) * 0.15 : 0.25;
  ctx.strokeStyle = `rgba(${r},${g},${b},${borderA})`;
  ctx.lineWidth = isSel ? 2 : 1.5;

  rrect(x, y, w, h, 6);
  ctx.fill(); ctx.stroke();
  ctx.shadowBlur = 0;

  // Icon
  const iconSize = Math.min(w, h) * 0.3;
  const cx = x + w / 2, cy = y + h * 0.38;
  const iconA = isSel || isHov ? 1 : 0.7;
  drawIcon(obj.icon, cx, cy, iconSize, r, g, b, iconA);

  // Label
  const labelA = isSel || isHov ? 1 : 0.5;
  ctx.fillStyle = `rgba(${r},${g},${b},${labelA})`;
  ctx.font = `600 ${clamp(9, 11, w * 0.11)}px 'Barlow', sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.letterSpacing = '1px';
  ctx.fillText(obj.label, cx, y + h * 0.82);

  // Secret indicator dot (very subtle)
  if (isSecret && !isSel) {
    const dotA = 0.3 + Math.sin(pulse * 0.07) * 0.2;
    ctx.fillStyle = `rgba(${r},${g},${b},${dotA})`;
    ctx.beginPath();
    ctx.arc(x + w - 8, y + 8, 3, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore();
}

function drawIcon(type, cx, cy, s, r, g, b, alpha) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.strokeStyle = `rgba(${r},${g},${b},${alpha})`;
  ctx.fillStyle = `rgba(${r},${g},${b},${alpha * 0.25})`;
  ctx.lineWidth = 1.5;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  switch (type) {
    case 'bookshelf':
      ctx.beginPath(); ctx.rect(-s*.5,-s*.45,s,s*.9); ctx.fill(); ctx.stroke();
      for (let i = -3; i <= 3; i++) {
        const bx = i * s * 0.17;
        ctx.beginPath(); ctx.moveTo(bx,-s*.4); ctx.lineTo(bx,s*.4); ctx.stroke();
      }
      for (let j = -1; j <= 1; j++) {
        ctx.beginPath(); ctx.moveTo(-s*.45, j*s*.22); ctx.lineTo(s*.45, j*s*.22); ctx.stroke();
      }
      break;

    case 'desk':
      ctx.beginPath(); ctx.rect(-s*.6,-s*.1,s*1.2,s*.2); ctx.fill(); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-s*.45,s*.1); ctx.lineTo(-s*.45,s*.55);
      ctx.moveTo(s*.45,s*.1); ctx.lineTo(s*.45,s*.55);
      ctx.stroke();
      ctx.beginPath(); ctx.rect(-s*.35,-s*.25,s*.4,s*.15); ctx.stroke();
      break;

    case 'painting':
      ctx.beginPath(); ctx.rect(-s*.55,-s*.45,s*1.1,s*.9); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.rect(-s*.42,-s*.32,s*.84,s*.64); ctx.stroke();
      ctx.strokeStyle = `rgba(${r},${g},${b},${alpha * 0.5})`;
      ctx.beginPath(); ctx.arc(-s*.1, s*.1, s*.2, Math.PI, 0); ctx.stroke();
      ctx.beginPath(); ctx.arc(s*.2, s*.05, s*.12, Math.PI, 0); ctx.stroke();
      break;

    case 'clock':
      ctx.beginPath(); ctx.arc(0,0,s*.48,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(0,0,s*.42,0,Math.PI*2); ctx.stroke();
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-s*.32); ctx.stroke();
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(s*.24,0); ctx.stroke();
      ctx.beginPath(); ctx.arc(0,0,s*.06,0,Math.PI*2); ctx.fill();
      break;

    case 'door':
      ctx.beginPath(); ctx.rect(-s*.48,-s*.5,s*.96,s); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.rect(-s*.38,-s*.4,s*.34,s*.36); ctx.stroke();
      ctx.beginPath(); ctx.rect(-s*.38,s*.08,s*.34,s*.24); ctx.stroke();
      ctx.beginPath(); ctx.arc(s*.22,s*.05,s*.09,0,Math.PI*2); ctx.stroke();
      break;

    case 'microscope':
      ctx.beginPath();
      ctx.moveTo(-s*.2,s*.5); ctx.lineTo(s*.2,s*.5);
      ctx.moveTo(0,s*.5); ctx.lineTo(0,s*.15);
      ctx.lineTo(s*.22,-s*.1); ctx.lineTo(s*.22,-s*.38);
      ctx.stroke();
      ctx.beginPath(); ctx.arc(s*.22,-s*.38,s*.14,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-s*.25,s*.15); ctx.lineTo(s*.25,s*.15); ctx.stroke();
      break;

    case 'whiteboard':
      ctx.beginPath(); ctx.rect(-s*.6,-s*.48,s*1.2,s*.88); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = `rgba(${r},${g},${b},${alpha * 0.45})`;
      ctx.lineWidth = 1;
      const rows = [-0.28, -0.1, 0.08, 0.26];
      const rowLens = [0.85, 0.6, 0.75, 0.45];
      for (let i = 0; i < rows.length; i++) {
        ctx.beginPath();
        ctx.moveTo(-s*0.45, rows[i]*s);
        ctx.lineTo(-s*0.45 + s*rowLens[i], rows[i]*s);
        ctx.stroke();
      }
      // circled note
      ctx.strokeStyle = `rgba(255,80,80,${alpha * 0.7})`;
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.ellipse(s*.2, s*.26, s*.22, s*.1, 0, 0, Math.PI*2); ctx.stroke();
      break;

    case 'cabinet':
      ctx.beginPath(); ctx.rect(-s*.42,-s*.5,s*.84,s); ctx.fill(); ctx.stroke();
      for (let j = -1; j <= 1; j++) {
        ctx.beginPath(); ctx.rect(-s*.32, j*s*.3-s*.12, s*.64, s*.22); ctx.stroke();
        ctx.beginPath(); ctx.arc(0, j*s*.3, s*.05, 0, Math.PI*2); ctx.fill();
      }
      break;

    case 'computer':
      ctx.beginPath(); ctx.rect(-s*.48,-s*.38,s*.96,s*.68); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = `rgba(${r},${g},${b},${alpha * 0.5})`;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(-s*.35,-s*.05); ctx.lineTo(-s*.05,-s*.05);
      ctx.moveTo(-s*.35,s*.08); ctx.lineTo(s*.25,s*.08);
      ctx.moveTo(-s*.35,s*.21); ctx.lineTo(s*.1,s*.21);
      ctx.stroke();
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(-s*.18,s*.3); ctx.lineTo(s*.18,s*.3);
      ctx.moveTo(0,s*.3); ctx.lineTo(0,s*.48);
      ctx.stroke();
      break;

    case 'portrait':
      ctx.beginPath(); ctx.rect(-s*.5,-s*.5,s,s); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(0,-s*.18,s*.2,0,Math.PI*2); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-s*.38,s*.48);
      ctx.quadraticCurveTo(-s*.28,s*.12, 0, s*.02);
      ctx.quadraticCurveTo(s*.28,s*.12, s*.38,s*.48);
      ctx.stroke();
      break;

    case 'fireplace':
      ctx.beginPath();
      ctx.moveTo(-s*.55,s*.5); ctx.lineTo(-s*.55,s*.0);
      ctx.arcTo(-s*.55,-s*.5,s*.55,-s*.5,s*.52);
      ctx.arcTo(s*.55,-s*.5,s*.55,s*.0,s*.52);
      ctx.lineTo(s*.55,s*.5);
      ctx.fill(); ctx.stroke();
      // mantle
      ctx.beginPath(); ctx.rect(-s*.65,-s*.55,s*1.3,s*.1); ctx.fill(); ctx.stroke();
      // flame
      ctx.fillStyle = `rgba(255,120,30,${alpha*0.7})`;
      ctx.beginPath();
      ctx.moveTo(-s*.18,s*.45);
      ctx.quadraticCurveTo(-s*.25,s*.1, 0,-s*.12);
      ctx.quadraticCurveTo(s*.25,s*.1, s*.18,s*.45);
      ctx.closePath(); ctx.fill();
      break;

    case 'trophy':
      ctx.beginPath();
      ctx.moveTo(-s*.38,-s*.45);
      ctx.bezierCurveTo(-s*.52,s*.05, -s*.2,s*.3, 0,s*.3);
      ctx.bezierCurveTo(s*.2,s*.3, s*.52,s*.05, s*.38,-s*.45);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-s*.28,s*.45); ctx.lineTo(s*.28,s*.45);
      ctx.moveTo(-s*.18,s*.3); ctx.lineTo(s*.18,s*.3);
      ctx.moveTo(0,s*.3); ctx.lineTo(0,s*.45);
      ctx.stroke();
      break;
  }

  ctx.restore();
}

function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r);
  ctx.closePath();
}

function clamp(mn, mx, v) { return Math.max(mn, Math.min(mx, v)); }

// ── Input ─────────────────────────────────────────────────────────
canvas.addEventListener('mousemove', e => {
  if (phase !== 'playing') return;
  const hit = hitTest(e.clientX, e.clientY);
  if (hit?.id !== hovered?.id) { hovered = hit; }
  canvas.style.cursor = hit ? 'pointer' : 'default';
});

canvas.addEventListener('mouseleave', () => { hovered = null; });

canvas.addEventListener('click', e => {
  if (phase !== 'playing') return;
  const hit = hitTest(e.clientX, e.clientY);
  if (hit) inspect(hit);
});

canvas.addEventListener('touchend', e => {
  if (phase !== 'playing') return;
  e.preventDefault();
  const t = e.changedTouches[0];
  const hit = hitTest(t.clientX, t.clientY);
  if (hit) inspect(hit);
}, { passive: false });

function hitTest(cx, cy) {
  const rect = canvas.getBoundingClientRect();
  const mx = cx - rect.left, my = cy - rect.top;
  const W = canvas.width, H = canvas.height;
  const objs = LEVELS[lvlIdx].objects;
  for (let i = objs.length - 1; i >= 0; i--) {
    const o = objs[i];
    if (mx >= o.rx*W && mx <= (o.rx+o.rw)*W && my >= o.ry*H && my <= (o.ry+o.rh)*H) return o;
  }
  return null;
}

function inspect(obj) {
  selected = obj;
  document.getElementById('examine-title').textContent = obj.label;
  document.getElementById('examine-text').textContent = obj.text;
}

// ── Keypad ────────────────────────────────────────────────────────
function buildKeypad() {
  const pad = document.getElementById('keypad');
  pad.innerHTML = '';
  '1234567890⌫'.split('').forEach(k => {
    const btn = document.createElement('button');
    btn.className = 'key-btn' + (k === '⌫' ? ' del' : '');
    btn.textContent = k;
    btn.addEventListener('click', () => pressKey(k));
    btn.addEventListener('touchend', e => { e.preventDefault(); pressKey(k); }, { passive: false });
    pad.appendChild(btn);
  });
}

function pressKey(k) {
  if (phase !== 'playing') return;
  if (k === '⌫') { entered = entered.slice(0,-1); }
  else if (entered.length < 4) { entered += k; }
  updateDisplay();
  if (entered.length === 4) setTimeout(checkCode, 120);
}

function updateDisplay(mode) {
  for (let i = 0; i < 4; i++) {
    const el = document.getElementById('d'+i);
    el.textContent = entered[i] || '_';
    el.className = 'code-digit' + (mode === 'wrong' ? ' wrong' : mode === 'correct' ? ' correct' : entered[i] ? ' filled' : '');
  }
}

function checkCode() {
  const code = LEVELS[lvlIdx].code;
  if (entered === code) {
    updateDisplay('correct');
    phase = 'levelclear';
    setTimeout(showClear, 600);
  } else {
    updateDisplay('wrong');
    wrongFlash = 1;
    setTimeout(() => { entered = ''; updateDisplay(); phase = 'playing'; }, 700);
  }
}

document.addEventListener('keydown', e => {
  if (phase !== 'playing') return;
  if (e.key >= '0' && e.key <= '9') pressKey(e.key);
  else if (e.key === 'Backspace') pressKey('⌫');
});

// ── Level transitions ─────────────────────────────────────────────
function showClear() {
  const L = LEVELS[lvlIdx];
  const isLast = lvlIdx === LEVELS.length - 1;
  document.getElementById('overlay-title').textContent = isLast ? 'YOU ESCAPED!' : 'ESCAPED!';
  document.getElementById('overlay-sub').textContent   = isLast
    ? 'ALL 3 LEVELS CLEARED'
    : `LEVEL ${lvlIdx+1} CLEAR  —  CODE WAS ${L.code}`;
  document.getElementById('overlay-btn').textContent   = isLast ? 'PLAY AGAIN' : 'NEXT LEVEL →';
  document.getElementById('overlay-btn').onclick       = isLast ? resetGame : advanceLevel;

  const [r,g,b] = L.accentRgb;
  document.getElementById('overlay').style.background =
    `radial-gradient(ellipse at center, rgba(${r},${g},${b},0.18) 0%, rgba(0,0,0,0.88) 100%)`;
  document.getElementById('overlay').classList.add('active');
}

function advanceLevel() {
  lvlIdx++;
  startLevel();
}

function resetGame() {
  lvlIdx = 0;
  startLevel();
}

function startLevel() {
  entered = ''; selected = null; hovered = null; phase = 'playing';
  const L = LEVELS[lvlIdx];
  document.getElementById('level-info').textContent = `LEVEL ${lvlIdx+1} — ${L.name}`;
  document.getElementById('hud-right').textContent  = `${lvlIdx+1} / ${LEVELS.length}`;
  document.getElementById('examine-title').textContent = 'EXAMINE';
  document.getElementById('examine-text').textContent  = 'Click on an object in the room to inspect it.';
  document.getElementById('overlay').classList.remove('active');
  updateDisplay();
  applyTheme();
}

// ── Game loop ─────────────────────────────────────────────────────
function loop() {
  pulse++;
  if (wrongFlash > 0) wrongFlash = Math.max(0, wrongFlash - 0.06);
  draw();
  requestAnimationFrame(loop);
}

// ── Boot ──────────────────────────────────────────────────────────
applyTheme();
buildKeypad();
startLevel();
loop();

})();
</script>
