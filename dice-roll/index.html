<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUCKY SIXES</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    min-height: 100vh;
    background: #0a0700;
    font-family: 'Barlow', 'Courier New', sans-serif;
    color: #fff;
    overflow-x: hidden;
    user-select: none;
    -webkit-user-select: none;
    -ms-user-select: none;
    -moz-user-select: none;
    -webkit-touch-callout: none;
  }

  body {
    background:
      radial-gradient(ellipse at 20% 0%, rgba(255,180,0,0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 100%, rgba(255,90,0,0.08) 0%, transparent 50%),
      #0a0700;
    min-height: 100vh;
    padding: 18px 14px 60px;
  }

  .back {
    display: inline-block;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(255,200,70,0.65);
    text-decoration: none;
    border: 1px solid rgba(255,200,70,0.35);
    padding: 6px 14px;
    border-radius: 4px;
    transition: background 0.15s;
  }
  .back:hover { background: rgba(255,200,70,0.1); }

  header {
    text-align: center;
    margin: 18px 0 26px;
  }

  .title {
    font-family: 'Bebas Neue', cursive;
    font-size: clamp(40px, 9vw, 76px);
    letter-spacing: 10px;
    color: #ffd24a;
    text-shadow:
      0 0 18px rgba(255,180,0,0.8),
      0 0 40px rgba(255,140,0,0.35);
    line-height: 1;
  }
  .subtitle {
    margin-top: 6px;
    font-size: 11px;
    letter-spacing: 5px;
    color: rgba(255,255,255,0.3);
    text-transform: uppercase;
  }

  .layout {
    max-width: 980px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 22px;
  }
  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; }
  }

  .stage {
    background: linear-gradient(160deg, #1a0d00 0%, #0c0500 100%);
    border: 1px solid rgba(255,200,70,0.25);
    border-radius: 14px;
    padding: 22px;
    box-shadow: 0 4px 30px rgba(255,160,0,0.08);
  }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 18px;
  }
  .stat {
    background: rgba(255,200,70,0.06);
    border: 1px solid rgba(255,200,70,0.15);
    border-radius: 8px;
    padding: 10px 12px;
    text-align: center;
  }
  .stat-label {
    font-size: 9px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.4);
    margin-bottom: 5px;
  }
  .stat-val {
    font-family: 'Bebas Neue', cursive;
    font-size: 26px;
    color: #ffd24a;
    letter-spacing: 2px;
  }
  .stat-val.money { color: #7fffa0; }
  .stat-val.streak { color: #ff8a50; }

  .dice-area {
    min-height: 200px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 16px;
    padding: 20px 10px;
    background:
      radial-gradient(ellipse at center, rgba(255,180,0,0.08) 0%, transparent 70%),
      rgba(0,0,0,0.35);
    border-radius: 10px;
    margin-bottom: 18px;
  }

  .dice {
    width: 72px;
    height: 72px;
    background: linear-gradient(135deg, #fff 0%, #e8e4d6 100%);
    border-radius: 12px;
    position: relative;
    box-shadow:
      inset 0 -4px 6px rgba(0,0,0,0.15),
      inset 0 3px 3px rgba(255,255,255,0.6),
      0 6px 14px rgba(0,0,0,0.5),
      0 0 20px rgba(255,200,70,0.2);
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    padding: 10px;
    transition: transform 0.15s;
  }
  .dice.six { box-shadow:
      inset 0 -4px 6px rgba(0,0,0,0.15),
      inset 0 3px 3px rgba(255,255,255,0.6),
      0 6px 14px rgba(0,0,0,0.5),
      0 0 28px rgba(255,200,70,0.9),
      0 0 44px rgba(255,130,0,0.55); }
  .dice.rolling { animation: shake 0.08s infinite alternate; }

  @keyframes shake {
    from { transform: translate(-3px, -2px) rotate(-4deg); }
    to   { transform: translate(3px, 2px) rotate(4deg); }
  }

  .pip {
    background: #1a1200;
    border-radius: 50%;
    box-shadow: inset 0 1px 1px rgba(0,0,0,0.5);
    align-self: center;
    justify-self: center;
    width: 12px;
    height: 12px;
    opacity: 0;
  }
  .pip.on { opacity: 1; }

  /* Pip positions via grid cells */
  /* 1: center */
  /* 2: top-left, bot-right */
  /* 3: top-left, center, bot-right */
  /* 4: corners */
  /* 5: corners + center */
  /* 6: left col + right col */

  .roll-btn {
    display: block;
    width: 100%;
    padding: 16px;
    font-family: 'Bebas Neue', cursive;
    font-size: 26px;
    letter-spacing: 5px;
    color: #1a0900;
    background: linear-gradient(180deg, #ffd24a 0%, #ff9a20 100%);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.15s;
    box-shadow: 0 4px 18px rgba(255,160,0,0.4);
  }
  .roll-btn { position: relative; overflow: hidden; }
  .roll-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 7px 22px rgba(255,160,0,0.55); }
  .roll-btn:active:not(:disabled) { transform: translateY(1px); }
  .roll-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .roll-btn .cd-bar {
    position: absolute; left: 0; bottom: 0; height: 4px;
    background: linear-gradient(90deg, #ff4400, #ffd24a);
    border-radius: 0 0 10px 10px;
    transition: width 0.05s linear;
  }

  .message {
    text-align: center;
    margin: 14px 0 4px;
    min-height: 22px;
    font-size: 13px;
    letter-spacing: 2px;
    color: rgba(255,255,255,0.7);
    text-transform: uppercase;
  }
  .message.win { color: #7fffa0; font-weight: 700; }
  .message.jackpot {
    color: #ffd24a;
    font-family: 'Bebas Neue', cursive;
    font-size: 22px;
    letter-spacing: 4px;
    text-shadow: 0 0 16px rgba(255,200,70,0.8);
  }

  .shop {
    background: linear-gradient(160deg, #13080a 0%, #090305 100%);
    border: 1px solid rgba(255,90,130,0.25);
    border-radius: 14px;
    padding: 20px;
    box-shadow: 0 4px 30px rgba(255,60,120,0.06);
  }

  .shop-title {
    font-family: 'Bebas Neue', cursive;
    font-size: 24px;
    letter-spacing: 4px;
    color: #ff6a8a;
    margin-bottom: 14px;
    text-align: center;
    text-shadow: 0 0 14px rgba(255,90,130,0.5);
  }

  .upgrade {
    background: rgba(255,90,130,0.05);
    border: 1px solid rgba(255,90,130,0.15);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
  }
  .upgrade:hover:not(.locked) { background: rgba(255,90,130,0.12); border-color: rgba(255,90,130,0.4); }
  .upgrade:active:not(.locked) { transform: scale(0.98); }
  .upgrade.locked { opacity: 0.42; cursor: not-allowed; }
  .upgrade.maxed { opacity: 0.55; cursor: default; }

  .upg-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
  }
  .upg-name {
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 1px;
    color: #ffb8c8;
  }
  .upg-lvl {
    font-size: 10px;
    letter-spacing: 2px;
    color: rgba(255,255,255,0.4);
  }
  .upg-desc {
    font-size: 11px;
    color: rgba(255,255,255,0.5);
    margin: 4px 0 6px;
    line-height: 1.4;
  }
  .upg-foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
  }
  .upg-cost {
    color: #7fffa0;
    letter-spacing: 1px;
    font-weight: 700;
  }
  .upg-effect {
    color: rgba(255,200,70,0.7);
    font-size: 10px;
    letter-spacing: 1px;
  }

  .reset-btn {
    margin-top: 8px;
    width: 100%;
    padding: 8px;
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.35);
    background: transparent;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 6px;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }
  .reset-btn:hover {
    color: rgba(255,90,90,0.8);
    border-color: rgba(255,90,90,0.4);
  }

  /* Floating coin text */
  .float-text {
    position: absolute;
    pointer-events: none;
    font-family: 'Bebas Neue', cursive;
    font-size: 22px;
    color: #7fffa0;
    text-shadow: 0 0 12px rgba(127,255,160,0.8);
    animation: float-up 1.1s ease-out forwards;
    letter-spacing: 2px;
  }
  @keyframes float-up {
    0%   { transform: translateY(0) scale(0.8); opacity: 0; }
    15%  { transform: translateY(-10px) scale(1.1); opacity: 1; }
    100% { transform: translateY(-70px) scale(1); opacity: 0; }
  }

  .streak-meter {
    display: flex;
    gap: 6px;
    justify-content: center;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .streak-cell {
    width: 22px;
    height: 22px;
    border-radius: 5px;
    border: 1px solid rgba(255,200,70,0.3);
    background: rgba(255,200,70,0.04);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    color: rgba(255,255,255,0.35);
    font-weight: 700;
  }
  .streak-cell.lit {
    background: linear-gradient(160deg, #ffd24a, #ff9a20);
    color: #1a0900;
    border-color: #ffd24a;
    box-shadow: 0 0 12px rgba(255,200,70,0.7);
  }

  /* ── Unified Arcade HUD (canonical, 48px fixed height) ── */
  #top-bar, .top-bar, .topbar, #topBar {
    box-sizing: border-box !important;
    width: 100% !important;
    max-width: none !important;
    height: 48px !important;
    min-height: 48px !important;
    padding: 0 12px !important;
    margin: 0 !important;
    gap: 10px !important;
    display: flex !important;
    align-items: center !important;
    justify-content: space-between !important;
    font-family: 'Barlow', 'Courier New', sans-serif !important;
    background: rgba(8,8,14,0.88) !important;
    border-bottom: 1px solid rgba(255,255,255,0.1) !important;
    backdrop-filter: blur(10px) !important;
    -webkit-backdrop-filter: blur(10px) !important;
    flex-shrink: 0 !important;
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    right: 0 !important;
    z-index: 100 !important;
  }
  body { padding-top: 48px !important; }
  #top-bar h1, .top-bar h1, .topbar h1, #topBar h1,
  #top-bar .top-title, .top-bar .top-title {
    font-family: 'Bebas Neue','Barlow',sans-serif !important;
    font-size: 22px !important;
    letter-spacing: 3px !important;
    font-weight: 700 !important;
    flex: 1 1 auto !important;
    text-align: center !important;
    margin: 0 !important;
    padding: 0 !important;
    position: static !important;
    transform: none !important;
    white-space: nowrap !important;
    overflow: hidden !important;
    text-overflow: ellipsis !important;
    line-height: 1 !important;
    pointer-events: none !important;
    color: #ffd24a !important;
    text-shadow: 0 0 10px rgba(255,180,0,0.5) !important;
  }
  #top-bar #back-btn, .top-bar #back-btn, .topbar #back-btn, #topBar #back-btn,
  #top-bar a.top-btn[href="/"], .top-bar a.top-btn[href="/"],
  #topBar > a[href="/"],
  #top-bar a.back[href="/"],
  a.icon-btn[href="/"] {
    font-family: 'Barlow', 'Courier New', sans-serif !important;
    font-size: 11px !important;
    font-weight: 600 !important;
    letter-spacing: 2px !important;
    text-transform: uppercase !important;
    padding: 0 12px !important;
    border-radius: 4px !important;
    border: 1px solid currentColor !important;
    background: rgba(0,0,0,0.35) !important;
    text-decoration: none !important;
    line-height: 1 !important;
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    height: 30px !important;
    min-height: 30px !important;
    width: auto !important;
    min-width: 0 !important;
    white-space: nowrap !important;
    flex-shrink: 0 !important;
    box-sizing: border-box !important;
    position: static !important;
    top: auto !important;
    left: auto !important;
    color: rgba(255,200,70,0.85) !important;
  }
  #top-bar #fs-btn, .top-bar #fs-btn, .topbar #fs-btn, #topBar #fs-btn,
  #top-bar #fsBtn, #topBar #fsBtn {
    width: 32px !important;
    height: 30px !important;
    min-width: 32px !important;
    min-height: 30px !important;
    padding: 0 !important;
    border-radius: 4px !important;
    border: 1px solid currentColor !important;
    background: rgba(0,0,0,0.35) !important;
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    font-size: 14px !important;
    flex-shrink: 0 !important;
    box-sizing: border-box !important;
    color: rgba(255,200,70,0.85) !important;
  }
  #top-bar #top-right, .top-bar #top-right {
    display: flex !important;
    align-items: center !important;
    justify-content: flex-end !important;
    gap: 6px !important;
    flex-shrink: 0 !important;
    min-width: 70px !important;
  }
</style>
</head>
<body>

<div id="top-bar">
  <a id="back-btn" href="/">&larr; HUB</a>
  <h1>LUCKY SIXES</h1>
  <div id="top-right"></div>
</div>

<header>
  <div class="title">LUCKY SIXES</div>
  <div class="subtitle">Roll sixes in a row to hit the jackpot</div>
</header>

<div class="layout">

  <div class="stage">
    <div class="stats-row">
      <div class="stat">
        <div class="stat-label">Coins</div>
        <div class="stat-val money" id="money">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Streak</div>
        <div class="stat-val streak" id="streak">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Best</div>
        <div class="stat-val" id="best">0</div>
      </div>
    </div>

    <div class="streak-meter" id="streak-meter"></div>

    <div class="dice-area" id="dice-area"></div>

    <div class="message" id="message">Press ROLL to begin</div>

    <button class="roll-btn" id="roll-btn">ROLL</button>
  </div>

  <aside class="shop">
    <div class="shop-title">UPGRADES</div>
    <div id="shop-list"></div>
    <button class="reset-btn" id="reset-btn">Reset save</button>
  </aside>

</div>

<script>
(() => {
  const SAVE_KEY = 'lucky-sixes-save';

  // ── Upgrade defs ──────────────────────────────────────────────
  // Each upgrade: id, name, desc(level), baseCost, costMul, effect(level), maxLvl
  const UPGRADES = [
    {
      id: 'luck',
      name: 'Loaded Dice',
      desc: lvl => `Chance for a six: ${ (sixChance(lvl) * 100).toFixed(1) }%`,
      effect: lvl => sixChance(lvl),
      baseCost: 15,
      costMul: 1.55,
      maxLvl: 20,
    },
    {
      id: 'payout',
      name: 'Coin Magnet',
      desc: lvl => `Payout x${payoutMul(lvl).toFixed(2)}`,
      effect: lvl => payoutMul(lvl),
      baseCost: 25,
      costMul: 1.7,
      maxLvl: 20,
    },
    {
      id: 'target',
      name: 'Lower The Bar',
      desc: lvl => `Jackpot needs ${targetLen(lvl)} sixes in a row`,
      effect: lvl => targetLen(lvl),
      baseCost: 400,
      costMul: 3.2,
      maxLvl: 3,
    },
    {
      id: 'multi',
      name: 'Extra Dice',
      desc: lvl => `Roll ${diceCount(lvl)} dice (any six counts)`,
      effect: lvl => diceCount(lvl),
      baseCost: 250,
      costMul: 4,
      maxLvl: 4,
    },
    {
      id: 'auto',
      name: 'Auto Roller',
      desc: lvl => lvl === 0 ? `Rolls automatically` : `Auto rolls every ${autoDelay(lvl).toFixed(2)}s`,
      effect: lvl => autoDelay(lvl),
      baseCost: 500,
      costMul: 2.1,
      maxLvl: 10,
    },
    {
      id: 'jackbonus',
      name: 'Jackpot Boost',
      desc: lvl => `Jackpot prize x${jackMul(lvl).toFixed(1)}`,
      effect: lvl => jackMul(lvl),
      baseCost: 800,
      costMul: 2.3,
      maxLvl: 15,
    },
    {
      id: 'speed',
      name: 'Quick Hands',
      desc: lvl => `Roll cooldown: ${rollCooldown(lvl).toFixed(1)}s`,
      effect: lvl => rollCooldown(lvl),
      baseCost: 20,
      costMul: 1.6,
      maxLvl: 12,
    },
  ];

  function sixChance(lvl)   { return Math.min(0.62, 1/6 + lvl * 0.022); }
  function payoutMul(lvl)   { return 1 + lvl * 0.35; }
  function targetLen(lvl)   { return [6, 5, 4, 3][lvl] || 3; }
  function diceCount(lvl)   { return 1 + lvl; }
  function autoDelay(lvl)   { return lvl === 0 ? 0 : Math.max(0.25, 1.5 - (lvl - 1) * 0.14); }
  function jackMul(lvl)     { return 1 + lvl * 0.6; }
  function rollCooldown(lvl){ return Math.max(0.3, 2.0 - lvl * 0.15); }

  function costOf(u, lvl) { return Math.floor(u.baseCost * Math.pow(u.costMul, lvl)); }

  // ── State ─────────────────────────────────────────────────────
  const state = {
    money: 0,
    best: 0,
    streak: 0,
    levels: Object.fromEntries(UPGRADES.map(u => [u.id, 0])),
  };

  function save() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) {}
  }
  function load() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return;
      const d = JSON.parse(raw);
      if (typeof d.money === 'number') state.money = d.money;
      if (typeof d.best === 'number') state.best = d.best;
      if (typeof d.streak === 'number') state.streak = d.streak;
      if (d.levels) {
        for (const u of UPGRADES) {
          if (typeof d.levels[u.id] === 'number') {
            state.levels[u.id] = Math.min(u.maxLvl, Math.max(0, d.levels[u.id] | 0));
          }
        }
      }
    } catch (e) {}
  }
  load();

  // ── DOM ───────────────────────────────────────────────────────
  const diceArea = document.getElementById('dice-area');
  const moneyEl  = document.getElementById('money');
  const streakEl = document.getElementById('streak');
  const bestEl   = document.getElementById('best');
  const meterEl  = document.getElementById('streak-meter');
  const msgEl    = document.getElementById('message');
  const rollBtn  = document.getElementById('roll-btn');
  const shopEl   = document.getElementById('shop-list');
  const resetBtn = document.getElementById('reset-btn');

  // Pip layouts: for each value 1-6, the list of grid cells (1..9, row-major) that get a pip
  const PIPS = {
    1: [5],
    2: [1, 9],
    3: [1, 5, 9],
    4: [1, 3, 7, 9],
    5: [1, 3, 5, 7, 9],
    6: [1, 3, 4, 6, 7, 9],
  };

  function buildDice(value, isSix) {
    const d = document.createElement('div');
    d.className = 'dice' + (isSix ? ' six' : '');
    const on = new Set(PIPS[value] || []);
    for (let i = 1; i <= 9; i++) {
      const p = document.createElement('div');
      p.className = 'pip' + (on.has(i) ? ' on' : '');
      d.appendChild(p);
    }
    return d;
  }

  function setDice(values) {
    diceArea.innerHTML = '';
    values.forEach(v => diceArea.appendChild(buildDice(v, v === 6)));
  }

  function updateHUD() {
    moneyEl.textContent  = formatNum(state.money);
    streakEl.textContent = state.streak;
    bestEl.textContent   = state.best;
    renderMeter();
    renderShop();
  }

  function renderMeter() {
    const target = targetLen(state.levels.target);
    meterEl.innerHTML = '';
    for (let i = 0; i < target; i++) {
      const c = document.createElement('div');
      c.className = 'streak-cell' + (i < state.streak ? ' lit' : '');
      c.textContent = '6';
      meterEl.appendChild(c);
    }
  }

  function renderShop() {
    shopEl.innerHTML = '';
    for (const u of UPGRADES) {
      const lvl = state.levels[u.id];
      const maxed = lvl >= u.maxLvl;
      const cost = maxed ? 0 : costOf(u, lvl);
      const affordable = state.money >= cost;
      const row = document.createElement('div');
      row.className = 'upgrade' + (maxed ? ' maxed' : (!affordable ? ' locked' : ''));

      row.innerHTML =
        `<div class="upg-head">
           <span class="upg-name">${u.name}</span>
           <span class="upg-lvl">Lv ${lvl}${u.maxLvl !== Infinity ? ' / ' + u.maxLvl : ''}</span>
         </div>
         <div class="upg-desc">${u.desc(lvl)}</div>
         <div class="upg-foot">
           <span class="upg-cost">${maxed ? 'MAXED' : formatNum(cost) + ' coins'}</span>
           <span class="upg-effect">next: ${maxed ? '—' : u.desc(lvl + 1).replace(/^[^:]*:\s*/, '')}</span>
         </div>`;

      if (!maxed && affordable) {
        row.addEventListener('click', () => buyUpgrade(u));
      }
      shopEl.appendChild(row);
    }
  }

  function buyUpgrade(u) {
    const lvl = state.levels[u.id];
    if (lvl >= u.maxLvl) return;
    const cost = costOf(u, lvl);
    if (state.money < cost) return;
    state.money -= cost;
    state.levels[u.id] = lvl + 1;
    if (u.id === 'target') state.streak = 0; // reset progress when goal length changes
    if (u.id === 'auto' && lvl === 0) restartAuto();
    else if (u.id === 'auto') restartAuto();
    save();
    updateHUD();
  }

  function formatNum(n) {
    if (n < 1000) return Math.floor(n).toString();
    if (n < 1e6)  return (n / 1e3).toFixed(n < 1e4 ? 2 : 1) + 'K';
    if (n < 1e9)  return (n / 1e6).toFixed(2) + 'M';
    if (n < 1e12) return (n / 1e9).toFixed(2) + 'B';
    return (n / 1e12).toFixed(2) + 'T';
  }

  function spawnFloat(text, x, y, color) {
    const el = document.createElement('div');
    el.className = 'float-text';
    el.textContent = text;
    if (color) el.style.color = color;
    el.style.left = x + 'px';
    el.style.top  = y + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1200);
  }

  // ── Rolling logic ─────────────────────────────────────────────
  let rolling = false;
  let onCooldown = false;
  let cdBar = null;

  // Create cooldown bar element inside roll button
  (function initCdBar() {
    cdBar = document.createElement('div');
    cdBar.className = 'cd-bar';
    cdBar.style.width = '0%';
    rollBtn.appendChild(cdBar);
  })();

  function startCooldown() {
    const cd = rollCooldown(state.levels.speed) * 1000;
    onCooldown = true;
    rollBtn.disabled = true;
    const start = performance.now();
    cdBar.style.width = '100%';
    function tick() {
      const elapsed = performance.now() - start;
      const pct = Math.max(0, 1 - elapsed / cd) * 100;
      cdBar.style.width = pct + '%';
      if (elapsed >= cd) {
        onCooldown = false;
        rollBtn.disabled = false;
        cdBar.style.width = '0%';
        return;
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }

  function rollValue() {
    const p = sixChance(state.levels.luck);
    if (Math.random() < p) return 6;
    // Uniform 1-5 for non-six
    return 1 + Math.floor(Math.random() * 5);
  }

  function doRoll() {
    if (rolling || onCooldown) return;
    rolling = true;
    rollBtn.disabled = true;

    const count = diceCount(state.levels.multi);
    // animate dice shaking
    setDice(Array.from({ length: count }, () => 1 + Math.floor(Math.random() * 6)));
    for (const d of diceArea.children) d.classList.add('rolling');

    let ticks = 0;
    const spinTimer = setInterval(() => {
      setDice(Array.from({ length: count }, () => 1 + Math.floor(Math.random() * 6)));
      for (const d of diceArea.children) d.classList.add('rolling');
      ticks++;
      if (ticks >= 5) {
        clearInterval(spinTimer);
        finalizeRoll(count);
      }
    }, 70);
  }

  function finalizeRoll(count) {
    const results = Array.from({ length: count }, () => rollValue());
    setDice(results);
    const hasSix = results.includes(6);
    const target = targetLen(state.levels.target);
    const mult = payoutMul(state.levels.payout);

    if (hasSix) {
      state.streak++;
      // small reward per six
      const sixes = results.filter(v => v === 6).length;
      const reward = Math.floor(sixes * 1 * mult);
      state.money += reward;
      floatFromDice(`+${formatNum(reward)}`, '#7fffa0');

      if (state.streak > state.best) state.best = state.streak;

      if (state.streak >= target) {
        // JACKPOT
        const base = 50 * Math.pow(2, 6 - target);
        const prize = Math.floor(base * mult * jackMul(state.levels.jackbonus) * (target * target));
        state.money += prize;
        msgEl.className = 'message jackpot';
        msgEl.textContent = `★ JACKPOT! +${formatNum(prize)} ★`;
        state.streak = 0;
        floatFromDice(`+${formatNum(prize)}`, '#ffd24a');
      } else {
        msgEl.className = 'message win';
        msgEl.textContent = `Six! ${state.streak} / ${target}`;
      }
    } else {
      if (state.streak > 0) {
        msgEl.className = 'message';
        msgEl.textContent = `Streak broken at ${state.streak}`;
      } else {
        msgEl.className = 'message';
        msgEl.textContent = 'No six — try again';
      }
      state.streak = 0;
    }

    save();
    updateHUD();
    rolling = false;
    startCooldown();
  }

  function floatFromDice(text, color) {
    const rect = diceArea.getBoundingClientRect();
    const x = rect.left + rect.width / 2 - 20 + (Math.random() - 0.5) * 80;
    const y = rect.top + rect.height / 2 - 10;
    spawnFloat(text, x, y, color);
  }

  // ── Auto roller ───────────────────────────────────────────────
  let autoTimer = null;
  function restartAuto() {
    if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
    const lvl = state.levels.auto;
    if (lvl === 0) return;
    const delay = autoDelay(lvl) * 1000;
    autoTimer = setInterval(() => {
      if (!rolling && !onCooldown) doRoll();
    }, Math.max(120, delay));
  }

  // ── Init ──────────────────────────────────────────────────────
  rollBtn.addEventListener('click', doRoll);
  resetBtn.addEventListener('click', () => {
    if (!confirm('Reset all progress?')) return;
    state.money = 0;
    state.best = 0;
    state.streak = 0;
    for (const u of UPGRADES) state.levels[u.id] = 0;
    save();
    restartAuto();
    updateHUD();
    setDice([1]);
    msgEl.className = 'message';
    msgEl.textContent = 'Press ROLL to begin';
  });

  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'Enter') {
      e.preventDefault();
      if (!rolling && !onCooldown) doRoll();
    }
  });

  setDice([1]);
  updateHUD();
  restartAuto();
})();
</script>
</body>
</html>
