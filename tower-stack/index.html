<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>TOWER STACK</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0d0208; font-family: 'Barlow', monospace; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; touch-action: none; user-select: none; }

  #top-bar {
    display: flex; align-items: center; width: 100%; max-width: 660px;
    padding: 0 4px 6px; gap: 12px;
  }
  #back-btn {
    background: rgba(0,0,0,0.5); border: 1px solid rgba(255,34,136,0.3);
    color: rgba(255,34,136,0.7); font-family: 'Barlow', sans-serif;
    font-size: 11px; font-weight: 600; letter-spacing: 1px; padding: 5px 12px;
    cursor: pointer; text-decoration: none; border-radius: 4px;
    white-space: nowrap; flex-shrink: 0; transition: background 0.15s, color 0.15s;
  }
  #back-btn:hover { background: rgba(255,34,136,0.15); color: #ff2288; }

  h1 {
    font-family: 'Bebas Neue', cursive; color: #ff2288; font-size: 2rem;
    letter-spacing: 0.15em; text-shadow: 0 0 20px rgba(255,34,136,0.4); flex: 1; text-align: center;
  }
  #top-spacer { width: 70px; flex-shrink: 0; display: flex; justify-content: flex-end; align-items: center; }
  #fs-btn {
    background: rgba(0,0,0,0.5); border: 1px solid rgba(255,34,136,0.3);
    color: rgba(255,34,136,0.7); border-radius: 4px; cursor: pointer;
    width: 32px; height: 28px; display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, color 0.15s; flex-shrink: 0;
  }
  #fs-btn:hover { background: rgba(255,34,136,0.15); color: #ff2288; }

  #gameCanvas {
    display: block; max-width: 100%;
    border: 1px solid rgba(255,34,136,0.12); border-radius: 6px;
    box-shadow: 0 0 60px rgba(255,34,136,0.1), 0 0 0 1px rgba(255,34,136,0.06);
  }
  #hint {
    margin-top: 8px; color: rgba(255,255,255,0.18); font-size: 0.68rem;
    letter-spacing: 0.08em; text-transform: uppercase;
  }

  /* ── Unified Arcade HUD (canonical, 48px height) ── */
  #top-bar, .top-bar, .topbar, #topBar {
    box-sizing: border-box !important;
    width: 100% !important;
    max-width: none !important;
    height: 48px !important;
    min-height: 48px !important;
    padding: 0 12px !important;
    margin: 0 !important;
    gap: 10px !important;
    display: flex !important;
    align-items: center !important;
    justify-content: space-between !important;
    font-family: 'Barlow', 'Courier New', sans-serif !important;
    background: rgba(8,8,14,0.88) !important;
    border-bottom: 1px solid rgba(255,255,255,0.1) !important;
    backdrop-filter: blur(10px) !important;
    -webkit-backdrop-filter: blur(10px) !important;
    flex-shrink: 0 !important;
    position: relative !important;
    z-index: 100 !important;
  }
  #top-bar h1, .top-bar h1, .topbar h1, #topBar h1,
  #top-bar .title, .top-bar .title, .topbar .title, #topBar .title,
  #top-bar .top-title, .top-bar .top-title {
    font-family: 'Bebas Neue','Barlow',sans-serif !important;
    font-size: 22px !important;
    letter-spacing: 3px !important;
    font-weight: 700 !important;
    flex: 1 1 auto !important;
    text-align: center !important;
    margin: 0 !important;
    padding: 0 !important;
    position: static !important;
    transform: none !important;
    white-space: nowrap !important;
    overflow: hidden !important;
    text-overflow: ellipsis !important;
    line-height: 1 !important;
    pointer-events: none !important;
  }
  #top-bar #back-btn, .top-bar #back-btn, .topbar #back-btn, #topBar #back-btn,
  #top-bar a.top-btn[href="/"], .top-bar a.top-btn[href="/"],
  #topBar > a[href="/"],
  a.back[href="/"],
  a.icon-btn[href="/"] {
    font-family: 'Barlow', 'Courier New', sans-serif !important;
    font-size: 11px !important;
    font-weight: 600 !important;
    letter-spacing: 2px !important;
    text-transform: uppercase !important;
    padding: 0 12px !important;
    border-radius: 4px !important;
    border: 1px solid currentColor !important;
    background: rgba(0,0,0,0.35) !important;
    text-decoration: none !important;
    line-height: 1 !important;
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    height: 30px !important;
    min-height: 30px !important;
    width: auto !important;
    min-width: 0 !important;
    white-space: nowrap !important;
    flex-shrink: 0 !important;
    box-sizing: border-box !important;
  }
  #top-bar #fs-btn, .top-bar #fs-btn, .topbar #fs-btn, #topBar #fs-btn,
  #top-bar #fsBtn, #topBar #fsBtn,
  #top-bar button.icon-btn:not([href="/"]), .topbar button.icon-btn:not([href="/"]) {
    width: 32px !important;
    height: 30px !important;
    min-width: 32px !important;
    min-height: 30px !important;
    padding: 0 !important;
    border-radius: 4px !important;
    border: 1px solid currentColor !important;
    background: rgba(0,0,0,0.35) !important;
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    font-size: 14px !important;
    flex-shrink: 0 !important;
    box-sizing: border-box !important;
  }
  #top-bar #top-spacer, .top-bar #top-spacer, .topbar #top-spacer, #topBar #top-spacer {
    flex-shrink: 0 !important;
    display: flex !important;
    align-items: center !important;
    justify-content: flex-end !important;
    gap: 6px !important;
    min-width: 0 !important;
    width: auto !important;
  }
  /* Freestanding back link (used when game has no top-bar container) */
  body > a.back[href="/"] {
    position: fixed !important;
    top: 9px !important;
    left: 12px !important;
    z-index: 200 !important;
  }
</style>
</head>
<body>
<div id="top-bar">
  <a id="back-btn" href="/">&#8592; HUB</a>
  <h1>TOWER STACK</h1>
  <div id="top-spacer">
    <button id="fs-btn" title="Fullscreen">&#x26F6;</button>
  </div>
</div>
<canvas id="gameCanvas"></canvas>
<div id="hint">TAP / CLICK / SPACE &mdash; DROP BLOCK</div>

<script>
(function() {
  "use strict";

  // --- Fullscreen ---
  const fsBtn = document.getElementById('fs-btn');
  fsBtn.addEventListener('click', () => {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
    } else {
      document.exitFullscreen();
    }
  });

  // --- Canvas setup ---
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  function resize() {
    const bar = document.getElementById('top-bar');
    const hint = document.getElementById('hint');
    const barH = bar.offsetHeight + 6;
    const hintH = hint.offsetHeight + 8;
    const maxW = 660;
    const availW = Math.min(window.innerWidth, maxW);
    const availH = window.innerHeight - barH - hintH - 12;
    const aspect = 9 / 16;
    let w = availW;
    let h = w / aspect;
    if (h > availH) { h = availH; w = h * aspect; }
    canvas.width = Math.floor(w * devicePixelRatio);
    canvas.height = Math.floor(h * devicePixelRatio);
    canvas.style.width = Math.floor(w) + 'px';
    canvas.style.height = Math.floor(h) + 'px';
  }
  window.addEventListener('resize', resize);
  resize();

  // --- Constants ---
  const NEON_PALETTE = [
    '#ff2288', '#ff0066', '#ff44aa', '#ee00ff', '#aa00ff',
    '#6600ff', '#0044ff', '#00aaff', '#00ffcc', '#00ff66',
    '#aaff00', '#ffcc00', '#ff8800', '#ff4400', '#ff0044'
  ];

  const BLOCK_HEIGHT = 30;
  const DEPTH_OFFSET = 6;
  const BASE_SPEED = 2.0;
  const SPEED_INCREMENT = 0.12;
  const PERFECT_TOLERANCE = 3;
  const STORAGE_KEY = 'tower_stack_highscore';

  // --- Game state ---
  let state = 'waiting'; // waiting, playing, gameover
  let score = 0;
  let combo = 0;
  let highScore = parseInt(localStorage.getItem(STORAGE_KEY) || '0', 10);
  let tower = [];        // { x, width, color, perfectDrop, flashTimer }
  let currentBlock = null;
  let fallingPieces = [];
  let particles = [];
  let cameraY = 0;
  let targetCameraY = 0;
  let bgHue = 270;
  let flashScreen = 0;

  function getColor(index) {
    return NEON_PALETTE[index % NEON_PALETTE.length];
  }

  function getBaseWidth() {
    return Math.floor(canvas.width * 0.38);
  }

  function getBaseX() {
    return (canvas.width - getBaseWidth()) / 2;
  }

  function getGroundY() {
    return canvas.height - 60 * devicePixelRatio;
  }

  function blockY(index) {
    return getGroundY() - (index + 1) * BLOCK_HEIGHT * devicePixelRatio;
  }

  function initGame() {
    score = 0;
    combo = 0;
    tower = [];
    fallingPieces = [];
    particles = [];
    cameraY = 0;
    targetCameraY = 0;
    flashScreen = 0;

    // Base block
    const bw = getBaseWidth();
    const bx = getBaseX();
    tower.push({
      x: bx,
      width: bw,
      color: getColor(0),
      perfectDrop: false,
      flashTimer: 0
    });

    spawnBlock();
    state = 'playing';
  }

  function spawnBlock() {
    const prev = tower[tower.length - 1];
    const w = prev.width;
    const speed = (BASE_SPEED + tower.length * SPEED_INCREMENT) * devicePixelRatio;
    const dir = tower.length % 2 === 0 ? 1 : -1;
    const startX = dir > 0 ? -w : canvas.width;

    currentBlock = {
      x: startX,
      width: w,
      speed: speed * dir,
      color: getColor(tower.length),
      index: tower.length
    };
  }

  function dropBlock() {
    if (!currentBlock) return;

    const prev = tower[tower.length - 1];
    const cx = currentBlock.x;
    const cw = currentBlock.width;
    const px = prev.x;
    const pw = prev.width;

    // Calculate overlap
    const overlapLeft = Math.max(cx, px);
    const overlapRight = Math.min(cx + cw, px + pw);
    const overlapWidth = overlapRight - overlapLeft;

    if (overlapWidth <= 0) {
      // Complete miss - game over
      // The whole block falls
      fallingPieces.push({
        x: cx, width: cw,
        y: blockY(currentBlock.index) - cameraY,
        vy: 0, vx: currentBlock.speed * 0.3,
        rot: 0, vr: (Math.random() - 0.5) * 0.1,
        color: currentBlock.color,
        alpha: 1, life: 120
      });
      currentBlock = null;
      gameOver();
      return;
    }

    // Check perfect drop
    const diff = Math.abs(cx - px);
    const isPerfect = diff < PERFECT_TOLERANCE * devicePixelRatio;

    let finalX, finalW;
    if (isPerfect) {
      // Perfect alignment - use previous block's position/width
      finalX = prev.x;
      finalW = prev.width;
      combo++;
      const comboBonus = combo * 10;
      score += 10 + comboBonus;
      flashScreen = 1.0;

      // Big particle burst for perfect
      spawnParticles(prev.x + prev.width / 2, blockY(currentBlock.index), 40, currentBlock.color);
    } else {
      finalX = overlapLeft;
      finalW = overlapWidth;
      combo = 0;
      score += 10;

      // Trimmed piece(s) fall off
      if (cx < px) {
        // Left piece falls
        fallingPieces.push({
          x: cx, width: px - cx,
          y: blockY(currentBlock.index) - cameraY,
          vy: 0, vx: -2 * devicePixelRatio,
          rot: 0, vr: -0.04 - Math.random() * 0.06,
          color: currentBlock.color,
          alpha: 1, life: 90
        });
      }
      if (cx + cw > px + pw) {
        // Right piece falls
        fallingPieces.push({
          x: px + pw, width: (cx + cw) - (px + pw),
          y: blockY(currentBlock.index) - cameraY,
          vy: 0, vx: 2 * devicePixelRatio,
          rot: 0, vr: 0.04 + Math.random() * 0.06,
          color: currentBlock.color,
          alpha: 1, life: 90
        });
      }

      // Spawn some particles at the drop point
      spawnParticles(finalX + finalW / 2, blockY(currentBlock.index), 12, currentBlock.color);
    }

    tower.push({
      x: finalX,
      width: finalW,
      color: currentBlock.color,
      perfectDrop: isPerfect,
      flashTimer: isPerfect ? 1.0 : 0
    });

    // Update high score
    if (score > highScore) {
      highScore = score;
      localStorage.setItem(STORAGE_KEY, highScore.toString());
    }

    // Camera scroll
    const newBlockY = blockY(tower.length - 1);
    const scrollThreshold = canvas.height * 0.4;
    if (newBlockY - cameraY < scrollThreshold) {
      targetCameraY = newBlockY - scrollThreshold;
    }

    // Next block
    spawnBlock();
  }

  function gameOver() {
    state = 'gameover';
  }

  function spawnParticles(px, py, count, color) {
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = (1 + Math.random() * 4) * devicePixelRatio;
      particles.push({
        x: px, y: py - cameraY,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 2 * devicePixelRatio,
        size: (2 + Math.random() * 4) * devicePixelRatio,
        color: color,
        alpha: 1,
        life: 40 + Math.random() * 30
      });
    }
  }

  // --- Update ---
  function update() {
    if (state === 'playing' && currentBlock) {
      currentBlock.x += currentBlock.speed;

      // Bounce
      if (currentBlock.x + currentBlock.width > canvas.width) {
        currentBlock.x = canvas.width - currentBlock.width;
        currentBlock.speed *= -1;
      }
      if (currentBlock.x < 0) {
        currentBlock.x = 0;
        currentBlock.speed *= -1;
      }
    }

    // Smooth camera
    cameraY += (targetCameraY - cameraY) * 0.08;

    // Update falling pieces
    for (let i = fallingPieces.length - 1; i >= 0; i--) {
      const p = fallingPieces[i];
      p.vy += 0.5 * devicePixelRatio;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      p.life--;
      p.alpha = Math.max(0, p.life / 60);
      if (p.life <= 0) fallingPieces.splice(i, 1);
    }

    // Update particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.15 * devicePixelRatio;
      p.life--;
      p.alpha = Math.max(0, p.life / 40);
      p.size *= 0.97;
      if (p.life <= 0) particles.splice(i, 1);
    }

    // Flash timers on tower blocks
    for (let i = 0; i < tower.length; i++) {
      if (tower[i].flashTimer > 0) {
        tower[i].flashTimer -= 0.025;
      }
    }

    // Screen flash
    if (flashScreen > 0) flashScreen -= 0.04;

    // Background hue shift
    bgHue = 270 + tower.length * 3;
  }

  // --- Draw ---
  function drawBlock3D(x, y, w, h, color, alpha, highlight) {
    if (alpha === undefined) alpha = 1;
    ctx.globalAlpha = alpha;

    const d = DEPTH_OFFSET * devicePixelRatio;

    // Parse color for darker shade
    ctx.fillStyle = color;

    // Top face (lighter)
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + d, y - d);
    ctx.lineTo(x + w + d, y - d);
    ctx.lineTo(x + w, y);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.globalAlpha = alpha * 0.6;
    ctx.fill();

    // Right face (darker)
    ctx.beginPath();
    ctx.moveTo(x + w, y);
    ctx.lineTo(x + w + d, y - d);
    ctx.lineTo(x + w + d, y + h - d);
    ctx.lineTo(x + w, y + h);
    ctx.closePath();
    ctx.globalAlpha = alpha * 0.35;
    ctx.fill();

    // Front face
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    ctx.fillRect(x, y, w, h);

    // Highlight / glow
    if (highlight) {
      ctx.globalAlpha = alpha * 0.3;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(x, y, w, h);
      ctx.globalAlpha = alpha * 0.5;
      ctx.shadowColor = color;
      ctx.shadowBlur = 20 * devicePixelRatio;
      ctx.fillStyle = color;
      ctx.fillRect(x, y, w, h);
      ctx.shadowBlur = 0;
    }

    // Border
    ctx.globalAlpha = alpha * 0.5;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1;
    ctx.strokeRect(x, y, w, h);

    ctx.globalAlpha = 1;
  }

  function draw() {
    const W = canvas.width;
    const H = canvas.height;

    // Background gradient
    const hue1 = bgHue % 360;
    const hue2 = (bgHue + 40) % 360;
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, `hsl(${hue1}, 30%, 4%)`);
    grad.addColorStop(0.5, '#0d0208');
    grad.addColorStop(1, `hsl(${hue2}, 20%, 6%)`);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Background grid lines for depth
    ctx.globalAlpha = 0.04;
    ctx.strokeStyle = '#ff2288';
    ctx.lineWidth = 1;
    for (let gy = 0; gy < H; gy += 40 * devicePixelRatio) {
      const yy = (gy - (cameraY * 0.3) % (40 * devicePixelRatio) + 40 * devicePixelRatio) % H;
      ctx.beginPath();
      ctx.moveTo(0, yy);
      ctx.lineTo(W, yy);
      ctx.stroke();
    }
    for (let gx = 0; gx < W; gx += 40 * devicePixelRatio) {
      ctx.beginPath();
      ctx.moveTo(gx, 0);
      ctx.lineTo(gx, H);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // Ground
    const groundY = getGroundY() - cameraY;
    ctx.fillStyle = 'rgba(255,34,136,0.08)';
    ctx.fillRect(0, groundY, W, H - groundY + 200 * devicePixelRatio);
    ctx.strokeStyle = 'rgba(255,34,136,0.3)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, groundY);
    ctx.lineTo(W, groundY);
    ctx.stroke();

    // Tower blocks
    for (let i = 0; i < tower.length; i++) {
      const b = tower[i];
      const by = blockY(i) - cameraY;
      const bh = BLOCK_HEIGHT * devicePixelRatio;

      // Skip blocks that are off screen
      if (by + bh < -50 || by > H + 50) continue;

      const isFlashing = b.flashTimer > 0;
      drawBlock3D(b.x, by, b.width, bh, b.color, 1, isFlashing);

      // Perfect drop glow ring
      if (b.flashTimer > 0) {
        ctx.globalAlpha = b.flashTimer * 0.4;
        ctx.shadowColor = b.color;
        ctx.shadowBlur = 30 * devicePixelRatio * b.flashTimer;
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2 * devicePixelRatio;
        ctx.strokeRect(b.x - 4, by - 4, b.width + 8, bh + 8);
        ctx.shadowBlur = 0;
        ctx.globalAlpha = 1;
      }
    }

    // Current moving block
    if (currentBlock && state === 'playing') {
      const by = blockY(currentBlock.index) - cameraY;
      const bh = BLOCK_HEIGHT * devicePixelRatio;

      // Glow under moving block
      ctx.globalAlpha = 0.15 + Math.sin(Date.now() * 0.005) * 0.08;
      ctx.shadowColor = currentBlock.color;
      ctx.shadowBlur = 25 * devicePixelRatio;
      ctx.fillStyle = currentBlock.color;
      ctx.fillRect(currentBlock.x, by, currentBlock.width, bh);
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;

      drawBlock3D(currentBlock.x, by, currentBlock.width, bh, currentBlock.color, 1, false);

      // Guide line from current block down to top of tower
      const prevTop = blockY(tower.length - 1) - cameraY;
      ctx.globalAlpha = 0.08;
      ctx.strokeStyle = currentBlock.color;
      ctx.lineWidth = 1;
      ctx.setLineDash([4 * devicePixelRatio, 6 * devicePixelRatio]);
      ctx.beginPath();
      ctx.moveTo(currentBlock.x, by + bh);
      ctx.lineTo(currentBlock.x, prevTop);
      ctx.moveTo(currentBlock.x + currentBlock.width, by + bh);
      ctx.lineTo(currentBlock.x + currentBlock.width, prevTop);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 1;
    }

    // Falling pieces
    for (let i = 0; i < fallingPieces.length; i++) {
      const p = fallingPieces[i];
      ctx.save();
      ctx.translate(p.x + p.width / 2, p.y + BLOCK_HEIGHT * devicePixelRatio / 2);
      ctx.rotate(p.rot);
      ctx.globalAlpha = p.alpha;
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.width / 2, -BLOCK_HEIGHT * devicePixelRatio / 2, p.width, BLOCK_HEIGHT * devicePixelRatio);
      ctx.globalAlpha = p.alpha * 0.4;
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1;
      ctx.strokeRect(-p.width / 2, -BLOCK_HEIGHT * devicePixelRatio / 2, p.width, BLOCK_HEIGHT * devicePixelRatio);
      ctx.restore();
    }

    // Particles
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      ctx.globalAlpha = p.alpha;
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 6 * devicePixelRatio;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;

    // Screen flash (perfect drop)
    if (flashScreen > 0) {
      ctx.globalAlpha = flashScreen * 0.15;
      ctx.fillStyle = '#ff2288';
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }

    // HUD - Score
    const fontSize = Math.floor(18 * devicePixelRatio);
    const bigFontSize = Math.floor(28 * devicePixelRatio);
    const pad = 16 * devicePixelRatio;

    ctx.font = `${fontSize}px 'Barlow', sans-serif`;
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.textAlign = 'left';
    ctx.fillText('SCORE', pad, pad + fontSize);
    ctx.font = `bold ${bigFontSize}px 'Bebas Neue', sans-serif`;
    ctx.fillStyle = '#ff2288';
    ctx.fillText(score.toString(), pad, pad + fontSize + bigFontSize);

    // High score
    ctx.font = `${fontSize}px 'Barlow', sans-serif`;
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.textAlign = 'right';
    ctx.fillText('BEST', W - pad, pad + fontSize);
    ctx.font = `bold ${bigFontSize}px 'Bebas Neue', sans-serif`;
    ctx.fillStyle = 'rgba(255,34,136,0.6)';
    ctx.fillText(highScore.toString(), W - pad, pad + fontSize + bigFontSize);

    // Combo indicator
    if (combo > 1 && state === 'playing') {
      const comboSize = Math.floor(22 * devicePixelRatio);
      ctx.font = `bold ${comboSize}px 'Bebas Neue', sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ffffff';
      ctx.globalAlpha = 0.6 + Math.sin(Date.now() * 0.008) * 0.3;
      ctx.shadowColor = '#ff2288';
      ctx.shadowBlur = 15 * devicePixelRatio;
      ctx.fillText(`COMBO x${combo}`, W / 2, pad + comboSize);
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
    }

    // Level / height indicator
    ctx.font = `${Math.floor(12 * devicePixelRatio)}px 'Barlow', sans-serif`;
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.textAlign = 'center';
    ctx.fillText(`HEIGHT: ${Math.max(0, tower.length - 1)}`, W / 2, H - 10 * devicePixelRatio);

    // --- States ---
    if (state === 'waiting') {
      // Dim overlay
      ctx.fillStyle = 'rgba(13,2,8,0.6)';
      ctx.fillRect(0, 0, W, H);

      const titleSize = Math.floor(40 * devicePixelRatio);
      const subSize = Math.floor(16 * devicePixelRatio);

      ctx.font = `${titleSize}px 'Bebas Neue', sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ff2288';
      ctx.shadowColor = '#ff2288';
      ctx.shadowBlur = 30 * devicePixelRatio;
      ctx.fillText('TOWER STACK', W / 2, H * 0.38);
      ctx.shadowBlur = 0;

      ctx.font = `${subSize}px 'Barlow', sans-serif`;
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      const pulse = 0.5 + Math.sin(Date.now() * 0.004) * 0.3;
      ctx.globalAlpha = pulse;
      ctx.fillText('TAP TO START', W / 2, H * 0.48);
      ctx.globalAlpha = 1;

      // High score display
      if (highScore > 0) {
        ctx.font = `${Math.floor(14 * devicePixelRatio)}px 'Barlow', sans-serif`;
        ctx.fillStyle = 'rgba(255,34,136,0.5)';
        ctx.fillText(`BEST: ${highScore}`, W / 2, H * 0.55);
      }
    }

    if (state === 'gameover') {
      ctx.fillStyle = 'rgba(13,2,8,0.65)';
      ctx.fillRect(0, 0, W, H);

      const goSize = Math.floor(36 * devicePixelRatio);
      const scoreSize = Math.floor(24 * devicePixelRatio);
      const subSize = Math.floor(14 * devicePixelRatio);

      ctx.font = `${goSize}px 'Bebas Neue', sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ff0066';
      ctx.shadowColor = '#ff0066';
      ctx.shadowBlur = 20 * devicePixelRatio;
      ctx.fillText('GAME OVER', W / 2, H * 0.34);
      ctx.shadowBlur = 0;

      ctx.font = `${scoreSize}px 'Bebas Neue', sans-serif`;
      ctx.fillStyle = '#ffffff';
      ctx.fillText(`SCORE: ${score}`, W / 2, H * 0.43);

      ctx.font = `${subSize}px 'Barlow', sans-serif`;
      ctx.fillStyle = 'rgba(255,34,136,0.6)';
      ctx.fillText(`HEIGHT: ${tower.length - 1}`, W / 2, H * 0.49);

      if (score >= highScore && score > 0) {
        ctx.font = `bold ${subSize}px 'Barlow', sans-serif`;
        ctx.fillStyle = '#ffcc00';
        ctx.shadowColor = '#ffcc00';
        ctx.shadowBlur = 10 * devicePixelRatio;
        ctx.fillText('NEW HIGH SCORE!', W / 2, H * 0.55);
        ctx.shadowBlur = 0;
      } else {
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.fillText(`BEST: ${highScore}`, W / 2, H * 0.55);
      }

      const pulse = 0.4 + Math.sin(Date.now() * 0.004) * 0.3;
      ctx.globalAlpha = pulse;
      ctx.font = `${subSize}px 'Barlow', sans-serif`;
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.fillText('TAP TO RETRY', W / 2, H * 0.64);
      ctx.globalAlpha = 1;
    }
  }

  // --- Game loop ---
  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  // --- Input ---
  function handleInput(e) {
    if (e) e.preventDefault();

    if (state === 'waiting') {
      initGame();
      return;
    }
    if (state === 'gameover') {
      state = 'waiting';
      return;
    }
    if (state === 'playing') {
      dropBlock();
    }
  }

  canvas.addEventListener('pointerdown', handleInput);
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.key === ' ') {
      e.preventDefault();
      handleInput(null);
    }
  });

  // Prevent scrolling
  document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

  // --- Start ---
  state = 'waiting';
  // Draw the base block for the waiting screen
  tower = [];
  const bw = getBaseWidth();
  const bx = getBaseX();
  tower.push({
    x: bx, width: bw, color: getColor(0),
    perfectDrop: false, flashTimer: 0
  });
  loop();

})();
</script>
</body>
</html>
