<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Football Game</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a1a0a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Barlow', sans-serif;
    overflow: hidden;
    touch-action: none;
    user-select: none;
  }

  #top-bar {
    display: flex;
    align-items: center;
    width: 100%;
    max-width: 800px;
    padding: 0 4px 6px;
    gap: 12px;
  }

  #back-btn {
    background: rgba(0,0,0,0.5);
    border: 1px solid rgba(200,240,60,0.3);
    color: rgba(200,240,60,0.7);
    font-family: 'Barlow', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1px;
    padding: 5px 12px;
    cursor: pointer;
    text-decoration: none;
    border-radius: 4px;
    white-space: nowrap;
    flex-shrink: 0;
    transition: background 0.15s, color 0.15s;
  }
  #back-btn:hover { background: rgba(200,240,60,0.15); color: #c8f03c; }

  h1 {
    font-family: 'Bebas Neue', cursive;
    color: #c8f03c;
    font-size: 2rem;
    letter-spacing: 0.12em;
    text-shadow: 0 0 20px #c8f03c66;
    flex: 1;
    text-align: center;
  }

  /* spacer to balance the back button */
  #top-spacer { width: 70px; flex-shrink: 0; }

  #gameCanvas {
    border: 3px solid #c8f03c44;
    border-radius: 6px;
    display: block;
    box-shadow: 0 0 40px #00000088, 0 0 0 1px #c8f03c22;
    max-width: 100%;
  }

  /* JOYSTICK */
  #stick-zone {
    position: fixed;
    left: 20px;
    bottom: 20px;
    width: 130px;
    height: 130px;
    border-radius: 50%;
    background: rgba(200, 240, 60, 0.06);
    border: 2px solid rgba(200, 240, 60, 0.3);
    touch-action: none;
    z-index: 10;
  }

  #stick-base {
    position: absolute;
    left: 50%; top: 50%;
    width: 80px; height: 80px;
    margin-left: -40px; margin-top: -40px;
    border-radius: 50%;
    background: rgba(255,255,255,0.03);
    border: 2px dashed rgba(200,240,60,0.18);
  }

  #stick-knob {
    position: absolute;
    left: 50%; top: 50%;
    width: 54px; height: 54px;
    margin-left: -27px; margin-top: -27px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #e8ff60, #6a8010);
    box-shadow: 0 0 18px rgba(200,240,60,0.6), inset 0 0 8px rgba(255,255,255,0.25);
    pointer-events: none;
    transition: box-shadow 0.1s;
  }

  /* ACTION BUTTONS */
  #action-btns {
    position: fixed;
    right: 20px;
    bottom: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    z-index: 10;
  }

  .action-btn {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    border: none;
    font-family: 'Bebas Neue', cursive;
    font-size: 14px;
    letter-spacing: 2px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    transition: transform 0.08s, opacity 0.08s;
    user-select: none;
  }
  .action-btn:active, .action-btn.pressed { transform: scale(0.9); }

  #shoot-btn {
    background: radial-gradient(circle at 35% 30%, #ff7744, #cc2200);
    box-shadow: 0 0 22px rgba(255,80,30,0.6), inset 0 0 10px rgba(255,200,150,0.2);
    color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.5);
  }
  #shoot-btn.pressed  { box-shadow: 0 0 12px rgba(255,80,30,0.3); }
  #shoot-btn.cooldown { opacity: 0.45; }

  #kb-hint {
    position: fixed;
    bottom: 8px;
    left: 0; right: 0;
    text-align: center;
    color: #3a5a1a;
    font-size: 0.7rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="top-bar">
  <a id="back-btn" href="/">&#9664; HUB</a>
  <h1>&#9917; Football Game</h1>
  <div id="top-spacer"></div>
</div>
<canvas id="gameCanvas" width="800" height="500"></canvas>

<div id="stick-zone">
  <div id="stick-base"></div>
  <div id="stick-knob"></div>
</div>

<div id="action-btns">
  <div class="action-btn" id="shoot-btn">SHOOT</div>
</div>

<p id="kb-hint">WASD / Arrows · F = Shoot</p>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const WIDTH = 800, HEIGHT = 500;

  function resizeCanvas() {
    const maxW = Math.min(window.innerWidth - 16, 800);
    canvas.style.width  = maxW + 'px';
    canvas.style.height = (maxW * 500 / 800) + 'px';
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  // ── Joystick ──────────────────────────────────────────────────
  const stickZone = document.getElementById('stick-zone');
  const stickKnob = document.getElementById('stick-knob');
  const STICK_MAX = 40;
  let stickVec = { x: 0, y: 0 };
  let stickId = null;
  let mouseDownStick = false;

  function setStick(clientX, clientY) {
    const r = stickZone.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const dx = Math.max(-STICK_MAX, Math.min(STICK_MAX, clientX - cx));
    const dy = Math.max(-STICK_MAX, Math.min(STICK_MAX, clientY - cy));
    stickKnob.style.transform = `translate(${dx}px,${dy}px)`;
    stickVec.x = dx / STICK_MAX;
    stickVec.y = dy / STICK_MAX;
  }
  function resetStick() {
    stickKnob.style.transform = '';
    stickVec.x = 0; stickVec.y = 0;
    stickId = null;
  }

  stickZone.addEventListener('touchstart', e => {
    e.preventDefault();
    if (stickId !== null) return;
    const t = e.changedTouches[0]; stickId = t.identifier;
    setStick(t.clientX, t.clientY);
  }, { passive: false });
  stickZone.addEventListener('touchmove', e => {
    e.preventDefault();
    for (const t of e.changedTouches) if (t.identifier === stickId) { setStick(t.clientX, t.clientY); break; }
  }, { passive: false });
  function onStickEnd(e) {
    for (const t of e.changedTouches) if (t.identifier === stickId) { resetStick(); break; }
  }
  stickZone.addEventListener('touchend',   onStickEnd, { passive: false });
  stickZone.addEventListener('touchcancel',onStickEnd, { passive: false });

  stickZone.addEventListener('mousedown', e => { e.preventDefault(); mouseDownStick = true; setStick(e.clientX, e.clientY); });
  window.addEventListener('mousemove',    e => { if (mouseDownStick) setStick(e.clientX, e.clientY); });
  window.addEventListener('mouseup',      ()  => { if (mouseDownStick) { mouseDownStick = false; resetStick(); } });

  // ── Action buttons (touch/mouse) ─────────────────────────────
  const shootBtn = document.getElementById('shoot-btn');
  let touchShoot = false;

  function bindActionBtn(el, setFn) {
    const press   = e => { e.preventDefault(); el.classList.add('pressed');    setFn(true);  };
    const release = e => { e.preventDefault(); el.classList.remove('pressed'); setFn(false); };
    el.addEventListener('touchstart',  press,   { passive: false });
    el.addEventListener('touchend',    release, { passive: false });
    el.addEventListener('touchcancel', release, { passive: false });
    el.addEventListener('mousedown',   press);
    el.addEventListener('mouseup',     release);
    el.addEventListener('mouseleave',  release);
  }
  bindActionBtn(shootBtn, v => { touchShoot = v; });

  // ── Keyboard ──────────────────────────────────────────────────
  const keys = {};
  window.addEventListener('keydown', e => {
    keys[e.key] = true;
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','f'].includes(e.key.toLowerCase())) e.preventDefault();
  });
  window.addEventListener('keyup', e => { keys[e.key] = false; });

  // ── Game state ────────────────────────────────────────────────
  const PLAYER_BASE_SPEED = 5;
  const SHOOT_COOLDOWN    = 1.2;   // seconds between shots
  const SHOOT_RANGE       = 90;    // max dist from ball centre to trigger shot
  const CONTROL_RANGE     = 42;    // passive dribble lerp engages within this distance

  const player = { x: 100, y: 230, w: 28, h: 28, facing: { x: 1, y: 0 },
                   shootCooldown: 0 };
  const BALL_START = { x: WIDTH / 2, y: HEIGHT / 2 };
  const ball   = { x: BALL_START.x, y: BALL_START.y, r: 10, vx: 0, vy: 0, spin: 0 };

  const goal   = { x: 755, y: HEIGHT / 2 - 70, w: 45, h: 140 };

  // Goalkeeper
  const GK_REACTION_DELAY = 0.25; // seconds between target updates
  const gk = { x: goal.x - 12, y: HEIGHT / 2 - 14, w: 28, h: 28,
               speed: 5.5, reactionTimer: 0, trackedY: HEIGHT / 2 };

  let score = 0;
  let goalFlash = 0;   // seconds remaining for goal flash effect
  let lastT = performance.now();

  // ── Input helpers ─────────────────────────────────────────────
  function getInputVec() {
    let dx = 0, dy = 0;
    if (keys['ArrowLeft']  || keys['a']) dx -= 1;
    if (keys['ArrowRight'] || keys['d']) dx += 1;
    if (keys['ArrowUp']    || keys['w']) dy -= 1;
    if (keys['ArrowDown']  || keys['s']) dy += 1;
    if (dx || dy) {
      const m = Math.hypot(dx, dy);
      return { x: dx / m, y: dy / m, mag: 1 };
    }
    const mag = Math.min(1, Math.hypot(stickVec.x, stickVec.y));
    return { x: stickVec.x, y: stickVec.y, mag };
  }

  function shootPressed() {
    return keys['f'] || keys['F'] || touchShoot;
  }

  // ── Geometry ──────────────────────────────────────────────────
  function rectCircle(rx, ry, rw, rh, cx, cy, cr) {
    const nx = Math.max(rx, Math.min(cx, rx + rw));
    const ny = Math.max(ry, Math.min(cy, ry + rh));
    const d2 = (cx - nx) ** 2 + (cy - ny) ** 2;
    return d2 < cr * cr;
  }

  // ── Reset after goal ──────────────────────────────────────────
  function resetBall() {
    ball.x = BALL_START.x; ball.y = BALL_START.y;
    ball.vx = 0; ball.vy = 0; ball.spin = 0;
    player.x = 100; player.y = HEIGHT / 2 - 14;
    gk.y = HEIGHT / 2 - 14;
  }

  // ── Update ────────────────────────────────────────────────────
  function update(dt) {
    goalFlash = Math.max(0, goalFlash - dt);

    // --- Player movement ---
    const inp = getInputVec();
    if (inp.mag > 0.08) {
      player.facing.x = inp.x;
      player.facing.y = inp.y;
    }

    player.shootCooldown = Math.max(0, player.shootCooldown - dt);
    shootBtn.classList.toggle('cooldown', player.shootCooldown > 0);

    player.x += inp.x * inp.mag * PLAYER_BASE_SPEED;
    player.y += inp.y * inp.mag * PLAYER_BASE_SPEED;
    player.x = Math.max(0, Math.min(WIDTH  - player.w, player.x));
    player.y = Math.max(0, Math.min(HEIGHT - player.h, player.y));

    // --- Shoot ---
    if (shootPressed() && player.shootCooldown <= 0) {
      const playerCx = player.x + player.w / 2;
      const playerCy = player.y + player.h / 2;
      if (Math.hypot(ball.x - playerCx, ball.y - playerCy) < SHOOT_RANGE) {
        player.shootCooldown = SHOOT_COOLDOWN;
        const goalCx = goal.x + goal.w / 2;
        const goalCy = goal.y + goal.h / 2;
        const tx = goalCx - ball.x, ty = goalCy - ball.y;
        const tlen = Math.hypot(tx, ty) || 1;
        // 70% toward goal, 30% in facing direction
        const sx = (tx / tlen) * 0.7 + player.facing.x * 0.3;
        const sy = (ty / tlen) * 0.7 + player.facing.y * 0.3;
        const slen = Math.hypot(sx, sy) || 1;
        const power = 16 + Math.random() * 3;
        ball.vx = (sx / slen) * power;
        ball.vy = (sy / slen) * power;
        ball.spin += power * 0.2;
      }
    }

    // --- Passive dribble: lerp ball to foot position when player is moving ---
    const playerCx = player.x + player.w / 2;
    const playerCy = player.y + player.h / 2;
    const distToBall = Math.hypot(ball.x - playerCx, ball.y - playerCy);

    if (inp.mag > 0.08 && distToBall < CONTROL_RANGE && player.shootCooldown <= 0) {
      const footDist = player.w / 2 + ball.r + 3;
      const footX = playerCx + inp.x * footDist;
      const footY = playerCy + inp.y * footDist;
      // Lerp position — no velocity accumulation, no oscillation
      const t = Math.min(1, 14 * dt);
      ball.x += (footX - ball.x) * t;
      ball.y += (footY - ball.y) * t;
      // Match ball velocity to player so it doesn't fight the lerp
      ball.vx = inp.x * inp.mag * PLAYER_BASE_SPEED;
      ball.vy = inp.y * inp.mag * PLAYER_BASE_SPEED;
    }

    // Positional separation: slide ball to player edge with no velocity spike
    if (rectCircle(player.x, player.y, player.w, player.h, ball.x, ball.y, ball.r)) {
      const dx = ball.x - playerCx;
      const dy = ball.y - playerCy;
      const len = Math.hypot(dx, dy) || 1;
      const pushDist = player.w / 2 + ball.r + 2;
      ball.x = playerCx + (dx / len) * pushDist;
      ball.y = playerCy + (dy / len) * pushDist;
    }

    // --- Ball physics ---
    const prevBallX = ball.x;
    ball.x += ball.vx;
    ball.y += ball.vy;
    ball.vx *= 0.978;
    ball.vy *= 0.978;
    ball.spin += (ball.vx + ball.vy) * 0.04;

    if (ball.x - ball.r < 0)      { ball.x = ball.r;          ball.vx *= -0.55; }
    if (ball.x + ball.r > WIDTH)   { ball.x = WIDTH - ball.r;  ball.vx *= -0.55; }
    if (ball.y - ball.r < 0)       { ball.y = ball.r;          ball.vy *= -0.55; }
    if (ball.y + ball.r > HEIGHT)  { ball.y = HEIGHT - ball.r; ball.vy *= -0.55; }

    // --- Goalkeeper AI (delayed reaction) ---
    gk.reactionTimer -= dt;
    if (gk.reactionTimer <= 0) {
      gk.reactionTimer = GK_REACTION_DELAY;
      gk.trackedY = ball.y; // only update target after delay
    }
    const gkTargetY = Math.max(goal.y, Math.min(goal.y + goal.h - gk.h, gk.trackedY - gk.h / 2));
    const gkDy = gkTargetY - gk.y;
    gk.y += Math.sign(gkDy) * Math.min(Math.abs(gkDy), gk.speed);
    gk.x = goal.x - gk.w - 4;

    if (rectCircle(gk.x, gk.y, gk.w, gk.h, ball.x, ball.y, ball.r)) {
      ball.vx = -Math.abs(ball.vx) * 0.9 - 3;
      const dy = ball.y - (gk.y + gk.h / 2);
      ball.vy = (dy / (gk.h / 2)) * 5;
    }

    // --- Goal check: ball must CROSS the mouth line on this frame ---
    // prevBallX ensures side-entry (ball inside goal x-range but entering from top/bottom) never scores
    if (prevBallX + ball.r < goal.x &&
        ball.x + ball.r >= goal.x &&
        ball.y >= goal.y + ball.r &&
        ball.y <= goal.y + goal.h - ball.r) {
      score++;
      goalFlash = 1.2;
      resetBall();
    }
  }

  // ── Draw helpers ──────────────────────────────────────────────
  function drawPitch() {
    ctx.fillStyle = '#1a7a1a';
    ctx.fillRect(0, 0, WIDTH, HEIGHT);
    for (let i = 0; i < 8; i++) {
      if (i % 2 === 0) { ctx.fillStyle = 'rgba(0,0,0,0.06)'; ctx.fillRect(i * 100, 0, 100, HEIGHT); }
    }
    ctx.strokeStyle = 'rgba(255,255,255,0.22)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(WIDTH / 2, HEIGHT / 2, 70, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(WIDTH / 2, 0); ctx.lineTo(WIDTH / 2, HEIGHT); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.28)';
    ctx.beginPath(); ctx.arc(WIDTH / 2, HEIGHT / 2, 4, 0, Math.PI * 2); ctx.fill();

    // Penalty box
    ctx.strokeStyle = 'rgba(255,255,255,0.18)';
    ctx.lineWidth = 1.5;
    const pbW = 110, pbH = 220, pbX = WIDTH - pbW, pbY = (HEIGHT - pbH) / 2;
    ctx.strokeRect(pbX, pbY, pbW, pbH);
  }

  function drawGoalNet() {
    ctx.fillStyle = 'rgba(255,255,255,0.1)';
    ctx.fillRect(goal.x, goal.y, goal.w, goal.h);
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.lineWidth = 1;
    for (let y = goal.y; y <= goal.y + goal.h; y += 14) {
      ctx.beginPath(); ctx.moveTo(goal.x, y); ctx.lineTo(goal.x + goal.w, y); ctx.stroke();
    }
    for (let x = goal.x; x <= goal.x + goal.w; x += 14) {
      ctx.beginPath(); ctx.moveTo(x, goal.y); ctx.lineTo(x, goal.y + goal.h); ctx.stroke();
    }
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
    ctx.strokeRect(goal.x, goal.y, goal.w, goal.h);
  }

  function drawCharacter(x, y, w, h, topColor, botColor, label, glowColor) {
    // shadow
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    ctx.beginPath();
    ctx.ellipse(x + w / 2, y + h + 3, w / 2, 5, 0, 0, Math.PI * 2);
    ctx.fill();
    // body
    const g = ctx.createLinearGradient(x, y, x, y + h);
    g.addColorStop(0, topColor); g.addColorStop(1, botColor);
    ctx.fillStyle = g;
    if (glowColor) { ctx.shadowColor = glowColor; ctx.shadowBlur = 14; }
    ctx.beginPath(); ctx.roundRect(x, y, w, h, 5); ctx.fill();
    ctx.shadowBlur = 0;
    // number/label
    ctx.fillStyle = 'white'; ctx.font = `bold ${Math.round(h * 0.44)}px Barlow`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(label, x + w / 2, y + h / 2);
  }

  function drawBallSprite() {
    const cx = ball.x, cy = ball.y, r = ball.r;
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.beginPath(); ctx.ellipse(cx, cy + r + 2, r * 0.85, 3.5, 0, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = 'white';
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath(); ctx.arc(cx, cy, r * 0.36, 0, Math.PI * 2); ctx.fill();

    ctx.strokeStyle = '#333'; ctx.lineWidth = 1;
    for (let i = 0; i < 5; i++) {
      const a = ball.spin + (i / 5) * Math.PI * 2;
      ctx.beginPath();
      ctx.arc(cx + Math.cos(a)*r*0.54, cy + Math.sin(a)*r*0.54, r*0.27, a+0.5, a+1.8);
      ctx.stroke();
    }
  }

  function drawHUD() {
    // Score
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath(); ctx.roundRect(10, 10, 150, 46, 8); ctx.fill();
    ctx.fillStyle = '#c8f03c';
    ctx.font = 'bold 28px "Bebas Neue", cursive';
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText(`SCORE  ${score}`, 22, 17);

    // Shoot cooldown bar
    const barW = 90, barH = 6, barX = WIDTH - barW - 14;
    const sFill = player.shootCooldown <= 0 ? 1 : 1 - player.shootCooldown / SHOOT_COOLDOWN;
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath(); ctx.roundRect(barX, HEIGHT - 20, barW, barH, 3); ctx.fill();
    ctx.fillStyle = sFill >= 1 ? '#ff7744' : '#661100';
    ctx.beginPath(); ctx.roundRect(barX, HEIGHT - 20, barW * sFill, barH, 3); ctx.fill();
    ctx.font = '9px Barlow'; ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.fillText('SHOOT', barX + barW, HEIGHT - 23);

    // Goal flash overlay
    if (goalFlash > 0) {
      const alpha = Math.min(1, goalFlash) * 0.55;
      ctx.fillStyle = `rgba(200,240,60,${alpha})`;
      ctx.fillRect(0, 0, WIDTH, HEIGHT);
      ctx.fillStyle = `rgba(0,0,0,${alpha * 0.8})`;
      ctx.font = 'bold 72px "Bebas Neue", cursive';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.shadowColor = '#c8f03c'; ctx.shadowBlur = 30;
      ctx.fillText('GOAL!', WIDTH / 2, HEIGHT / 2);
      ctx.shadowBlur = 0;
    }
  }

  // ── Main loop ─────────────────────────────────────────────────
  function loop(t) {
    const dt = Math.min((t - lastT) / 1000, 1 / 30);
    lastT = t;

    update(dt);

    drawPitch();
    drawGoalNet();
    drawCharacter(gk.x, gk.y, gk.w, gk.h, '#4488ff', '#1133aa', 'GK', '#4af');
    drawCharacter(player.x, player.y, player.w, player.h, '#ff3a3a', '#991111', '7', null);
    drawBallSprite();
    drawHUD();

    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);
</script>
</body>
</html>
