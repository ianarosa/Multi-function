<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>CYBER PONG</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #020812; font-family: 'Barlow', monospace; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; touch-action: none; user-select: none; }

  #top-bar {
    display: flex; align-items: center; width: 100%; max-width: 660px;
    padding: 0 4px 6px; gap: 12px;
  }
  #back-btn {
    background: rgba(0,0,0,0.5); border: 1px solid rgba(0,220,255,0.3);
    color: rgba(0,220,255,0.7); font-family: 'Barlow', sans-serif;
    font-size: 11px; font-weight: 600; letter-spacing: 1px; padding: 5px 12px;
    cursor: pointer; text-decoration: none; border-radius: 4px;
    white-space: nowrap; flex-shrink: 0; transition: background 0.15s, color 0.15s;
  }
  #back-btn:hover { background: rgba(0,220,255,0.15); color: #0df; }

  h1 {
    font-family: 'Bebas Neue', cursive; color: #0df; font-size: 2rem;
    letter-spacing: 0.15em; text-shadow: 0 0 20px #0df6; flex: 1; text-align: center;
  }
  #top-spacer { width: 70px; flex-shrink: 0; display: flex; justify-content: flex-end; align-items: center; gap: 6px; }
  #fs-btn, #diff-btn {
    background: rgba(0,0,0,0.5); border: 1px solid rgba(0,220,255,0.3);
    color: rgba(0,220,255,0.7); border-radius: 4px; cursor: pointer;
    width: 32px; height: 28px; display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, color 0.15s; flex-shrink: 0;
  }
  #fs-btn:hover, #diff-btn:hover { background: rgba(0,220,255,0.15); color: #0df; }

  #gameCanvas {
    display: block; max-width: 100%;
    border: 1px solid rgba(0,220,255,0.12); border-radius: 6px;
    box-shadow: 0 0 60px rgba(0,220,255,0.1), 0 0 0 1px rgba(0,220,255,0.06);
  }
  #hint {
    margin-top: 8px; color: rgba(255,255,255,0.18); font-size: 0.68rem;
    letter-spacing: 0.08em; text-transform: uppercase;
  }

  /* VERTICAL JOYSTICK */
  #stick-zone {
    position: fixed;
    left: 20px;
    bottom: 20px;
    width: 52px;
    height: 140px;
    border-radius: 26px;
    background: rgba(0,220,255,0.05);
    border: 2px solid rgba(0,220,255,0.28);
    touch-action: none;
    z-index: 10;
  }
  #stick-track {
    position: absolute;
    left: 50%; top: 10px; bottom: 10px;
    width: 2px;
    margin-left: -1px;
    background: rgba(0,220,255,0.15);
    border-radius: 1px;
  }
  #stick-knob {
    position: absolute;
    left: 50%; top: 50%;
    width: 40px; height: 40px;
    margin-left: -20px; margin-top: -20px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #6ef, #007899);
    box-shadow: 0 0 16px rgba(0,220,255,0.65), inset 0 0 8px rgba(255,255,255,0.25);
    pointer-events: none;
  }
  /* Touch joystick is mobile-only; desktop plays with mouse/keyboard */
  @media (hover: hover) and (pointer: fine) {
    #stick-zone { display: none !important; }
  }

  @media (orientation: landscape) {
    #top-bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 200;
      background: rgba(2,8,18,0.55); pointer-events: none;
    }
    #top-bar > * { pointer-events: auto; }
    h1 { display: none; }
    #hint { display: none; }
  }

  /* ── Unified Arcade HUD (canonical, 48px height) ── */
  #top-bar, .top-bar, .topbar, #topBar {
    box-sizing: border-box !important;
    width: 100% !important;
    max-width: none !important;
    height: 48px !important;
    min-height: 48px !important;
    padding: 0 12px !important;
    margin: 0 !important;
    gap: 10px !important;
    display: flex !important;
    align-items: center !important;
    justify-content: space-between !important;
    font-family: 'Barlow', 'Courier New', sans-serif !important;
    background: rgba(8,8,14,0.88) !important;
    border-bottom: 1px solid rgba(255,255,255,0.1) !important;
    backdrop-filter: blur(10px) !important;
    -webkit-backdrop-filter: blur(10px) !important;
    flex-shrink: 0 !important;
    position: relative !important;
    z-index: 500 !important;
  }
  #top-bar h1, .top-bar h1, .topbar h1, #topBar h1,
  #top-bar .title, .top-bar .title, .topbar .title, #topBar .title,
  #top-bar .top-title, .top-bar .top-title {
    font-family: 'Bebas Neue','Barlow',sans-serif !important;
    font-size: 22px !important;
    letter-spacing: 3px !important;
    font-weight: 700 !important;
    flex: 1 1 auto !important;
    text-align: center !important;
    margin: 0 !important;
    padding: 0 !important;
    position: static !important;
    transform: none !important;
    white-space: nowrap !important;
    overflow: hidden !important;
    text-overflow: ellipsis !important;
    line-height: 1 !important;
    pointer-events: none !important;
  }
  #top-bar #back-btn, .top-bar #back-btn, .topbar #back-btn, #topBar #back-btn,
  #top-bar a.top-btn[href="/"], .top-bar a.top-btn[href="/"],
  #topBar > a[href="/"],
  a.back[href="/"],
  a.icon-btn[href="/"] {
    font-family: 'Barlow', 'Courier New', sans-serif !important;
    font-size: 11px !important;
    font-weight: 600 !important;
    letter-spacing: 2px !important;
    text-transform: uppercase !important;
    padding: 0 12px !important;
    border-radius: 4px !important;
    border: 1px solid currentColor !important;
    background: rgba(0,0,0,0.35) !important;
    text-decoration: none !important;
    line-height: 1 !important;
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    height: 30px !important;
    min-height: 30px !important;
    width: auto !important;
    min-width: 0 !important;
    white-space: nowrap !important;
    flex-shrink: 0 !important;
    box-sizing: border-box !important;
  }
  #top-bar #fs-btn, .top-bar #fs-btn, .topbar #fs-btn, #topBar #fs-btn,
  #top-bar #fsBtn, #topBar #fsBtn,
  #top-bar #diff-btn,
  #top-bar button.icon-btn:not([href="/"]), .topbar button.icon-btn:not([href="/"]) {
    width: 32px !important;
    height: 30px !important;
    min-width: 32px !important;
    min-height: 30px !important;
    padding: 0 !important;
    border-radius: 4px !important;
    border: 1px solid currentColor !important;
    background: rgba(0,0,0,0.35) !important;
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    font-size: 14px !important;
    flex-shrink: 0 !important;
    box-sizing: border-box !important;
  }
  #top-bar #top-spacer, .top-bar #top-spacer, .topbar #top-spacer, #topBar #top-spacer {
    flex-shrink: 0 !important;
    display: flex !important;
    align-items: center !important;
    justify-content: flex-end !important;
    gap: 6px !important;
    min-width: 0 !important;
    width: auto !important;
  }
  /* Freestanding back link (used when game has no top-bar container) */
  body > a.back[href="/"] {
    position: fixed !important;
    top: 9px !important;
    left: 12px !important;
    z-index: 600 !important;
  }

  /* ── Difficulty menu overlay (HTML, above canvas, below top-bar) ── */
  #diff-menu {
    position: fixed;
    left: 0; right: 0; top: 48px; bottom: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 18px;
    background: rgba(2,8,18,0.92);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: 400;
    padding: 20px;
  }
  #diff-menu.visible { display: flex; }
  #diff-menu .menu-title {
    font-family: 'Bebas Neue', cursive;
    color: #0df; font-size: 2.4rem; letter-spacing: 0.2em;
    text-shadow: 0 0 22px #0df8; margin-bottom: 4px;
  }
  #diff-menu .menu-sub {
    font-family: 'Barlow', sans-serif; color: rgba(255,255,255,0.55);
    font-size: 0.8rem; letter-spacing: 0.15em; text-transform: uppercase;
    margin-bottom: 10px;
  }
  #diff-menu .diff-grid {
    display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; max-width: 640px;
  }
  .diff-btn {
    min-width: 160px; padding: 16px 18px;
    background: rgba(0,0,0,0.45);
    border: 1px solid rgba(0,220,255,0.35);
    color: #0df; font-family: 'Bebas Neue', cursive;
    font-size: 1.6rem; letter-spacing: 0.2em;
    border-radius: 6px; cursor: pointer;
    text-align: center;
    transition: background 0.15s, transform 0.15s, box-shadow 0.15s, border-color 0.15s;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
  }
  .diff-btn:hover { background: rgba(0,220,255,0.1); transform: translateY(-2px); box-shadow: 0 0 24px rgba(0,220,255,0.35); }
  .diff-btn.selected { border-color: #0df; background: rgba(0,220,255,0.15); box-shadow: 0 0 22px rgba(0,220,255,0.4); }
  .diff-btn.easy   { color: #0f8; border-color: rgba(0,255,136,0.4); }
  .diff-btn.easy:hover, .diff-btn.easy.selected { border-color: #0f8; box-shadow: 0 0 22px rgba(0,255,136,0.4); background: rgba(0,255,136,0.1); }
  .diff-btn.medium { color: #fe0; border-color: rgba(255,238,0,0.4); }
  .diff-btn.medium:hover, .diff-btn.medium.selected { border-color: #fe0; box-shadow: 0 0 22px rgba(255,238,0,0.4); background: rgba(255,238,0,0.1); }
  .diff-btn.hard   { color: #f06; border-color: rgba(255,0,102,0.4); }
  .diff-btn.hard:hover, .diff-btn.hard.selected { border-color: #f06; box-shadow: 0 0 22px rgba(255,0,102,0.4); background: rgba(255,0,102,0.1); }
  .diff-btn .diff-desc {
    font-family: 'Barlow', sans-serif;
    font-size: 0.7rem; letter-spacing: 0.12em;
    text-transform: uppercase; color: rgba(255,255,255,0.5);
    font-weight: 400;
  }
  #diff-menu .menu-footer {
    margin-top: 6px; color: rgba(255,255,255,0.35);
    font-size: 0.72rem; letter-spacing: 0.15em; text-transform: uppercase;
  }
</style>
</head>
<body>

<div id="top-bar">
  <a id="back-btn" href="/">&#9664; HUB</a>
  <h1>CYBER PONG</h1>
  <div id="top-spacer">
    <button id="diff-btn" title="Difficulty">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M9.405 1.05c-.413-1.4-2.397-1.4-2.81 0l-.1.34a1.464 1.464 0 0 1-2.105.872l-.31-.17c-1.283-.698-2.686.705-1.987 1.987l.169.311c.446.82.023 1.841-.872 2.105l-.34.1c-1.4.413-1.4 2.397 0 2.81l.34.1a1.464 1.464 0 0 1 .872 2.105l-.17.31c-.698 1.283.705 2.686 1.987 1.987l.311-.169a1.464 1.464 0 0 1 2.105.872l.1.34c.413 1.4 2.397 1.4 2.81 0l.1-.34a1.464 1.464 0 0 1 2.105-.872l.31.17c1.283.698 2.686-.705 1.987-1.987l-.169-.311a1.464 1.464 0 0 1 .872-2.105l.34-.1c1.4-.413 1.4-2.397 0-2.81l-.34-.1a1.464 1.464 0 0 1-.872-2.105l.17-.31c.698-1.283-.705-2.686-1.987-1.987l-.311.169a1.464 1.464 0 0 1-2.105-.872l-.1-.34zM8 10.93a2.929 2.929 0 1 1 0-5.86 2.929 2.929 0 0 1 0 5.858z"/></svg>
    </button>
    <button id="fs-btn" title="Fullscreen">
      <svg id="fs-enter" width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M5.828 10.172a.5.5 0 0 0-.707 0l-4.096 4.096V11.5a.5.5 0 0 0-1 0v3.975a.5.5 0 0 0 .5.5H4.5a.5.5 0 0 0 0-1H1.732l4.096-4.096a.5.5 0 0 0 0-.707zm4.344 0a.5.5 0 0 1 .707 0l4.096 4.096V11.5a.5.5 0 1 1 1 0v3.975a.5.5 0 0 1-.5.5H11.5a.5.5 0 0 1 0-1h2.768l-4.096-4.096a.5.5 0 0 1 0-.707zm0-4.344a.5.5 0 0 0 .707 0l4.096-4.096V4.5a.5.5 0 1 0 1 0V.525a.5.5 0 0 0-.5-.5H11.5a.5.5 0 0 0 0 1h2.768l-4.096 4.096a.5.5 0 0 0 0 .707zm-4.344 0a.5.5 0 0 1-.707 0L1.025 1.732V4.5a.5.5 0 0 1-1 0V.525a.5.5 0 0 1 .5-.5H4.5a.5.5 0 0 1 0 1H1.732l4.096 4.096a.5.5 0 0 1 0 .707z"/></svg>
      <svg id="fs-exit" width="14" height="14" viewBox="0 0 16 16" fill="currentColor" style="display:none"><path d="M5.5 0a.5.5 0 0 1 .5.5v4A1.5 1.5 0 0 1 4.5 6h-4a.5.5 0 0 1 0-1h4a.5.5 0 0 0 .5-.5v-4a.5.5 0 0 1 .5-.5zm5 0a.5.5 0 0 1 .5.5v4a.5.5 0 0 0 .5.5h4a.5.5 0 0 1 0 1h-4A1.5 1.5 0 0 1 10 4.5v-4a.5.5 0 0 1 .5-.5zM0 10.5a.5.5 0 0 1 .5-.5h4A1.5 1.5 0 0 1 6 11.5v4a.5.5 0 0 1-1 0v-4a.5.5 0 0 0-.5-.5h-4a.5.5 0 0 1-.5-.5zm10 1a1.5 1.5 0 0 1 1.5-1.5h4a.5.5 0 0 1 0 1h-4a.5.5 0 0 0-.5.5v4a.5.5 0 0 1-1 0v-4z"/></svg>
    </button>
  </div>
</div>
<canvas id="gameCanvas" width="620" height="400"></canvas>

<div id="stick-zone">
  <div id="stick-track"></div>
  <div id="stick-knob"></div>
</div>

<p id="hint">Joystick / mouse / arrows &nbsp;·&nbsp; catch power-ups &nbsp;·&nbsp; build combos</p>

<div id="diff-menu">
  <div class="menu-title">SELECT DIFFICULTY</div>
  <div class="menu-sub">Choose your challenge</div>
  <div class="diff-grid">
    <button class="diff-btn easy"   data-diff="easy">EASY<span class="diff-desc">Slow · Forgiving</span></button>
    <button class="diff-btn medium" data-diff="medium">MEDIUM<span class="diff-desc">Adaptive · Keeps it close</span></button>
    <button class="diff-btn hard"   data-diff="hard">HARD<span class="diff-desc">Fast · Predictive</span></button>
  </div>
  <div class="menu-footer">Click the gear to change anytime</div>
</div>

<script>
(() => {
  const cvs = document.getElementById('gameCanvas');
  const ctx = cvs.getContext('2d');
  const W = 620, H = 400;

  // ── Retina scaling: sharp text on high-DPR displays ──
  let currentDpr = 1;
  function applyDpr() {
    const dpr = Math.max(1, window.devicePixelRatio || 1);
    if (dpr === currentDpr && cvs.width === W * dpr) return;
    currentDpr = dpr;
    cvs.width  = W * dpr;
    cvs.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  applyDpr();

  function fit() {
    const isLandscape = window.innerWidth > window.innerHeight;
    const topBar = document.getElementById('top-bar');
    const hint   = document.getElementById('hint');
    const availW = window.innerWidth  - 8;
    const availH = isLandscape
      ? window.innerHeight - 8
      : window.innerHeight - topBar.offsetHeight - hint.offsetHeight - 20;
    const s      = Math.min(availW / W, availH / H) * 0.98;
    cvs.style.width  = (W * s) + 'px';
    cvs.style.height = (H * s) + 'px';
    applyDpr();
  }
  fit(); window.addEventListener('resize', fit);

  // ── Constants ─────────────────────────────────────────────────
  const PW = 13, PH_BASE = 82;
  const AIW = 13, AIH = 82;
  const BR = 7;          // ball radius
  const PUR = 13;        // power-up radius
  const BASE_SPD = 7.5;
  const PU_INTERVAL = 9; // seconds between power-up spawns

  // ── Difficulty system ─────────────────────────────────────────
  // AI parameters: baseSpeed(px/frame @60fps), reactionDelay(s), predictionDepth(0..1), missProb(0..1), errorAmp(px)
  const DIFFICULTIES = {
    easy:   { label: 'EASY',   baseSpeed: 2.6, reactionDelay: 0.55, prediction: 0.0, missProb: 0.25, errorAmp: 40 },
    medium: { label: 'MEDIUM', baseSpeed: 4.2, reactionDelay: 0.32, prediction: 0.45, missProb: 0.12, errorAmp: 22 },
    hard:   { label: 'HARD',   baseSpeed: 6.4, reactionDelay: 0.14, prediction: 0.92, missProb: 0.17, errorAmp: 12 },
  };
  let difficulty = 'medium';
  try {
    const saved = localStorage.getItem('cp_diff');
    if (saved && DIFFICULTIES[saved]) difficulty = saved;
  } catch(e) {}

  // Current AI params (mutable for adaptive medium)
  const aiParams = { baseSpeed: 4.2, reactionDelay: 0.32, prediction: 0.45, missProb: 0.12, errorAmp: 22 };
  // Rally history for adaptive medium: 1 = player won rally, 0 = AI won rally
  const rallyHistory = [];
  const RALLY_WINDOW = 6;
  let rallyLengthSum = 0, rallyLengthCount = 0, currentRallyHits = 0;

  function applyDifficulty(diff) {
    const p = DIFFICULTIES[diff] || DIFFICULTIES.medium;
    aiParams.baseSpeed = p.baseSpeed;
    aiParams.reactionDelay = p.reactionDelay;
    aiParams.prediction = p.prediction;
    aiParams.missProb = p.missProb;
    aiParams.errorAmp = p.errorAmp;
    rallyHistory.length = 0;
    rallyLengthSum = 0; rallyLengthCount = 0; currentRallyHits = 0;
  }
  applyDifficulty(difficulty);

  // Adaptive medium: adjust after each rally
  function adjustAdaptive() {
    if (difficulty !== 'medium') return;
    const n = rallyHistory.length;
    if (n < 2) return;
    const winRate = rallyHistory.reduce((a, b) => a + b, 0) / n;
    const avgLen = rallyLengthCount > 0 ? rallyLengthSum / rallyLengthCount : 2;
    // Target: win rate ~= 0.5. If player winning too much, make AI harder. Losing? Easier.
    // Delta scaled by how far from 0.5 we are.
    const winDelta = winRate - 0.5;    // +0.5 = player dominating, -0.5 = player losing
    const lenFactor = avgLen > 5 ? 1 : avgLen / 5;  // don't over-correct on short rallies
    const adjust = winDelta * 2 * lenFactor;        // in [-1, 1] roughly
    // Baselines
    const base = DIFFICULTIES.medium;
    aiParams.baseSpeed     = clamp(base.baseSpeed     + adjust * 2.2, 2.8, 6.2);
    aiParams.reactionDelay = clamp(base.reactionDelay - adjust * 0.18, 0.14, 0.5);
    aiParams.prediction    = clamp(base.prediction    + adjust * 0.4,  0.05, 0.9);
    aiParams.missProb      = clamp(base.missProb      - adjust * 0.08, 0.03, 0.22);
    aiParams.errorAmp      = clamp(base.errorAmp      - adjust * 14,   6, 38);
  }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  // ── Objects ───────────────────────────────────────────────────
  const pl  = { x: 20,          y: H/2 - PH_BASE/2, w: PW, h: PH_BASE };
  const ai  = { x: W - 20 - AIW, y: H/2 - AIH/2,    w: AIW, h: AIH,
                trackedY: H/2, reactionTimer: 0, errorOffset: 0, errorTimer: 0,
                missThisRally: false };
  let ball, particles, powerUps, floats;
  let score, lives, rally, mult, state, flash, flashColor;
  let effects; // { wide: secs, slow: secs, shield: bool }
  let puTimer, lastT;
  let highScore; try { highScore = +(localStorage.getItem('cp_hs') || 0); } catch(e) { highScore = 0; }

  // ── Input ─────────────────────────────────────────────────────
  let targetY = H / 2;
  const keys  = {};

  // Mouse: absolute paddle position from cursor
  cvs.addEventListener('mousemove', e => {
    const r = cvs.getBoundingClientRect();
    targetY = (e.clientY - r.top) * (H / r.height) - pl.h / 2;
  });

  // Keyboard
  window.addEventListener('keydown', e => {
    keys[e.key] = true;
    // Lower-case alias so Shift+W/S still count as held
    if (e.key.length === 1) keys[e.key.toLowerCase()] = true;
  });
  window.addEventListener('keyup',   e => {
    keys[e.key] = false;
    if (e.key.length === 1) keys[e.key.toLowerCase()] = false;
  });
  // Clear keys on blur so held keys don't stick when focus changes
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

  // Start / restart on click or canvas tap (only when game is already in a playable state)
  cvs.addEventListener('click', () => { if (state === 'gameover' || state === 'ready') startGame(); });
  cvs.addEventListener('touchend', e => {
    e.preventDefault();
    if (state === 'gameover' || state === 'ready') startGame();
  }, { passive: false });

  // ── Vertical joystick ─────────────────────────────────────────
  const stickZone = document.getElementById('stick-zone');
  const stickKnob = document.getElementById('stick-knob');
  const STICK_MAX = 46; // max px travel up or down
  let stickVecY = 0;
  let stickTouchId = null;
  let stickMouseDown = false;

  function setStickY(clientY) {
    const r = stickZone.getBoundingClientRect();
    const dy = Math.max(-STICK_MAX, Math.min(STICK_MAX, clientY - (r.top + r.height / 2)));
    stickKnob.style.transform = `translateY(${dy}px)`;
    stickVecY = dy / STICK_MAX;
  }
  function resetStick() {
    stickKnob.style.transform = '';
    stickVecY = 0;
    stickTouchId = null;
  }

  stickZone.addEventListener('touchstart', e => {
    e.preventDefault();
    if (stickTouchId !== null) return;
    const t = e.changedTouches[0]; stickTouchId = t.identifier;
    setStickY(t.clientY);
  }, { passive: false });
  stickZone.addEventListener('touchmove', e => {
    e.preventDefault();
    for (const t of e.changedTouches) if (t.identifier === stickTouchId) { setStickY(t.clientY); break; }
  }, { passive: false });
  function onStickEnd(e) {
    for (const t of e.changedTouches) if (t.identifier === stickTouchId) { resetStick(); break; }
  }
  stickZone.addEventListener('touchend',   onStickEnd, { passive: false });
  stickZone.addEventListener('touchcancel',onStickEnd, { passive: false });

  stickZone.addEventListener('mousedown', e => { e.preventDefault(); stickMouseDown = true; setStickY(e.clientY); });
  window.addEventListener('mousemove', e => { if (stickMouseDown) setStickY(e.clientY); });
  window.addEventListener('mouseup',   ()  => { if (stickMouseDown) { stickMouseDown = false; resetStick(); } });

  // ── Init ──────────────────────────────────────────────────────
  function makeBall(dir) {
    const a = (Math.random() * 0.5 - 0.25);
    const spd = BASE_SPD * (effects && effects.slow ? 0.62 : 1);
    return { x: W/2, y: H/2,
             vx: dir * spd * Math.cos(a),
             vy: spd * Math.sin(a),
             trail: [], spin: 0 };
  }

  function startGame() {
    effects  = {};
    pl.h     = PH_BASE;
    pl.y     = H/2 - PH_BASE/2;
    targetY  = H/2 - PH_BASE/2;   // reset so paddle doesn't snap to a stale position
    ai.y     = H/2 - AIH/2;
    ai.trackedY = H/2;
    ai.reactionTimer = 0;
    ai.errorOffset = 0; ai.errorTimer = 0;
    ai.missThisRally = Math.random() < aiParams.missProb;
    ball     = makeBall(1);
    particles = []; powerUps = []; floats = [];
    score = 0; lives = 5; rally = 0; mult = 1;
    state = 'playing'; flash = 0; flashColor = '#f44';
    puTimer  = PU_INTERVAL;
    lastT    = performance.now();
    currentRallyHits = 0;
    rallyHistory.length = 0;
    rallyLengthSum = 0; rallyLengthCount = 0;
    applyDifficulty(difficulty);
  }

  // Initialise safe defaults so draw() never touches undefined refs on the menu screen
  effects = {}; pl.h = PH_BASE;
  ball = { x: W/2, y: H/2, vx: 0, vy: 0, trail: [] };
  particles = []; powerUps = []; floats = [];
  score = 0; lives = 5; rally = 0; mult = 1; flash = 0; flashColor = '#f44';
  puTimer = PU_INTERVAL;
  state = 'ready';   // waiting for first tap/click after selecting difficulty

  // ── Power-up definitions ──────────────────────────────────────
  const PU_DEFS = [
    { id: 'wide',   label: 'WIDE',   color: '#0f8',  glow: '#0f8' },
    { id: 'slow',   label: 'SLOW',   color: '#fe0',  glow: '#fe0' },
    { id: 'shield', label: 'GUARD',  color: '#c0f',  glow: '#c0f' },
  ];

  function spawnPU() {
    const def = PU_DEFS[Math.floor(Math.random() * PU_DEFS.length)];
    powerUps.push({
      x: W/2 + (Math.random() * 140 - 70),
      y: PUR + Math.random() * (H - PUR * 2),
      pulse: Math.random() * Math.PI * 2,
      ...def
    });
  }

  function collectPU(pu) {
    burst(pu.x, pu.y, pu.color, 18);
    floats.push({ x: pu.x, y: pu.y - 10, text: pu.label, color: pu.color, life: 1.2 });
    if (pu.id === 'wide') {
      const already = !!effects.wide;
      effects.wide = (effects.wide || 0) + 9;
      if (!already) pl.h = PH_BASE * 1.75;
    } else if (pu.id === 'slow') {
      const already = !!effects.slow;
      effects.slow = (effects.slow || 0) + 7;
      if (!already) {
        ball.vx *= 0.62;   // only slow the ball the first time; repeats extend duration
        ball.vy *= 0.62;
      }
    } else if (pu.id === 'shield') {
      effects.shield = (effects.shield || 0) + 1;
    }
  }

  // ── Particles ─────────────────────────────────────────────────
  function burst(x, y, color, n = 10) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 55 + Math.random() * 110;
      particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 0.55, color });
    }
  }

  // ── Helpers ───────────────────────────────────────────────────
  function hitAngle(paddle, by) {
    const rel = (by - (paddle.y + paddle.h/2)) / (paddle.h/2);
    return Math.max(-1, Math.min(1, rel)) * (Math.PI / 3.8);
  }

  // Predict where the ball will cross the AI paddle's x, accounting for wall bounces.
  function predictImpactY() {
    if (ball.vx <= 0) return H/2;
    let x = ball.x, y = ball.y, vx = ball.vx, vy = ball.vy;
    const targetX = ai.x;
    // Analytical bounce-reflection: unfold wall bounces into a straight line.
    const t = (targetX - x) / vx;
    if (t <= 0) return H/2;
    let yEnd = y + vy * t;
    // Fold yEnd back into [0, H] via triangle wave
    const H2 = H * 2;
    let m = ((yEnd % H2) + H2) % H2;
    if (m > H) m = H2 - m;
    return m;
  }

  function aiTargetY() {
    // Mix current tracked ball Y with prediction based on difficulty.prediction
    const predicted = predictImpactY();
    const tracked = ai.trackedY;
    return tracked * (1 - aiParams.prediction) + predicted * aiParams.prediction;
  }

  // ── Update ────────────────────────────────────────────────────
  function update(dt) {
    flash = Math.max(0, flash - dt);

    // Always tick particles and floats so they finish animating on game-over screen
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= Math.pow(0.88, dt * 60);  // FPS-independent damping
      p.vy *= Math.pow(0.88, dt * 60);
      p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }
    for (let i = floats.length - 1; i >= 0; i--) {
      const f = floats[i];
      f.y -= 28 * dt;
      f.life -= dt;
      if (f.life <= 0) floats.splice(i, 1);
    }

    if (state !== 'playing') return;
    puTimer -= dt;
    if (puTimer <= 0 && powerUps.length < 2) { puTimer = PU_INTERVAL; spawnPU(); }

    // Effect timers
    if (effects.wide) {
      effects.wide -= dt;
      if (effects.wide <= 0) { delete effects.wide; pl.h = PH_BASE; }
    }
    if (effects.slow) {
      effects.slow -= dt;
      if (effects.slow <= 0) {
        delete effects.slow;
        const spd = Math.hypot(ball.vx, ball.vy);
        if (spd > 0 && spd < BASE_SPD - 0.5) {   // guard spd>0 to prevent NaN from div-by-zero
          ball.vx = (ball.vx / spd) * BASE_SPD;
          ball.vy = (ball.vy / spd) * BASE_SPD;
        }
      }
    }

    // Player paddle — all movement is dt-scaled (frame-rate independent)
    const upHeld   = keys['ArrowUp']   || keys['w'] || keys['W'];
    const downHeld = keys['ArrowDown'] || keys['s'] || keys['S'];
    if (upHeld && !downHeld)   targetY -= 420 * dt;
    if (downHeld && !upHeld)   targetY += 420 * dt;
    if (Math.abs(stickVecY) > 0.05) targetY += stickVecY * 420 * dt;
    targetY = Math.max(0, Math.min(H - pl.h, targetY));   // clamp so it never drifts past wall
    // Exponential lerp — correct under variable dt
    const plAlpha = 1 - Math.pow(1 - 0.22, dt * 60);
    pl.y += (targetY - pl.y) * plAlpha;
    pl.y  = Math.max(0, Math.min(H - pl.h, pl.y));

    // AI paddle — delayed reaction + small error offset, parameterized by difficulty
    ai.reactionTimer -= dt;
    if (ai.reactionTimer <= 0) {
      ai.reactionTimer = aiParams.reactionDelay + Math.random() * 0.15;
      ai.trackedY = ball.y;
    }
    ai.errorTimer -= dt;
    if (ai.errorTimer <= 0) {
      ai.errorTimer = 1.2 + Math.random() * 0.8;
      ai.errorOffset = (Math.random() - 0.5) * aiParams.errorAmp;
    }
    // When AI has decided to miss this rally, shift target away from ball on the return leg
    let missShift = 0;
    if (ai.missThisRally && ball.vx > 0 && ball.x > W * 0.55) {
      missShift = (ball.y > H/2 ? -1 : 1) * (ai.h * 0.9);
    }
    const tgt = aiTargetY() + ai.errorOffset + missShift - ai.h / 2;
    const aiDy = tgt - ai.y;
    const aiStep = aiParams.baseSpeed * dt * 60;
    ai.y += Math.sign(aiDy) * Math.min(Math.abs(aiDy), aiStep);
    ai.y  = Math.max(0, Math.min(H - ai.h, ai.y));

    // ── Ball movement with swept (CCD) collision to prevent tunneling ──
    ball.trail.push({ x: ball.x, y: ball.y });
    if (ball.trail.length > 14) ball.trail.shift();

    const frameDx = ball.vx * dt * 60;
    const frameDy = ball.vy * dt * 60;
    // Sub-step if movement-per-step > min(paddle width, ball radius). Prevents tunneling at high FPS-independent dt spikes.
    const maxStep = Math.min(PW, BR) * 0.9;
    const stepMag = Math.hypot(frameDx, frameDy);
    const steps = Math.max(1, Math.ceil(stepMag / maxStep));
    const sx = frameDx / steps;
    const sy = frameDy / steps;

    let scored = false;
    for (let s = 0; s < steps && !scored; s++) {
      const prevX = ball.x, prevY = ball.y;
      ball.x += sx; ball.y += sy;

      // Wall bounce
      if (ball.y - BR < 0)  { ball.y = BR;      ball.vy =  Math.abs(ball.vy); burst(ball.x, 0, '#0df', 5); }
      if (ball.y + BR > H)  { ball.y = H - BR;  ball.vy = -Math.abs(ball.vy); burst(ball.x, H, '#0df', 5); }

      // Player paddle (swept: ball moving left and crossed paddle's right edge this step)
      if (ball.vx < 0) {
        const plRight = pl.x + pl.w;
        const crossed = (prevX - BR) > plRight && (ball.x - BR) <= plRight;
        const onFace  = (ball.x - BR) <= plRight && (ball.x - BR) >= pl.x - 4;
        if ((crossed || onFace) && ball.y >= pl.y - BR && ball.y <= pl.y + pl.h + BR) {
          const ang = hitAngle(pl, ball.y);
          const spd = Math.min(Math.hypot(ball.vx, ball.vy) + 0.18, BASE_SPD * 2.2);
          ball.vx =  spd * Math.cos(ang);
          ball.vy =  spd * Math.sin(ang);
          ball.x  = plRight + BR;
          rally++;
          currentRallyHits++;
          mult = 1 + Math.floor(rally / 2);
          burst(ball.x, ball.y, '#0df', 10);
          // Power-up collection check happens below each frame
        }
      }

      // AI paddle (swept: ball moving right and crossed paddle's left edge this step)
      if (ball.vx > 0) {
        const aiLeft = ai.x;
        const crossed = (prevX + BR) < aiLeft && (ball.x + BR) >= aiLeft;
        const onFace  = (ball.x + BR) >= aiLeft && (ball.x + BR) <= aiLeft + ai.w + 4;
        if ((crossed || onFace) && ball.y >= ai.y - BR && ball.y <= ai.y + ai.h + BR) {
          const ang = hitAngle(ai, ball.y);
          const spd = Math.hypot(ball.vx, ball.vy);
          ball.vx = -spd * Math.cos(ang);
          ball.vy =  spd * Math.sin(ang);
          ball.x  = aiLeft - BR;
          burst(ball.x, ball.y, '#f06', 10);
          // After AI hits, roll for next-rally miss chance
        }
      }

      // Power-up collection
      for (let i = powerUps.length - 1; i >= 0; i--) {
        const pu = powerUps[i];
        if (Math.hypot(ball.x - pu.x, ball.y - pu.y) < PUR + BR) {
          collectPU(pu);
          powerUps.splice(i, 1);
        }
      }

      // Scored right (player gets point)
      if (ball.x - BR > W) {
        const earned = mult;
        score += earned;
        if (score > highScore) { highScore = score; try { localStorage.setItem('cp_hs', highScore); } catch(e) {} }
        floats.push({ x: W/2, y: H/2 - 20, text: `+${earned}`, color: '#0df', life: 1 });
        recordRally(true);
        rally = 0; mult = 1;
        ball = makeBall(-1); // serve toward player
        ai.missThisRally = Math.random() < aiParams.missProb;
        scored = true;
      }
      // Scored left (AI gets point / player misses)
      if (!scored && ball.x + BR < 0) {
        if (effects.shield) {
          effects.shield--;
          if (effects.shield <= 0) delete effects.shield;
          burst(pl.x + pl.w, pl.y + pl.h/2, '#c0f', 20);
          floats.push({ x: W/2, y: H/2, text: 'SAVED!', color: '#c0f', life: 1.2 });
          ball = makeBall(1);
          scored = true;
        } else {
          lives--;
          flash = 0.7; flashColor = '#f33';
          recordRally(false);
          rally = 0; mult = 1;
          if (lives <= 0) {
            state = 'gameover';
            window.dispatchEvent(new CustomEvent('lbGameOver', { detail: { score: score } }));
          } else {
            ball = makeBall(1);
            pl.h = PH_BASE; delete effects.wide;
            ai.missThisRally = Math.random() < aiParams.missProb;
          }
          scored = true;
        }
      }
    }

    // Update power-up pulse animation once per frame
    for (const pu of powerUps) pu.pulse += dt * 2.5;
  }

  function recordRally(playerWon) {
    rallyHistory.push(playerWon ? 1 : 0);
    if (rallyHistory.length > RALLY_WINDOW) rallyHistory.shift();
    rallyLengthSum += currentRallyHits;
    rallyLengthCount++;
    if (rallyLengthCount > RALLY_WINDOW) {
      // Keep the average over the window by approximating (simple but sufficient)
      rallyLengthSum -= rallyLengthSum / rallyLengthCount;
      rallyLengthCount--;
    }
    currentRallyHits = 0;
    adjustAdaptive();
  }

  // ── Draw ──────────────────────────────────────────────────────
  function glow(color, blur) { ctx.shadowColor = color; ctx.shadowBlur = blur; }
  function noGlow() { ctx.shadowBlur = 0; }

  function drawPaddle(p, color, glowColor) {
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(p.x + 2, p.y + 3, p.w, p.h);
    glow(glowColor, 22);
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.roundRect(p.x, p.y, p.w, p.h, 4); ctx.fill();
    noGlow();
  }

  function draw() {
    // BG
    ctx.fillStyle = '#020812';
    ctx.fillRect(0, 0, W, H);

    // Flash
    if (flash > 0) {
      ctx.globalAlpha = flash * 0.28;
      ctx.fillStyle = flashColor;
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }

    // Centre dashes
    ctx.setLineDash([7, 11]);
    ctx.strokeStyle = 'rgba(255,255,255,0.07)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(W/2, 0); ctx.lineTo(W/2, H); ctx.stroke();
    ctx.setLineDash([]);

    // Ball trail
    for (let i = 0; i < ball.trail.length; i++) {
      const t = ball.trail[i];
      const frac = i / ball.trail.length;
      ctx.globalAlpha = frac * 0.45;
      ctx.fillStyle = '#0df';
      ctx.beginPath(); ctx.arc(t.x, t.y, BR * frac * 0.85, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Ball
    glow('#0df', 24);
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(ball.x, ball.y, BR, 0, Math.PI*2); ctx.fill();
    noGlow();

    // Paddles
    const plColor = effects.wide ? '#0f8' : effects.shield ? '#c0f' : '#fff';
    const plGlow  = effects.wide ? '#0f8' : effects.shield ? '#c0f' : '#0df';
    drawPaddle(pl, plColor, plGlow);
    drawPaddle(ai, '#f06', '#f06');

    // Power-ups
    for (const pu of powerUps) {
      const p = Math.sin(pu.pulse) * 0.25 + 0.75;
      ctx.globalAlpha = p;
      glow(pu.glow, 20);
      ctx.fillStyle = pu.color;
      ctx.beginPath(); ctx.arc(pu.x, pu.y, PUR, 0, Math.PI*2); ctx.fill();
      noGlow();
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#000';
      ctx.font = 'bold 7px Barlow';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(pu.label.slice(0,3), pu.x, pu.y);
    }

    // Particles
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / 0.55);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3);
    }
    ctx.globalAlpha = 1;

    // Floating text
    for (const f of floats) {
      ctx.globalAlpha = Math.min(1, f.life * 2);
      glow(f.color, 10);
      ctx.fillStyle = f.color;
      ctx.font = 'bold 18px "Bebas Neue", cursive';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(f.text, f.x, f.y);
      noGlow();
    }
    ctx.globalAlpha = 1;

    // ── HUD ──────────────────────────────────────────────────────
    // Score (player side)
    glow('#0df', 10);
    ctx.fillStyle = '#0df';
    ctx.font = 'bold 36px "Bebas Neue", cursive';
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillText(score, W / 4, 12);
    noGlow();

    // Lives
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.font = '13px Barlow';
    const hearts = '\u2665'.repeat(Math.max(0, lives)) + '\u2661'.repeat(Math.max(0, 5 - lives));
    ctx.fillText(hearts, W / 4, 52);

    // Combo multiplier
    if (mult > 1) {
      glow('#fe0', 10);
      ctx.fillStyle = '#fe0';
      ctx.font = 'bold 22px "Bebas Neue", cursive';
      ctx.textAlign = 'center';
      ctx.fillText(`\u00d7${mult} COMBO`, W/2, 12);
      noGlow();
    }

    // High score + difficulty label
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.font = '10px Barlow';
    ctx.textAlign = 'right'; ctx.textBaseline = 'top';
    ctx.fillText(`BEST ${highScore}`, W - 12, 12);
    const diffDef = DIFFICULTIES[difficulty];
    const diffColor = difficulty === 'easy' ? '#0f8' : difficulty === 'hard' ? '#f06' : '#fe0';
    ctx.fillStyle = diffColor;
    ctx.globalAlpha = 0.55;
    ctx.fillText(diffDef.label, W - 12, 28);
    ctx.globalAlpha = 1;

    // Active effects list
    let ey = 68;
    ctx.font = '10px Barlow'; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    if (effects.wide)   { ctx.fillStyle = '#0f8'; ctx.fillText(`WIDE  ${effects.wide.toFixed(1)}s`,  14, ey); ey += 15; }
    if (effects.slow)   { ctx.fillStyle = '#fe0'; ctx.fillText(`SLOW  ${effects.slow.toFixed(1)}s`,  14, ey); ey += 15; }
    if (effects.shield) { ctx.fillStyle = '#c0f'; ctx.fillText(`GUARD  x${effects.shield}`,          14, ey); }

    // ── Overlays ─────────────────────────────────────────────────
    if (state === 'ready' || state === 'gameover') {
      ctx.fillStyle = 'rgba(2,8,18,0.82)';
      ctx.fillRect(0, 0, W, H);

      glow('#0df', 26);
      ctx.fillStyle = '#0df';
      ctx.font = 'bold 60px "Bebas Neue", cursive';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(state === 'ready' ? 'CYBER PONG' : 'GAME OVER', W/2, H/2 - 60);
      noGlow();

      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.font = '13px Barlow';
      if (state === 'ready') {
        ctx.fillText('Collect power-ups  ·  build combos  ·  beat the AI', W/2, H/2 - 10);
        ctx.fillText('WIDE pads your paddle  ·  SLOW drags the ball  ·  GUARD blocks one miss', W/2, H/2 + 10);
      } else {
        ctx.fillText(`SCORE  ${score}   \u2022   BEST  ${highScore}`, W/2, H/2 - 10);
      }

      // Current difficulty badge
      ctx.fillStyle = diffColor;
      ctx.font = 'bold 14px "Bebas Neue", cursive';
      ctx.fillText(`DIFFICULTY: ${diffDef.label}`, W/2, H/2 + 34);

      glow('#0df', 8);
      ctx.fillStyle = '#0df';
      ctx.font = 'bold 18px "Bebas Neue", cursive';
      ctx.fillText('TAP  OR  CLICK  TO  ' + (state === 'ready' ? 'START' : 'RETRY'), W/2, H/2 + 62);
      noGlow();

      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.font = '10px Barlow';
      ctx.fillText('Tap gear icon (top-right) to change difficulty', W/2, H/2 + 86);
    }
  }

  // ── Loop ──────────────────────────────────────────────────────
  function loop(t) {
    if (!lastT) lastT = t;
    // Cap dt to avoid huge jumps on tab-resume / slow frames
    const dt = Math.min((t - lastT) / 1000, 1/30);
    lastT = t;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);

  // ── Difficulty menu wiring ────────────────────────────────────
  const diffMenu = document.getElementById('diff-menu');
  const diffBtn  = document.getElementById('diff-btn');
  function updateSelectedBtn() {
    diffMenu.querySelectorAll('.diff-btn').forEach(b => {
      b.classList.toggle('selected', b.dataset.diff === difficulty);
    });
  }
  function showDiffMenu() { updateSelectedBtn(); diffMenu.classList.add('visible'); }
  function hideDiffMenu() { diffMenu.classList.remove('visible'); }
  diffMenu.querySelectorAll('.diff-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      difficulty = btn.dataset.diff;
      try { localStorage.setItem('cp_diff', difficulty); } catch(e) {}
      applyDifficulty(difficulty);
      updateSelectedBtn();
      hideDiffMenu();
    });
  });
  diffBtn.addEventListener('click', showDiffMenu);

  // Show menu on first-ever visit
  try {
    if (!localStorage.getItem('cp_diff')) showDiffMenu();
  } catch(e) {}
})();

// ── Fullscreen ────────────────────────────────────────────────
(function() {
  const btn = document.getElementById('fs-btn');
  const enterIcon = document.getElementById('fs-enter');
  const exitIcon  = document.getElementById('fs-exit');
  document.addEventListener('fullscreenchange', function() {
    const inFs = !!document.fullscreenElement;
    enterIcon.style.display = inFs ? 'none' : '';
    exitIcon.style.display  = inFs ? '' : 'none';
  });
  btn.addEventListener('click', function() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen({ navigationUI: 'hide' })
        .then(function() {
          if (screen.orientation && screen.orientation.lock)
            screen.orientation.lock('landscape').catch(function() {});
        }).catch(function() {});
    } else {
      document.exitFullscreen().catch(function() {});
    }
  });
})();
</script>
<script src="/leaderboard.js" data-game="cyber-pong" data-color="#00ddff"></script>
</body>
