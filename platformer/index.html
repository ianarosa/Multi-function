<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>NEON RUNNER</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #07040e; font-family: 'Barlow', monospace; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }

  #top-bar {
    display: flex; align-items: center; width: 100%; max-width: 900px;
    padding: 0 4px 6px; gap: 12px;
  }
  #back-btn {
    background: rgba(0,0,0,0.5); border: 1px solid rgba(255,90,95,0.3);
    color: rgba(255,90,95,0.75); font-family: 'Barlow', sans-serif;
    font-size: 11px; font-weight: 600; letter-spacing: 1px; padding: 5px 12px;
    cursor: pointer; text-decoration: none; border-radius: 4px;
    white-space: nowrap; flex-shrink: 0; transition: background 0.15s, color 0.15s;
  }
  #back-btn:hover { background: rgba(255,90,95,0.15); color: #ff5a5f; }

  h1 {
    font-family: 'Bebas Neue', cursive; color: #ff5a5f; font-size: 2rem;
    letter-spacing: 0.15em;
    text-shadow: 0 0 20px rgba(255,90,95,0.55); flex: 1; text-align: center;
  }
  #top-spacer { width: 70px; flex-shrink: 0; display: flex; justify-content: flex-end; align-items: center; }
  #fs-btn {
    background: rgba(0,0,0,0.5); border: 1px solid rgba(255,90,95,0.3);
    color: rgba(255,90,95,0.75); border-radius: 4px; cursor: pointer;
    width: 32px; height: 28px; display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, color 0.15s; flex-shrink: 0;
  }
  #fs-btn:hover { background: rgba(255,90,95,0.15); color: #ff5a5f; }

  #gameCanvas {
    display: block; max-width: 100%;
    border: 1px solid rgba(255,90,95,0.18); border-radius: 6px;
    box-shadow: 0 0 60px rgba(255,90,95,0.14), 0 0 0 1px rgba(255,90,95,0.05);
  }
  #hint {
    margin-top: 8px; color: rgba(255,255,255,0.2); font-size: 0.68rem;
    letter-spacing: 0.08em; text-transform: uppercase;
  }

  /* ── On-screen touch controls ── */
  /* Touch controls: shown by default (mobile), hidden on precise-pointer desktops. */
  #pad { position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
    display: flex; justify-content: space-between; align-items: flex-end;
    padding: 0 16px 18px; pointer-events: none; }
  @media (hover: hover) and (pointer: fine) {
    #pad { display: none !important; }
  }
  #pad .side { display: flex; gap: 12px; pointer-events: none; }
  .ctl {
    pointer-events: auto; -webkit-user-select: none; user-select: none;
    width: 64px; height: 64px; border-radius: 50%;
    background: rgba(255,90,95,0.08); border: 2px solid rgba(255,90,95,0.4);
    color: rgba(255,90,95,0.85); font-family: 'Bebas Neue', cursive;
    font-size: 1.9rem; line-height: 1; display: flex; align-items: center; justify-content: center;
    cursor: pointer; touch-action: none; backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px); transition: background 0.08s, transform 0.08s;
  }
  .ctl:active, .ctl.on { background: rgba(255,90,95,0.28); transform: scale(0.94); }
  #ctl-jump { width: 86px; height: 86px; font-size: 1.15rem; letter-spacing: 0.04em;
    background: rgba(255,90,95,0.12); box-shadow: 0 0 22px rgba(255,90,95,0.25); }

  @media (orientation: landscape) {
    #top-bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 50;
      background: rgba(7,4,14,0.55); pointer-events: none;
    }
    #top-bar > * { pointer-events: auto; }
    h1 { display: none; }
    #hint { display: none; }
  }

  /* ── Unified Arcade HUD (canonical, 48px height) ── */
  #top-bar, .top-bar, .topbar, #topBar {
    box-sizing: border-box !important;
    width: 100% !important;
    max-width: none !important;
    height: 48px !important;
    min-height: 48px !important;
    padding: 0 12px !important;
    margin: 0 !important;
    gap: 10px !important;
    display: flex !important;
    align-items: center !important;
    justify-content: space-between !important;
    font-family: 'Barlow', 'Courier New', sans-serif !important;
    background: rgba(8,8,14,0.88) !important;
    border-bottom: 1px solid rgba(255,255,255,0.1) !important;
    backdrop-filter: blur(10px) !important;
    -webkit-backdrop-filter: blur(10px) !important;
    flex-shrink: 0 !important;
    position: relative !important;
    z-index: 100 !important;
  }
  #top-bar h1, .top-bar h1, .topbar h1, #topBar h1 {
    font-family: 'Bebas Neue','Barlow',sans-serif !important;
    font-size: 22px !important;
    letter-spacing: 3px !important;
    font-weight: 700 !important;
    flex: 1 1 auto !important;
    text-align: center !important;
    margin: 0 !important;
    padding: 0 !important;
    position: static !important;
    transform: none !important;
    white-space: nowrap !important;
    overflow: hidden !important;
    text-overflow: ellipsis !important;
    line-height: 1 !important;
    pointer-events: none !important;
  }
  #top-bar #back-btn, .top-bar #back-btn {
    font-family: 'Barlow', 'Courier New', sans-serif !important;
    font-size: 11px !important;
    font-weight: 600 !important;
    letter-spacing: 2px !important;
    text-transform: uppercase !important;
    padding: 0 12px !important;
    border-radius: 4px !important;
    border: 1px solid currentColor !important;
    background: rgba(0,0,0,0.35) !important;
    text-decoration: none !important;
    line-height: 1 !important;
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    height: 30px !important;
    min-height: 30px !important;
    width: auto !important;
    white-space: nowrap !important;
    flex-shrink: 0 !important;
    box-sizing: border-box !important;
  }
  #top-bar #fs-btn, .top-bar #fs-btn {
    width: 32px !important;
    height: 30px !important;
    min-width: 32px !important;
    min-height: 30px !important;
    padding: 0 !important;
    border-radius: 4px !important;
    border: 1px solid currentColor !important;
    background: rgba(0,0,0,0.35) !important;
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    font-size: 14px !important;
    flex-shrink: 0 !important;
    box-sizing: border-box !important;
  }
  #top-bar #top-spacer, .top-bar #top-spacer {
    flex-shrink: 0 !important;
    display: flex !important;
    align-items: center !important;
    justify-content: flex-end !important;
    gap: 6px !important;
    width: auto !important;
  }

  /* ── Brotato-style SELECT screen + post-game (DOM overlays) ── */
  #select, #pg {
    position: fixed; inset: 0; z-index: 150; display: none;  /* above the top-bar so it fully covers the screen */
    flex-direction: column; align-items: center;
    background: rgba(6,3,12,0.94);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    font-family: 'Barlow', sans-serif;
  }
  /* full-viewport layout: sections distributed down the whole height, scaling with the screen */
  #select {
    justify-content: space-evenly; overflow: hidden;
    padding: clamp(54px, 7vh, 110px) 2vw clamp(20px, 4vh, 64px);
  }
  #pg { justify-content: center; gap: 13px; padding: 54px 12px 20px; overflow-y: auto; }
  .sel-head { display: flex; flex-direction: column; align-items: center; gap: clamp(4px, 1vh, 14px); }
  .sel-danger-group { display: flex; flex-direction: column; align-items: center; gap: clamp(8px, 1.6vh, 22px); width: 100%; }
  #select .sel-title {
    font-family: 'Bebas Neue', cursive; font-size: clamp(2.2rem, 7vw, 6rem);
    letter-spacing: 0.14em; color: #ff5a5f; text-shadow: 0 0 32px rgba(255,90,95,0.6); line-height: 0.95;
  }
  #select .sel-sub {
    font-size: clamp(0.66rem, 1.3vw, 1.05rem); letter-spacing: 0.28em; color: rgba(255,255,255,0.45);
    text-transform: uppercase; font-weight: 600;
  }
  .carousel-wrap {
    position: relative; width: 100%;
    min-height: clamp(210px, 30vh, 380px); overflow: hidden;
  }
  .car-strip {
    position: absolute; top: 50%; left: 0; display: flex;
    gap: clamp(14px, 1.6vw, 34px); align-items: center;
    transition: transform 0.22s cubic-bezier(.2,.7,.3,1); will-change: transform;
  }
  .card {
    width: clamp(140px, 15vw, 280px); flex: 0 0 auto; box-sizing: border-box; border-radius: clamp(12px, 1vw, 18px);
    background: rgba(20,10,26,0.92); border: 1px solid rgba(255,90,95,0.28);
    padding: clamp(14px, 1.5vw, 28px) clamp(12px, 1.2vw, 22px); text-align: center; cursor: pointer;
    transform: scale(0.86); opacity: 0.26;
    transition: transform 0.22s, opacity 0.22s, box-shadow 0.22s, border-color 0.22s;
  }
  .card.focus {
    transform: scale(1.14); border-color: #ff5a5f; opacity: 1 !important;
    box-shadow: 0 0 42px rgba(255,90,95,0.4), inset 0 0 26px rgba(255,90,95,0.08);
  }
  .card .card-tag { font-size: clamp(0.52rem, 0.8vw, 0.82rem); letter-spacing: 0.2em; color: #ff5a5f; text-transform: uppercase; opacity: 0.85; }
  .card .card-name { font-family: 'Bebas Neue', cursive; font-size: clamp(1.4rem, 2.2vw, 2.9rem); letter-spacing: 0.05em; color: #fff; margin: clamp(6px, 0.9vh, 16px) 0 3px; line-height: 1; }
  .card .card-desc { font-size: clamp(0.66rem, 1vw, 1.02rem); color: rgba(255,255,255,0.55); min-height: 2.3em; }
  .card .card-best { margin-top: clamp(8px, 1.1vh, 18px); font-size: clamp(0.6rem, 0.9vw, 0.94rem); letter-spacing: 0.05em; color: #ffd24a; }
  .car-arrow {
    position: absolute; top: 50%; transform: translateY(-50%); z-index: 2;
    width: clamp(40px, 3.4vw, 62px); height: clamp(40px, 3.4vw, 62px); border-radius: 50%; background: rgba(255,90,95,0.12);
    border: 1.5px solid rgba(255,90,95,0.5); color: #ff5a5f; font-size: clamp(1.6rem, 2.4vw, 2.8rem); line-height: 1;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .car-arrow:active { background: rgba(255,90,95,0.3); }
  #car-left { left: clamp(4px, 1.5vw, 34px); } #car-right { right: clamp(4px, 1.5vw, 34px); }
  .danger { display: flex; gap: clamp(7px, 0.8vw, 16px); flex-wrap: wrap; justify-content: center; }
  .pip {
    width: clamp(34px, 3.4vw, 64px); height: clamp(30px, 4.2vh, 54px); border-radius: 6px; border: 1.5px solid rgba(255,90,95,0.4);
    background: rgba(255,90,95,0.06); color: rgba(255,255,255,0.55);
    font-family: 'Bebas Neue', cursive; font-size: clamp(1.1rem, 1.8vw, 2rem);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .pip.on { background: #ff5a5f; color: #0a0510; border-color: #ff5a5f; box-shadow: 0 0 16px rgba(255,90,95,0.55); }
  #danger-info { font-size: clamp(0.68rem, 1.05vw, 1.05rem); color: rgba(255,255,255,0.64); text-align: center; max-width: min(760px, 92vw); line-height: 1.55; min-height: 2.6em; padding: 0 8px; }
  #danger-info b { color: #ffd24a; }
  #start-btn {
    font-family: 'Bebas Neue', cursive; font-size: clamp(1.5rem, 2.6vw, 3rem); letter-spacing: 0.14em;
    color: #0a0510; background: #ff5a5f; border: none; border-radius: clamp(8px, 0.8vw, 14px);
    padding: clamp(10px, 1.5vh, 20px) clamp(46px, 7vw, 120px);
    cursor: pointer; box-shadow: 0 0 30px rgba(255,90,95,0.5);
  }
  #start-btn:hover { filter: brightness(1.08); }
  #start-btn:active { transform: scale(0.97); }
  /* post-game */
  #pg .pg-title { font-family: 'Bebas Neue', cursive; font-size: clamp(2.2rem, 10vw, 3.8rem); letter-spacing: 0.1em; color: #ff5a5f; text-shadow: 0 0 26px rgba(255,90,95,0.6); }
  #pg .pg-title.win { color: #12ffe8; text-shadow: 0 0 26px rgba(18,255,232,0.6); }
  #pg-stats { text-align: center; color: #fff; font-size: 0.95rem; line-height: 1.85; letter-spacing: 0.04em; }
  #pg-stats b { color: #ffd24a; }
  .pg-btns { display: flex; gap: 14px; margin-top: 10px; }
  .pg-btns button { font-family: 'Bebas Neue', cursive; font-size: 1.2rem; letter-spacing: 0.1em; cursor: pointer; border-radius: 7px; padding: 9px 28px; }
  #pg-retry { color: #0a0510; background: #ff5a5f; border: none; box-shadow: 0 0 18px rgba(255,90,95,0.4); }
  #pg-select { color: #ff5a5f; background: transparent; border: 1.5px solid rgba(255,90,95,0.5); }
  /* short/landscape screens: keep it from overflowing */
  @media (max-height: 560px) {
    #select { justify-content: space-between; padding-top: clamp(50px, 8vh, 60px); }
    .carousel-wrap { min-height: 150px; }
    #select .sel-title { font-size: clamp(1.8rem, 6vw, 3rem); }
  }
</style>
</head>
<body>

<div id="top-bar">
  <a id="back-btn" href="/">&#9664; HUB</a>
  <h1>NEON RUNNER</h1>
  <div id="top-spacer">
    <button id="fs-btn" title="Fullscreen">
      <svg id="fs-enter" width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M5.828 10.172a.5.5 0 0 0-.707 0l-4.096 4.096V11.5a.5.5 0 0 0-1 0v3.975a.5.5 0 0 0 .5.5H4.5a.5.5 0 0 0 0-1H1.732l4.096-4.096a.5.5 0 0 0 0-.707zm4.344 0a.5.5 0 0 1 .707 0l4.096 4.096V11.5a.5.5 0 1 1 1 0v3.975a.5.5 0 0 1-.5.5H11.5a.5.5 0 0 1 0-1h2.768l-4.096-4.096a.5.5 0 0 1 0-.707zm0-4.344a.5.5 0 0 0 .707 0l4.096-4.096V4.5a.5.5 0 1 0 1 0V.525a.5.5 0 0 0-.5-.5H11.5a.5.5 0 0 0 0 1h2.768l-4.096 4.096a.5.5 0 0 0 0 .707zm-4.344 0a.5.5 0 0 1-.707 0L1.025 1.732V4.5a.5.5 0 0 1-1 0V.525a.5.5 0 0 1 .5-.5H4.5a.5.5 0 0 1 0 1H1.732l4.096 4.096a.5.5 0 0 1 0 .707z"/></svg>
      <svg id="fs-exit" width="14" height="14" viewBox="0 0 16 16" fill="currentColor" style="display:none"><path d="M5.5 0a.5.5 0 0 1 .5.5v4A1.5 1.5 0 0 1 4.5 6h-4a.5.5 0 0 1 0-1h4a.5.5 0 0 0 .5-.5v-4a.5.5 0 0 1 .5-.5zm5 0a.5.5 0 0 1 .5.5v4a.5.5 0 0 0 .5.5h4a.5.5 0 0 1 0 1h-4A1.5 1.5 0 0 1 10 4.5v-4a.5.5 0 0 1 .5-.5zM0 10.5a.5.5 0 0 1 .5-.5h4A1.5 1.5 0 0 1 6 11.5v4a.5.5 0 0 1-1 0v-4a.5.5 0 0 0-.5-.5h-4a.5.5 0 0 1-.5-.5zm10 1a1.5 1.5 0 0 1 1.5-1.5h4a.5.5 0 0 1 0 1h-4a.5.5 0 0 0-.5.5v4a.5.5 0 0 1-1 0v-4z"/></svg>
    </button>
  </div>
</div>
<canvas id="gameCanvas" width="800" height="450"></canvas>
<p id="hint">A / D or ← → walk · Space / ↑ / tap to jump (double-jump!) · stomp drones, dodge pits</p>

<div id="pad">
  <div class="side">
    <div class="ctl" id="ctl-left">&#9664;</div>
    <div class="ctl" id="ctl-right">&#9654;</div>
  </div>
  <div class="side">
    <div class="ctl" id="ctl-jump">JUMP</div>
  </div>
</div>

<div id="select">
  <div class="sel-head">
    <div class="sel-title">NEON RUNNER</div>
    <div class="sel-sub">Select Mode &mdash; &#8249; &#8250; browse</div>
  </div>
  <div class="carousel-wrap" id="carousel">
    <button class="car-arrow" id="car-left" aria-label="Previous">&#8249;</button>
    <div class="car-strip" id="car-strip"></div>
    <button class="car-arrow" id="car-right" aria-label="Next">&#8250;</button>
  </div>
  <div class="sel-danger-group">
    <div class="sel-sub">Danger &mdash; &#8593; &#8595; adjust</div>
    <div class="danger" id="danger"></div>
    <div id="danger-info"></div>
  </div>
  <button id="start-btn">START</button>
</div>

<div id="pg">
  <div class="pg-title" id="pg-title">WASTED</div>
  <div id="pg-stats"></div>
  <div class="pg-btns">
    <button id="pg-retry">RETRY</button>
    <button id="pg-select">SELECT</button>
  </div>
</div>

<script>
(() => {
  const cvs = document.getElementById('gameCanvas');
  const ctx = cvs.getContext('2d');
  const W = 800, H = 450;
  const DPR = window.devicePixelRatio || 1;
  cvs.width = W * DPR; cvs.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  function fit() {
    const isLandscape = window.innerWidth > window.innerHeight;
    const topBar = document.getElementById('top-bar');
    const hint   = document.getElementById('hint');
    const availW = window.innerWidth - 8;
    const availH = isLandscape
      ? window.innerHeight - 8
      : window.innerHeight - topBar.offsetHeight
                     - (hint ? hint.offsetHeight + 8 : 0)
                     - 118; /* leave room for touch pad */
    const s = Math.min(availW / W, Math.max(availH, 180) / H) * 0.98;
    cvs.style.width  = (W * s) + 'px';
    cvs.style.height = (H * s) + 'px';
  }
  fit(); window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', () => setTimeout(fit, 120));

  // ── Constants ───────────────────────────────────────────────────
  const GRAVITY   = 0.78;
  const JUMP_V    = -13.6;
  const DBL_V     = -12.2;
  const MAX_FALL  = 20;
  // Reachable jump band, derived from impulse + gravity: apex = v^2 / (2g)
  const JUMP_APEX = (JUMP_V * JUMP_V) / (2 * GRAVITY);   // ~118px on a single jump
  const COIN_PICK = 32;                 // forgiving pickup radius (px)
  const COIN_ON   = 22;                 // on-platform coin height above surface (grab while running)
  const COIN_ARC  = Math.min(96, JUMP_APEX - 24);  // arc peak above surface, inside a single jump
  const HW = 26, HH = 36;        // hero size
  const HERO_HOME = 190;         // hero's starting world x (also the 0-progress point)
  const WALL_X    = 12;          // left boundary — hero can't walk past the start
  const WALK_SPD  = 4.3;         // player walk speed (px/frame)
  const CAM_LEFT  = 250, CAM_RIGHT = 420;  // camera keeps hero within this on-screen band
  const COIN_VAL  = 25;
  const LEVELS_Y  = [372, 312, 256];  // platform surface heights
  const MAX_HP    = 3;           // default hero health pool (overridden per danger tier)
  const HEAL_STEP = 2500;        // base-score interval that regenerates one heart
  const INV_TIME  = 1.15;        // invulnerability window after a hit (seconds)

  // ── DANGER tiers (Brotato-style) — scale difficulty AND score reward ──
  // density=spawn prob mult · spd=enemy speed · aggro=detection range · proj=projectile speed
  // gapF=desired-gap widener (still clamped to a crossable jump) · hearts=starting HP · mult=score×
  const DANGERS = [
    { name: 'CALM',   density: 0.55, spd: 0.85, aggro: 0.80, proj: 0.85, gapF: 0.82, hearts: 4, mult: 1.0 },
    { name: 'NORMAL', density: 0.78, spd: 1.00, aggro: 1.00, proj: 1.00, gapF: 0.95, hearts: 3, mult: 1.4 },
    { name: 'HARD',   density: 0.98, spd: 1.12, aggro: 1.15, proj: 1.12, gapF: 1.05, hearts: 3, mult: 1.9 },
    { name: 'BRUTAL', density: 1.18, spd: 1.26, aggro: 1.32, proj: 1.26, gapF: 1.12, hearts: 2, mult: 2.6 },
    { name: 'SAVAGE', density: 1.38, spd: 1.42, aggro: 1.52, proj: 1.42, gapF: 1.20, hearts: 2, mult: 3.4 },
    { name: 'INSANE', density: 1.62, spd: 1.60, aggro: 1.75, proj: 1.60, gapF: 1.28, hearts: 1, mult: 4.4 },
  ];

  const DEFAULT_THEME = { top: '#0b0518', mid: '#12071f', bot: '#1a0a22', accent: '#ff5a5f' };

  // ── Finite, hand-tuned, DETERMINISTIC levels (fixed seed = fixed layout) ──
  const LEVELS = [
    { id: 'l1', name: 'NEON DISTRICT', desc: 'Rooftops · short',    seed: 1337, len: 3400, density: 0.32, coin: 0.80, gapProb: 0.58, types: ['drone'],
      theme: { top: '#0b0518', mid: '#12071f', bot: '#1a0a22', accent: '#ff5a5f' } },
    { id: 'l2', name: 'DATA HARBOR',   desc: 'Docks · +hoppers',    seed: 2749, len: 4400, density: 0.48, coin: 0.80, gapProb: 0.64, types: ['drone', 'hopper'],
      theme: { top: '#04121a', mid: '#062233', bot: '#083041', accent: '#12d0ff' } },
    { id: 'l3', name: 'VOLT FACTORY',  desc: 'Machines · +chasers', seed: 5501, len: 5200, density: 0.60, coin: 0.76, gapProb: 0.70, types: ['drone', 'hopper', 'chaser'],
      theme: { top: '#160a02', mid: '#2a1405', bot: '#3a1d06', accent: '#ffb03a' } },
    { id: 'l4', name: 'SKY SPIRES',    desc: 'Towers · +flyers',    seed: 8123, len: 6000, density: 0.64, coin: 0.72, gapProb: 0.74, types: ['drone', 'hopper', 'chaser', 'flyer'],
      theme: { top: '#0a0620', mid: '#160b3a', bot: '#221055', accent: '#b06bff' } },
    { id: 'l5', name: 'CORE MELTDOWN', desc: 'Reactor · all foes',  seed: 9091, len: 7000, density: 0.70, coin: 0.70, gapProb: 0.78, types: ['drone', 'hopper', 'chaser', 'flyer', 'turret'],

  ];

  // Carousel entries: ENDLESS first, then each designed level.
  const MODES = [{ id: 'endless', name: 'ENDLESS', desc: 'Procedural · no finish' }]
    .concat(LEVELS.map(l => ({ id: l.id, name: l.name, desc: l.desc })));

  // small deterministic PRNG for fixed level layouts
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;

    };
  }

  // ── Parallax neon skyline (multiple depth layers, tiled) ───────
  function makeSkyline(n, minH, maxH, wRange) {
    const arr = []; let x = 0;
    for (let i = 0; i < n; i++) {
      const w = wRange[0] + Math.random() * (wRange[1] - wRange[0]);
      const h = minH + Math.random() * (maxH - minH);
      arr.push({ x, w, h, seed: Math.random(),
        sign: Math.random() < 0.32,           // some buildings carry a neon sign
        signC: Math.random() < 0.5 ? '#12ffe8' : null,
        flick: 2 + Math.random() * 5 });       // per-building light flicker speed
      x += w + 6 + Math.random() * 26;
    }
    return { list: arr, span: x };
  }
  const SKY_FAR  = makeSkyline(24, 60, 170, [36, 84]);   // distant haze towers
  const SKY_MID  = makeSkyline(18, 90, 210, [48, 108]);  // mid buildings (NEW)
  const SKY_NEAR = makeSkyline(15, 120, 250, [62, 132]); // near skyline
  const SKY_FORE = makeSkyline(9, 150, 300, [96, 190]);  // foreground silhouettes (NEW)
  const STARS = Array.from({ length: 110 }, () => ({
    x: Math.random() * W, y: Math.random() * H * 0.62,
    r: Math.random() * 1.2 + 0.3, a: 0.2 + Math.random() * 0.7,
    p: 0.02 + Math.random() * 0.06, tw: Math.random() * 6.28,   // twinkle phase

  }));

    y: 70 + Math.random() * 210, r: 90 + Math.random() * 150,

  // precomputed static vignette + scanline overlay (drawn once per frame as a single image)

    o.fillStyle = vg; o.fillRect(0, 0, W, H);

    for (let y = 0; y < H; y += 3) o.fillRect(0, y, W, 1);   // faint scanlines

  })();

  // ── State ───────────────────────────────────────────────────────
  let hero, platforms, coins, enemies, particles, floats, shots;
  let scrollX, worldCursor, groundY, score, coinCount;
  let shake, flash, flashCol, maxProgress, bonusScore, nextHeal;
  let coinCombo = 0, coinComboT = 0;   // coin pickup streak → rising SFX pitch
  let lastLandSfx = 0;                  // throttle for the soft landing tick
  let state = 'select';
  let lastT = null;
  let best; try { best = +(localStorage.getItem('nr_best') || 0); } catch (e) { best = 0; }

  // mode / difficulty / level runtime
  let gameMode = 'endless';           // 'endless' or a level id
  let levelSpec = null;               // the LEVELS entry when in a level, else null
  let diff = DANGERS[1];              // active danger tier
  let dangerIdx = 1;
  let maxHp = MAX_HP;                  // starting hearts (from danger tier)
  let finite = false;                 // true for finite levels
  let finishX = Infinity;             // win trigger x (levels only)
  let finishFlag = null;              // { x, y } drawn goal
  let elapsed = 0;                    // level timer (seconds)
  let theme = DEFAULT_THEME;

  let rng = Math.random;              // Math.random for endless, seeded for levels
  let genPool = null;                 // enemy type pool (null => distance-based endless pool)
  let genDensityBase = 0.5;           // base spawn probability before danger scaling
  let genCoinProb = 0.7, genGapProb = 0.72;

  const held = { left: false, right: false };

  // ── Input ───────────────────────────────────────────────────────
  function doJump() {
    if (state !== 'playing') return;
    if (hero.jumps > 0) {
      const first = hero.jumps === hero.maxJumps;
      hero.vy = first ? JUMP_V : DBL_V;
      hero.jumps--;
      hero.onGround = false;
      jumpPuff();
      if (window.SFX) SFX.play('jump', { vol: 0.4, rate: first ? 1 : 1.25 });   // double-jump a touch higher
    }
  }

  window.addEventListener('keydown', e => {
    if (e.repeat) return;
    const k = e.key;
    if (state === 'select') {
      // carousel + danger navigation
      if (k === 'ArrowLeft'  || k === 'a' || k === 'A') { e.preventDefault(); cardStep(-1); }
      else if (k === 'ArrowRight' || k === 'd' || k === 'D') { e.preventDefault(); cardStep(1); }
      else if (k === 'ArrowUp'   || k === 'w' || k === 'W') { e.preventDefault(); dangerStep(1); }
      else if (k === 'ArrowDown' || k === 's' || k === 'S') { e.preventDefault(); dangerStep(-1); }
      else if (k === 'Enter' || k === ' ') { e.preventDefault(); doStart(); }

      if (k === 'r' || k === 'R' || k === 'Enter' || k === ' ') { e.preventDefault(); retry(); }
      else if (k === 'Escape' || k === 'Backspace') { e.preventDefault(); backToSelect(); }
      return;

    if (k === 'ArrowLeft' || k === 'a' || k === 'A') held.left = true;
    if (k === 'ArrowRight' || k === 'd' || k === 'D') held.right = true;

  // Canvas tap = jump (only during play; menus are DOM overlays)

  cvs.addEventListener('touchstart', e => { if (state === 'playing') { e.preventDefault(); doJump(); } }, { passive: false });

  // On-screen buttons
  function bindHold(id, on, off) {
    const el = document.getElementById(id);
    const press = e => { e.preventDefault(); el.classList.add('on'); on(); };
    const release = e => { if (e) e.preventDefault(); el.classList.remove('on'); off(); };
    el.addEventListener('touchstart', press, { passive: false });
    el.addEventListener('touchend', release, { passive: false });
    el.addEventListener('touchcancel', release, { passive: false });

    el.addEventListener('mouseup', release);

    el.addEventListener('touchstart', press, { passive: false });
    el.addEventListener('touchend', release, { passive: false });
    el.addEventListener('mousedown', press);
    el.addEventListener('mouseup', release);

  // ── World generation ────────────────────────────────────────────
  function placeCoinRow(x, y, count, arc) {
    for (let i = 0; i < count; i++) {
      const cx = x + i * 34;
      const cy = arc ? y - Math.sin((i + 0.5) / count * Math.PI) * COIN_ARC : y;
      coins.push({ x: cx, y: cy, taken: false, phase: Math.random() * Math.PI * 2 });
    }
  }

  // ── Jump-reach maths (single jump), used to keep pits crossable ──
  // Upward-positive frame model: v0 = |JUMP_V|, g = GRAVITY (per 60fps frame).
  // Air-time to descend back to a platform `rise` px HIGHER than takeoff (rise<0 = lower):
  function jumpAirTime(rise) {
    const v0 = -JUMP_V, g = GRAVITY;              // 13.6, 0.78
    const disc = v0 * v0 - 2 * g * rise;
    if (disc <= 0) return v0 / g;                 // rise ~ apex: only reaches at the very top
    return (v0 + Math.sqrt(disc)) / g;            // descending crossing, in frames
  }
  // Horizontal distance the hero covers in that air-time while holding a direction,
  // with a safety margin and a hard cap so gaps stay fair.
  function maxJumpGap(rise) {
    return Math.min(150, WALK_SPD * jumpAirTime(rise) * 0.82);
  }
  const JUMP_DX = WALK_SPD * jumpAirTime(0);       // ~150px same-level single-jump reach

  // Coin trail that HUGS the real jump path: takeoff at (nearEdge, nearY) → apex within
  // jump height → landing at (nearEdge+gap, farY). Only ever called for a crossable gap.
  function placeJumpArc(nearEdge, nearY, gap, farY) {
    const n = Math.max(2, Math.round(gap / 30));
    const peak = Math.min(COIN_ARC, JUMP_APEX - 10);   // stays inside reachable jump height
    const floorY = Math.min(nearY, farY) - COIN_ON;    // never below either platform surface
    for (let i = 0; i < n; i++) {
      const u = (i + 0.5) / n;                          // fraction across the gap
      const x = nearEdge + u * gap;
      const baseY = nearY + (farY - nearY) * u;         // baseline slides from near → far landing
      const cy = Math.min(baseY - COIN_ON - Math.sin(u * Math.PI) * peak, floorY);
      coins.push({ x, y: cy, taken: false, phase: Math.random() * Math.PI * 2 });
    }
  }

  function genPlatform() {
    // width of solid ground segment
    const w = 160 + rng() * 190;
    platforms.push({ x: worldCursor, w, y: groundY });

    // coins along the platform surface
    if (rng() < genCoinProb) {
      const n = 2 + Math.floor(rng() * 3);
      placeCoinRow(worldCursor + w * 0.3, groundY - COIN_ON, n, false);
    }
    // enemies — density scales with mode base × the chosen DANGER tier
    if (platforms.length > 3 && w > 190) {
      const D = worldCursor;                                   // distance proxy (endless pool)
      let spawnP = (genPool ? genDensityBase : Math.min(0.34 + D / 12000, 0.6)) * diff.density;
      spawnP = Math.min(spawnP, 0.9);
      if (rng() < spawnP) {
        addEnemy(pickEnemyType(D), worldCursor, w, groundY);
        // higher danger / wider platforms can hold a second foe
        if (w > 300 && rng() < 0.18 * diff.density) {
          addEnemy(pickEnemyType(D), worldCursor + w * 0.5, w * 0.5, groundY);
        }
      }
    }
    worldCursor += w;

    // decide a pit gap + possibly change elevation
    if (rng() < genGapProb) {
      // Choose the far-side elevation FIRST so we can guarantee the gap is jumpable.
      const r = rng();
      const farY = r < 0.55 ? LEVELS_Y[0] : r < 0.85 ? LEVELS_Y[1] : LEVELS_Y[2];
      const rise = groundY - farY;                 // +ve => far platform is higher (harder jump)
      // Danger widens the desired gap, but it is ALWAYS clamped to a crossable single jump.
      let gap = (70 + rng() * 80) * diff.gapF;
      gap = Math.max(48, Math.min(gap, maxJumpGap(rise)));
      const nearEdge = worldCursor;                // takeoff = near platform's right edge
      // A coin trail may go over the pit ONLY because the pit is now crossable AND the
      // next genPlatform() always builds a landing platform at farY on the far side.
      if (rng() < 0.62) placeJumpArc(nearEdge, groundY, gap, farY);
      worldCursor += gap;
      groundY = farY;                              // far platform (built next) sits at farY
    }
  }

  function ensureWorld() {
    if (finite) return;                            // finite levels are fully built up-front
    while (worldCursor < scrollX + W + 480) genPlatform();
    // No left-culling: the player can walk back, so the traversed terrain must persist.
  }

  // ── Enemies ─────────────────────────────────────────────────────
  // pool grows with distance so tougher foes appear further right
  function poolFor(D) {
    const pool = ['drone'];
    if (D > 1300) pool.push('hopper');
    if (D > 2800) pool.push('chaser');
    if (D > 4600) pool.push('flyer');
    if (D > 7000) pool.push('turret');
    return pool;
  }
  function pickEnemyType(D) {
    const pool = genPool || poolFor(D);   // fixed roster for levels, distance-based for endless
    return pool[(rng() * pool.length) | 0];
  }

  function addEnemy(type, px, pw, gy) {
    const min = px + 14, max = px + pw - 14;   // patrol/edge bounds — enemies stay on THIS platform
    const cxs = px + pw * 0.5;
    const dir = rng() < 0.5 ? -1 : 1;
    const e = {
      type, dead: false, gy, min, max, home: cxs,
      bob: Math.random() * Math.PI * 2, state: 'patrol', timer: 0, cool: 0,
      vx: 0, vy: 0, onGround: true, face: dir,
      w: 34, h: 30, x: cxs - 17, cy: gy - 15, feet: gy,
      stompable: true, reward: 60, tx: 0, ty: 0,
    };
    if (type === 'drone') {
      e.w = 34; e.h = 30; e.vx = dir * (0.7 + rng() * 0.8); e.reward = 60;
    } else if (type === 'hopper') {
      e.w = 30; e.h = 26; e.vx = dir * (0.5 + rng() * 0.5);
      e.timer = 0.6 + rng() * 0.8; e.reward = 80;
    } else if (type === 'chaser') {
      e.w = 32; e.h = 34; e.vx = dir * 0.75; e.reward = 120;
    } else if (type === 'flyer') {
      e.w = 38; e.h = 24; e.hoverY = gy - 118; e.cy = e.hoverY;
      e.vx = dir * 1.0; e.stompable = false; e.reward = 0; e.state = 'hover';
    } else if (type === 'turret') {
      e.w = 34; e.h = 28; e.vx = 0; e.cool = 1.0 + rng(); e.reward = 100;
    }
    e.x = cxs - e.w / 2;
    if (type !== 'flyer') e.cy = gy - e.h / 2;
    enemies.push(e);
  }

  function updateEnemy(e, dt) {
    const f = dt * 60;
    e.bob += dt * 6;
    const heroCx = hero.wx + HW / 2;
    const heroFeet = hero.y + HH;
    const eCx = e.x + e.w / 2;
    const dx = heroCx - eCx;                              // +ve => hero is to the right
    const sameLevel = Math.abs(heroFeet - e.gy) < 66;     // hero roughly on this enemy's level

    if (e.type === 'drone') {
      e.x += e.vx * f * diff.spd;
      if (e.x < e.min) { e.x = e.min; e.vx = Math.abs(e.vx); }
      if (e.x + e.w > e.max) { e.x = e.max - e.w; e.vx = -Math.abs(e.vx); }
      e.face = e.vx >= 0 ? 1 : -1;
      e.cy = e.gy - e.h / 2 + Math.sin(e.bob) * 3;

    } else if (e.type === 'hopper') {
      e.x += e.vx * f * diff.spd;
      if (e.x < e.min) { e.x = e.min; e.vx = Math.abs(e.vx); }
      if (e.x + e.w > e.max) { e.x = e.max - e.w; e.vx = -Math.abs(e.vx); }
      if (e.onGround) {
        e.timer -= dt;
        if (e.timer <= 0) { e.vy = -9.2; e.onGround = false; }
      } else {
        e.vy += GRAVITY * 0.85 * f;
        e.feet += e.vy * f;
        if (e.feet >= e.gy) { e.feet = e.gy; e.vy = 0; e.onGround = true; e.timer = 0.7 + Math.random() * 0.9; }
      }
      e.cy = e.feet - e.h / 2;

    } else if (e.type === 'chaser') {
      // state machine: patrol → alert(telegraph) → chase → return
      if (e.state === 'patrol') {
        e.x += e.vx * f * diff.spd;
        if (e.x < e.min) { e.x = e.min; e.vx = Math.abs(e.vx); }
        if (e.x + e.w > e.max) { e.x = e.max - e.w; e.vx = -Math.abs(e.vx); }
        if (sameLevel && Math.abs(dx) < 250 * diff.aggro) { e.state = 'alert'; e.timer = 0.45; }
      } else if (e.state === 'alert') {
        e.timer -= dt;                                    // wind-up: stand + flash
        if (e.timer <= 0) e.state = 'chase';
        if (!sameLevel || Math.abs(dx) > 360) e.state = 'return';
      } else if (e.state === 'chase') {
        e.x += Math.sign(dx) * 2.6 * diff.spd * f;        // pursue the hero (faster at higher danger)
        if (e.x < e.min) e.x = e.min;                     // STOP at ledge — never leave the platform
        if (e.x + e.w > e.max) e.x = e.max - e.w;
        e.vx = Math.sign(dx) || e.vx; e.face = e.vx >= 0 ? 1 : -1;
        if (!sameLevel || Math.abs(dx) > 380) e.state = 'return';
      } else if (e.state === 'return') {
        const dh = e.home - eCx;
        e.x += Math.sign(dh) * 1.1 * f; e.face = dh >= 0 ? 1 : -1;
        if (Math.abs(dh) < 6) { e.state = 'patrol'; e.vx = (e.face) * 0.75; }
        else if (sameLevel && Math.abs(dx) < 210 * diff.aggro) e.state = 'chase';
      }
      e.cy = e.gy - e.h / 2;

    } else if (e.type === 'flyer') {
      if (e.cool > 0) e.cool -= dt;
      if (e.state === 'hover') {
        e.x += e.vx * f * diff.spd;
        if (e.x < e.min - 40) { e.x = e.min - 40; e.vx = Math.abs(e.vx); }
        if (e.x + e.w > e.max + 40) { e.x = e.max + 40 - e.w; e.vx = -Math.abs(e.vx); }
        e.face = e.vx >= 0 ? 1 : -1;
        e.cy = e.hoverY + Math.sin(e.bob) * 5;
        if (e.cool <= 0 && Math.abs(dx) < 72 * diff.aggro && heroFeet > e.cy) {   // hero underneath → attack
          e.state = 'windup'; e.timer = 0.5;
          e.tx = heroCx; e.ty = Math.min(hero.y + HH / 2, e.gy - e.h / 2);
        }
      } else if (e.state === 'windup') {
        e.timer -= dt;                                    // telegraph the dive (rattle + flash)
        e.cy = e.hoverY + Math.sin(e.bob * 3) * 3;
        if (e.timer <= 0) e.state = 'dive';
      } else if (e.state === 'dive') {
        const dvx = e.tx - (e.x + e.w / 2);
        e.x += Math.sign(dvx) * Math.min(Math.abs(dvx), 6) * 0.6 * f;
        e.cy += 7 * f;
        if (e.cy >= e.ty) { e.cy = e.ty; e.state = 'recover'; }
      } else if (e.state === 'recover') {
        e.cy -= 3.4 * f;
        if (e.cy <= e.hoverY) { e.cy = e.hoverY; e.state = 'hover'; e.cool = 1.6 / diff.aggro; }
      }

    } else if (e.type === 'turret') {
      e.cy = e.gy - e.h / 2;
      e.face = dx >= 0 ? 1 : -1;
      if (e.cool > 0) e.cool -= dt;
      if (e.state === 'patrol') {
        if (sameLevel && Math.abs(dx) < 340 * diff.aggro && e.cool <= 0) { e.state = 'charge'; e.timer = 0.55; }
      } else if (e.state === 'charge') {
        e.timer -= dt;                                    // telegraph: muzzle charges
        if (e.timer <= 0) {
          shots.push({ x: e.x + e.w / 2 + e.face * e.w * 0.5, y: e.gy - 15,
                       vx: 3.4 * diff.proj * e.face, life: 3.2, dead: false });
          e.cool = (1.9 + Math.random() * 0.9) / diff.aggro; e.state = 'patrol';
        }
      }
    }
  }

  function stompEnemy(e) {
    e.dead = true;
    hero.vy = DBL_V * 0.86;
    hero.jumps = Math.max(hero.jumps, 1);
    bonusScore += e.reward;
    shake = Math.max(shake, 10);
    const sx = e.x + e.w / 2 - scrollX;
