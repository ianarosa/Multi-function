    floatText(sx, e.cy - e.h / 2, '+' + e.reward, '#ff5a5f');
    if (window.SFX) SFX.play('bounce', { vol: 0.5, rate: 1.05 });   // springy stomp pop
  }

  // ── Particles / floats ──────────────────────────────────────────
  function burst(x, y, col, n, spd) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = (spd || 90) * (0.4 + Math.random());
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 20,
        life: 0.5, maxLife: 0.5, col, sz: 1.6 + Math.random() * 2.4, grav: 220 });
    }
  }
  function jumpPuff() {
    for (let i = 0; i < 8; i++) {
      particles.push({ x: heroScreenX() + HW / 2, y: hero.y + HH,
        vx: (Math.random() - 0.5) * 70, vy: 30 + Math.random() * 55,
        life: 0.32, maxLife: 0.32, col: i < 3 ? '#12ffe8' : '#ffd0d2', sz: 1.4 + Math.random() * 2, grav: 45 });
    }
  }
  function landPuff() {
    for (let i = 0; i < 9; i++) {
      const side = i < 4 ? -1 : 1;
      particles.push({ x: heroScreenX() + HW / 2 + side * (2 + Math.random() * 10), y: hero.y + HH,
        vx: side * (40 + Math.random() * 80), vy: -(6 + Math.random() * 22),
        life: 0.3, maxLife: 0.3, col: '#ffd0d2', sz: 1.4 + Math.random() * 2.2, grav: 150 });
    }
  }
  function floatText(x, y, text, col) { floats.push({ x, y, text, col, life: 1.1 }); }

  function tickParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.vy += (p.grav || 0) * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }
    for (let i = floats.length - 1; i >= 0; i--) {
      floats[i].y -= 34 * dt; floats[i].life -= dt;
      if (floats[i].life <= 0) floats.splice(i, 1);
    }
  }

  function heroScreenX() { return hero.wx - scrollX; }

  // ── Start / init ────────────────────────────────────────────────
  function resetWorld() {
    platforms = []; coins = []; enemies = []; particles = []; floats = []; shots = [];
    scrollX = 0; worldCursor = 0; groundY = LEVELS_Y[0];
    platforms.push({ x: 0, w: 520, y: groundY });   // guaranteed safe start runway
    worldCursor = 520;
  }

  // ENDLESS: procedural, generated incrementally as the camera advances.
  function seedWorld() {
    finite = false; finishX = Infinity; finishFlag = null;
    rng = Math.random; genPool = null; genDensityBase = 0.5; genCoinProb = 0.7; genGapProb = 0.72;
    resetWorld();
    ensureWorld();
  }

  // LEVEL: fully built up-front from a fixed seed → identical layout every time, with a finish flag.
  function buildLevel(spec) {
    finite = true;
    rng = mulberry32(spec.seed);
    genPool = spec.types; genDensityBase = spec.density; genCoinProb = spec.coin; genGapProb = spec.gapProb;
    resetWorld();
    while (worldCursor < spec.len) genPlatform();
    // Solid, flat finishing platform + goal flag on the far side of the last stretch.
    const fx = worldCursor;
    platforms.push({ x: fx, w: 420, y: groundY, finish: true });
    finishFlag = { x: fx + 120, y: groundY };
    finishX = fx + 120;                              // reaching this x = LEVEL COMPLETE
  }

  function startGame(mode, dIdx) {
    gameMode = mode;
    dangerIdx = Math.max(0, Math.min(DANGERS.length - 1, dIdx));
    diff = DANGERS[dangerIdx];
    maxHp = diff.hearts;
    levelSpec = mode === 'endless' ? null : LEVELS.find(l => l.id === mode) || null;
    theme = levelSpec ? levelSpec.theme : DEFAULT_THEME;

    if (levelSpec) buildLevel(levelSpec); else seedWorld();

    score = 0; coinCount = 0; maxProgress = 0; bonusScore = 0; elapsed = 0;
    coinCombo = 0; coinComboT = 0;
    scrollX = 0;
    shake = 0; flash = 0; flashCol = '#ff5a5f'; nextHeal = HEAL_STEP;
    hero = {
      wx: HERO_HOME, y: LEVELS_Y[0] - HH, vy: 0,
      onGround: true, jumps: 2, maxJumps: 2, trail: [], run: 0, blink: 0,
      hp: maxHp, inv: 0, face: 1, moving: false, breathe: 0, squash: 0,
    };
    held.left = held.right = false;
    state = 'playing';
    if (window.SFX) SFX.play('start');
    lastT = performance.now();
    try { localStorage.setItem('nr_sel_mode', mode); localStorage.setItem('nr_sel_danger', String(dangerIdx)); } catch (e) {}
    syncUI();
  }

  // ── Update ──────────────────────────────────────────────────────
  // base score drives heal cadence; final score applies the danger multiplier
  function baseScore() { return Math.floor(maxProgress / 12) + coinCount * COIN_VAL + bonusScore; }
  function currentScore() { return Math.round(baseScore() * (diff ? diff.mult : 1)); }

  function hurt(e) {
    hero.hp--;
    hero.inv = INV_TIME;
    // knockback: small hop + shove back toward the left of the play band
    hero.vy = -7.5;
    hero.wx = Math.max(WALL_X, hero.wx - 48);   // knock back, but not past the start wall
    shake = Math.max(shake, 13);
    flash = Math.max(flash, 0.6); flashCol = '#ff2b30';
    burst(heroScreenX() + HW / 2, hero.y + HH / 2, '#ff5a5f', 14, 130);
    floatText(heroScreenX() + HW / 2, hero.y - 8, '-1', '#ff5a5f');
    if (window.SFX) SFX.play('hurt');
  }

  function die(cause) {
    if (state !== 'playing') return;
    const fin = currentScore();
    if (fin > best) { best = fin; try { localStorage.setItem('nr_best', best); } catch (e) {} }
    burst(heroScreenX() + HW / 2, hero.y + HH / 2, '#ff5a5f', 26, 150);
    burst(heroScreenX() + HW / 2, hero.y + HH / 2, '#fff', 14, 120);
    flash = 1; flashCol = '#ff2b30'; shake = 16;
    hero.dead = true;
    state = 'gameover';
    window.dispatchEvent(new CustomEvent('lbGameOver', { detail: { score: fin } }));
    if (window.SFX) {
      SFX.play('explode', { vol: 0.6 });                          // death impact
      setTimeout(() => { if (window.SFX) SFX.play('gameover'); }, 170);   // then the lose sting
    }
    showPostGame();
  }

  function levelComplete() {
    if (state !== 'playing') return;
    const fin = currentScore();
    if (fin > best) { best = fin; try { localStorage.setItem('nr_best', best); } catch (e) {} }
    // persist per-level best score + best (lowest) time
    if (levelSpec) {
      try {
        const bs = +(localStorage.getItem('nr_lb_' + levelSpec.id) || 0);
        if (fin > bs) localStorage.setItem('nr_lb_' + levelSpec.id, String(fin));
        const bt = +(localStorage.getItem('nr_lt_' + levelSpec.id) || 0);
        if (!bt || elapsed < bt) localStorage.setItem('nr_lt_' + levelSpec.id, elapsed.toFixed(2));
      } catch (e) {}
    }
    for (let i = 0; i < 3; i++) burst(heroScreenX() + HW / 2, hero.y + HH / 2, i ? '#ffd24a' : '#12ffe8', 22, 150);
    flash = 0.8; flashCol = '#12ffe8'; shake = 10;
    state = 'levelcomplete';
    window.dispatchEvent(new CustomEvent('lbGameOver', { detail: { score: fin } }));
    if (window.SFX) SFX.play('win');
    showPostGame();
  }

  function update(dt) {
    // decay visual effects always
    flash = Math.max(0, flash - dt * 2.4);
    shake = Math.max(0, shake - dt * 40);
    if (state !== 'playing') { tickParticles(dt); return; }

    // player-controlled horizontal movement (no auto-scroll)
    const prevWx = hero.wx;
    if (held.left)  { hero.wx -= WALK_SPD * dt * 60; hero.face = -1; }
    if (held.right) { hero.wx += WALK_SPD * dt * 60; hero.face =  1; }
    if (hero.wx < WALL_X) hero.wx = WALL_X;   // left boundary at the start
    // "moving" reflects real horizontal displacement + input (not a free-running timer),
    // so the walk cycle freezes when idle or shoved against the wall
    hero.moving = (held.left || held.right) && Math.abs(hero.wx - prevWx) > 0.05;

    elapsed += dt;   // level timer

    // furthest rightward progress drives score (standing still earns nothing)
    maxProgress = Math.max(maxProgress, hero.wx - HERO_HOME);
    score = currentScore();

    // reached the goal flag → LEVEL COMPLETE
    if (finite && hero.wx + HW / 2 >= finishX) { levelComplete(); return; }

    // camera follows the hero, keeping them inside a comfortable window; never past world start
    const heroSx = hero.wx - scrollX;
    if (heroSx > CAM_RIGHT) scrollX = hero.wx - CAM_RIGHT;
    if (heroSx < CAM_LEFT)  scrollX = hero.wx - CAM_LEFT;
    if (scrollX < 0) scrollX = 0;

    ensureWorld();

    // invulnerability window ticks down; regen a heart at score milestones
    if (hero.inv > 0) hero.inv = Math.max(0, hero.inv - dt);
    if (coinComboT > 0) { coinComboT -= dt; if (coinComboT <= 0) coinCombo = 0; }
    if (baseScore() >= nextHeal) {
      if (hero.hp < maxHp) {
        hero.hp++;
        floatText(heroScreenX() + HW / 2, hero.y - 12, '+1 HEART', '#ff8f92');
        if (window.SFX) SFX.play('powerup');
      }
      nextHeal += HEAL_STEP;
    }

    const sx = heroScreenX();

    // gravity
    hero.vy += GRAVITY * dt * 60;
    if (hero.vy > MAX_FALL) hero.vy = MAX_FALL;
    const prevBottom = hero.y + HH;
    hero.y += hero.vy * dt * 60;

    // platform collision — land when falling onto a platform under hero centre
    const cx = hero.wx + HW / 2;
    const wasGround = hero.onGround;
    hero.onGround = false;
    for (const p of platforms) {
      if (cx < p.x || cx > p.x + p.w) continue;
      if (hero.vy >= 0 && prevBottom <= p.y + 2 && hero.y + HH >= p.y) {
        if (!wasGround && hero.vy > 4) {
          hero.squash = Math.min(1, hero.vy / 15); landPuff();  // impact squash + dust
          const nowMs = performance.now();
          if (window.SFX && nowMs - lastLandSfx > 90) {         // throttle rapid re-lands
            lastLandSfx = nowMs;
            SFX.play('tick', { vol: 0.18 + Math.min(0.14, hero.vy / 90), rate: 0.9 });  // soft footfall
          }
        }
        hero.y = p.y - HH; hero.vy = 0; hero.onGround = true;
        hero.jumps = hero.maxJumps; break;
      }
    }
    hero.squash = Math.max(0, (hero.squash || 0) - dt * 4.5);   // squash relaxes over time

    // fell into a pit
    if (hero.y > H + 40) { die('pit'); return; }

    // walk-cycle advances only while actually walking on the ground;
    // idle/airborne freeze the stride. breathe is a slow always-on timer for the idle bob.
    if (hero.onGround && hero.moving) hero.run += dt * 14;
    hero.breathe += dt;
    hero.trail.push({ x: sx + HW / 2, y: hero.y + HH / 2 });
    if (hero.trail.length > 9) hero.trail.shift();

    // coins
    for (const c of coins) {
      if (c.taken) continue;
      c.phase += dt * 6;
      const dcx = c.x - (hero.wx + HW / 2), dcy = c.y - (hero.y + HH / 2);
      if (dcx * dcx + dcy * dcy < COIN_PICK * COIN_PICK) {
        c.taken = true; coinCount++;
        coinCombo = coinComboT > 0 ? coinCombo + 1 : 1; coinComboT = 1.1;
        burst(c.x - scrollX, c.y, '#ffd24a', 10, 90);
        floatText(c.x - scrollX, c.y - 8, '+' + COIN_VAL, '#ffd24a');
        if (window.SFX) SFX.play('coin', { combo: coinCombo });
      }
    }

    // enemies
    const hl = hero.wx, hr = hero.wx + HW, ht = hero.y, hb = hero.y + HH;
    for (const e of enemies) {
      if (e.dead) continue;
      updateEnemy(e, dt);
      const el = e.x, er = e.x + e.w, et = e.cy - e.h / 2, eb = e.cy + e.h / 2;
      if (hr > el && hl < er && hb > et && ht < eb) {
        if (e.stompable && hero.vy > 0 && prevBottom <= et + 12) {
          stompEnemy(e);                          // stomp: kills groundable enemy, no HP cost
        } else if (hero.inv <= 0) {
          hurt(e);                                // side/contact hit: 1 HP + invuln + knockback
          if (hero.hp <= 0) { die('enemy'); return; }
        }
      }
    }
    enemies = enemies.filter(e => !e.dead);

    // projectiles (turret shots) — low + slow, so they're jumpable
    for (const s of shots) {
      if (s.dead) continue;
      s.x += s.vx * dt * 60;
      s.life -= dt;
      if (s.life <= 0 || s.x < scrollX - 90 || s.x > scrollX + W + 90) { s.dead = true; continue; }
      if (hero.inv <= 0 && hr > s.x - 7 && hl < s.x + 7 && hb > s.y - 7 && ht < s.y + 7) {
        s.dead = true; hurt(s);
        if (hero.hp <= 0) { die('enemy'); return; }
      }
    }
    shots = shots.filter(s => !s.dead);

    tickParticles(dt);
  }

  // ── Draw helpers ────────────────────────────────────────────────
  function glow(col, blur) { ctx.shadowColor = col; ctx.shadowBlur = blur; }
  function noGlow() { ctx.shadowBlur = 0; }
  function hexA(hex, a) {
    const n = parseInt(hex.slice(1), 16);
    return 'rgba(' + (n >> 16 & 255) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',' + a + ')';
  }

  function drawFinish() {
    if (!finishFlag) return;
    const x = finishFlag.x - scrollX, gy = finishFlag.y;
    if (x < -80 || x > W + 80) return;
    const t = performance.now() / 1000;
    const H0 = 156;                                    // flag height

    // soft glowing portal beam behind the pole
    const beam = ctx.createLinearGradient(x, gy - H0, x, gy);
    beam.addColorStop(0, hexA('#12ffe8', 0.02));
    beam.addColorStop(1, hexA('#12ffe8', 0.16 + 0.05 * Math.sin(t * 3)));
    ctx.fillStyle = beam; ctx.fillRect(x - 16, gy - H0, 32, H0);

    // ground burst ring at the base
    glow('#12ffe8', 18); ctx.strokeStyle = hexA('#12ffe8', 0.5); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(x, gy - 1, 20, 5, 0, 0, Math.PI * 2); ctx.stroke(); noGlow();

    // glowing pole with a light bulb finial
    glow('#12ffe8', 10);
    ctx.fillStyle = '#eafffb'; ctx.fillRect(x - 2, gy - H0, 4, H0);
    ctx.beginPath(); ctx.arc(x, gy - H0, 5, 0, Math.PI * 2); ctx.fill();
    noGlow();

    // clean waving pennant (smooth triangle) with a checkered leading band
    ctx.save();
    glow('#12ffe8', 14);
    const wv = Math.sin(t * 3) * 5, wv2 = Math.sin(t * 3 + 1) * 5;
    const flagGrad = ctx.createLinearGradient(x, 0, x + 62, 0);
    flagGrad.addColorStop(0, '#12ffe8'); flagGrad.addColorStop(1, hexA('#12ffe8', 0.45));
    ctx.fillStyle = flagGrad;
    ctx.beginPath();
    ctx.moveTo(x + 2, gy - H0 + 4);
    ctx.quadraticCurveTo(x + 34, gy - H0 - 2 + wv, x + 62, gy - H0 + 16 + wv2);
    ctx.quadraticCurveTo(x + 34, gy - H0 + 26 + wv, x + 2, gy - H0 + 40);
    ctx.closePath(); ctx.fill();
    noGlow();
    // checkered leading band near the pole (clean 2 rows)
    ctx.fillStyle = 'rgba(6,26,26,0.85)';
    for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) {
      if ((r + c) % 2) continue;
      ctx.fillRect(x + 3 + c * 8, gy - H0 + 6 + r * 10 + wv * 0.3, 8, 10);
    }
    ctx.restore();

    // "FINISH" glow label
    glow('#12ffe8', 14); ctx.fillStyle = '#eafffb';
    ctx.font = 'bold 18px "Bebas Neue", cursive';
    ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    ctx.fillText('FINISH', x, gy - H0 - 12);
    noGlow();
  }

  function drawBg() {
    const now = performance.now() / 1000;

    // themed vertical sky (deep top → magenta mid → near-black bottom)
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, theme.top);
    g.addColorStop(0.5, theme.mid);
    g.addColorStop(1, theme.bot);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    // big soft accent halo high in the sky (atmosphere)
    const halo = ctx.createRadialGradient(W - 120, 96, 8, W - 120, 96, 280);
    halo.addColorStop(0, hexA(theme.accent, 0.32));
    halo.addColorStop(0.5, hexA(theme.accent, 0.1));
    halo.addColorStop(1, hexA(theme.accent, 0));
    ctx.fillStyle = halo; ctx.fillRect(0, 0, W, H * 0.85);

    // twinkling stars
    ctx.fillStyle = '#fff';
    for (const s of STARS) {
      const sx = ((s.x - scrollX * s.p) % W + W) % W;
      ctx.globalAlpha = s.a * (0.55 + 0.45 * Math.sin(now * s.tws + s.tw));
      ctx.fillRect(sx, s.y, s.r, s.r);
    }
    ctx.globalAlpha = 1;

    // neon moon/sun: glowing disc with bright core + ring
    const mx = W - 120, my = 96;
    glow(theme.accent, 46); ctx.fillStyle = hexA(theme.accent, 0.16);
    ctx.beginPath(); ctx.arc(mx, my, 50, 0, Math.PI * 2); ctx.fill(); noGlow();
    const md = ctx.createRadialGradient(mx - 10, my - 10, 4, mx, my, 46);
    md.addColorStop(0, '#fff'); md.addColorStop(0.5, hexA(theme.accent, 0.85)); md.addColorStop(1, hexA(theme.accent, 0.25));
    ctx.fillStyle = md; ctx.beginPath(); ctx.arc(mx, my, 44, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = hexA('#ffffff', 0.25); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(mx, my, 52, 0, Math.PI * 2); ctx.stroke();

    // drifting fog bands
    for (const f of FOG) {
      const fx = ((f.off - scrollX * 0.12 - now * f.spd) % (W + f.r * 2) + W + f.r * 2) % (W + f.r * 2) - f.r;
      const fg = ctx.createRadialGradient(fx, f.y, 0, fx, f.y, f.r);
      fg.addColorStop(0, hexA(theme.accent, f.a)); fg.addColorStop(1, hexA(theme.accent, 0));
      ctx.fillStyle = fg; ctx.beginPath(); ctx.ellipse(fx, f.y, f.r, f.r * 0.42, 0, 0, Math.PI * 2); ctx.fill();
    }

    // parallax skyline: far → mid → near (windows + signs), then dark foreground silhouettes
    drawSkyline(SKY_FAR, 0.14, '#160b26', 0.42, now);
    drawSkyline(SKY_MID, 0.28, '#1b0d2e', 0.62, now);
    drawSkyline(SKY_NEAR, 0.46, '#22103a', 0.85, now);

    // stronger horizon neon glow just above the play area
    const hg = ctx.createLinearGradient(0, H - 170, 0, H - 20);
    hg.addColorStop(0, hexA(theme.accent, 0)); hg.addColorStop(1, hexA(theme.accent, 0.2));
    ctx.fillStyle = hg; ctx.fillRect(0, H - 170, W, 150);

    drawForeground(SKY_FORE, 0.72);

    // ambient neon bounce along the very bottom (ground light)
    const amb = ctx.createLinearGradient(0, H - 46, 0, H);
    amb.addColorStop(0, hexA(theme.accent, 0)); amb.addColorStop(1, hexA(theme.accent, 0.16));
    ctx.fillStyle = amb; ctx.fillRect(0, H - 46, W, 46);
  }

  function drawSkyline(sky, par, body, alpha, now) {
    const off = (scrollX * par) % sky.span;
    const light = hexA(theme.accent, 0.55);
    const edge = hexA(theme.accent, 0.5);
    ctx.globalAlpha = alpha;
    for (let base = -sky.span; base < W + sky.span; base += sky.span) {
      for (const b of sky.list) {
        const x = base + b.x - off;
        if (x + b.w < -4 || x > W + 4) continue;
        const y = H - 88 - b.h;
        ctx.fillStyle = body;
        ctx.fillRect(x, y, b.w, b.h + 88);
        // neon roof edge
        ctx.fillStyle = edge;
        ctx.fillRect(x, y, b.w, 2);
        // window lights (some flicker off)
        ctx.fillStyle = light;
        const cols = Math.max(1, Math.floor(b.w / 14));
        const rows = Math.max(1, Math.floor(b.h / 20));
        for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
          if (((r * 7 + c * 3 + Math.floor(b.seed * 20)) % 5) !== 0) continue;
          if (Math.sin(now * b.flick + r * 2 + c) < -0.75) continue;   // occasional flicker-off
          ctx.fillRect(x + 5 + c * 14, y + 8 + r * 20, 4, 6);
        }
        // rooftop neon sign
        if (b.sign) {
          const sc = b.signC || theme.accent;
          const pulse = 0.5 + 0.5 * Math.sin(now * 3 + b.seed * 10);
          ctx.globalAlpha = alpha * (0.4 + 0.6 * pulse);
          glow(sc, 8); ctx.fillStyle = sc;
          ctx.fillRect(x + b.w * 0.5 - 5, y - 10, 3, 10);
          ctx.fillRect(x + b.w * 0.5 - 6, y - 12, 12, 3);
          noGlow(); ctx.globalAlpha = alpha;
        }
      }
    }
    ctx.globalAlpha = 1;
  }

  function drawForeground(sky, par) {
    const off = (scrollX * par) % sky.span;
    ctx.globalAlpha = 0.95;
    for (let base = -sky.span; base < W + sky.span; base += sky.span) {
      for (const b of sky.list) {
        const x = base + b.x - off;
        if (x + b.w < -4 || x > W + 4) continue;
        const y = H - 60 - b.h;
        // dark, but tinted with a vertical gradient (not a pure-black void)
        const bg = ctx.createLinearGradient(0, y, 0, H);
        bg.addColorStop(0, '#140a22'); bg.addColorStop(1, '#080411');
        ctx.fillStyle = bg; ctx.fillRect(x, y, b.w, b.h + 60);
        // glowing rim light along the top + near edge
        ctx.fillStyle = hexA(theme.accent, 0.5); ctx.fillRect(x, y, b.w, 1.6);
        ctx.fillStyle = hexA(theme.accent, 0.22); ctx.fillRect(x, y, 2, b.h + 60);
        // sparse dim windows
        ctx.fillStyle = hexA(theme.accent, 0.22);
        const cols = Math.max(1, Math.floor(b.w / 22));
        for (let r = 0; r < 5; r++) for (let c = 0; c < cols; c++) {
          if (((r * 3 + c * 5 + Math.floor(b.seed * 30)) % 6) !== 0) continue;
          ctx.fillRect(x + 6 + c * 22, y + 12 + r * 26, 4, 7);
        }
      }
    }
    ctx.globalAlpha = 1;
  }

  function drawPlatforms() {
    const now = performance.now() / 1000;
    for (const p of platforms) {
      const x = p.x - scrollX;
      if (x > W || x + p.w < 0) continue;
      const top = p.y, h = H - top;

      // body — lit vertical gradient face (never pure black)
      const bg = ctx.createLinearGradient(0, top, 0, H);
      bg.addColorStop(0, '#2a1a3e');
      bg.addColorStop(0.45, '#180d29');
      bg.addColorStop(1, '#0c0716');
      ctx.fillStyle = bg; ctx.fillRect(x, top, p.w, h);

      // structural panel lines
      ctx.strokeStyle = 'rgba(255,255,255,0.045)'; ctx.lineWidth = 1;
      for (let gx = x + 26; gx < x + p.w - 2; gx += 26) { ctx.beginPath(); ctx.moveTo(gx, top + 4); ctx.lineTo(gx, H); ctx.stroke(); }
      ctx.strokeStyle = hexA(theme.accent, 0.09);
      for (let gy = top + 22; gy < H; gy += 22) { ctx.beginPath(); ctx.moveTo(x, gy); ctx.lineTo(x + p.w, gy); ctx.stroke(); }

      // lit / flickering windows down the face
      const cols = Math.max(1, Math.floor(p.w / 22)), cellW = p.w / cols;
      for (let r = 0; top + 14 + r * 20 < H - 6; r++) {
        for (let c = 0; c < cols; c++) {
          if ((r * 5 + c * 3 + Math.floor(p.x * 0.5)) % 7 > 3) continue;
          if (Math.sin(now * (2 + (c % 3)) + r * 1.7 + c + p.x) < -0.72) continue;
          ctx.fillStyle = hexA(((r + c) % 5 === 0) ? '#12ffe8' : theme.accent, 0.62);
          ctx.fillRect(x + c * cellW + cellW * 0.28, top + 14 + r * 20, Math.max(3, cellW * 0.42), 8);
        }
      }

      // side neon edge outlines (coral near, cyan far)
      ctx.fillStyle = hexA(theme.accent, 0.3); ctx.fillRect(x, top, 1.6, h);
      ctx.fillStyle = hexA('#12ffe8', 0.16); ctx.fillRect(x + p.w - 1.6, top, 1.6, h);

      // light spill under the lit cap
      const rg = ctx.createLinearGradient(0, top, 0, top + 44);
      rg.addColorStop(0, hexA(theme.accent, 0.3)); rg.addColorStop(1, hexA(theme.accent, 0));
      ctx.fillStyle = rg; ctx.fillRect(x, top, p.w, 44);

      // bright standable neon CAP (clearly reads as a platform)
      glow(theme.accent, 20);
      ctx.fillStyle = theme.accent; ctx.fillRect(x, top - 3, p.w, 6);
      noGlow();
      ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.fillRect(x, top - 3, p.w, 1.8);
      // lit end-caps
      ctx.fillStyle = hexA('#12ffe8', 0.9);
      ctx.fillRect(x, top - 5, 4, 8); ctx.fillRect(x + p.w - 4, top - 5, 4, 8);
    }
    // left boundary wall at world x=0 (glowing barrier the hero can't pass)
    const wx = -scrollX;
    if (wx > -10 && wx < W) {
      glow('#ff5a5f', 14);
      ctx.fillStyle = 'rgba(255,90,95,0.55)';
      ctx.fillRect(wx - 5, 0, 5, H);
      noGlow();
      ctx.fillStyle = 'rgba(255,90,95,0.12)';
      ctx.fillRect(wx - 5, 0, 22, H);
    }
  }

  function drawCoins() {
    for (const c of coins) {
      if (c.taken) continue;
      const x = c.x - scrollX;
      if (x < -20 || x > W + 20) continue;
      const wob = Math.abs(Math.cos(c.phase)) * 0.85 + 0.15;
      glow('#ffd24a', 12);
      ctx.fillStyle = '#ffd24a';
      ctx.beginPath();
      ctx.ellipse(x, c.y + Math.sin(c.phase * 0.6) * 3, 8 * wob, 8, 0, 0, Math.PI * 2);
      ctx.fill();
      noGlow();
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      ctx.beginPath();
      ctx.ellipse(x, c.y + Math.sin(c.phase * 0.6) * 3, 3 * wob, 3, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawEnemies() {
    for (const e of enemies) {
      const x = e.x - scrollX;
      if (x < -60 || x > W + 60) continue;
      const cx = x + e.w / 2, cy = e.cy;
      const alerted = e.state === 'alert' || e.state === 'chase' ||
                      e.state === 'charge' || e.state === 'windup' || e.state === 'dive';
      if (e.type === 'drone')       drawDrone(cx, cy, e);
      else if (e.type === 'hopper') drawHopper(cx, cy, e);
      else if (e.type === 'chaser') drawChaser(cx, cy, e, alerted);
      else if (e.type === 'flyer')  drawFlyer(cx, cy, e, alerted);
      else if (e.type === 'turret') drawTurret(cx, cy, e, alerted);
    }
  }

  function drawDrone(cx, cy, e) {
    const hw = e.w / 2, hh = e.h / 2;
    glow('#ff3b6b', 14);
    ctx.fillStyle = '#2a0d1a';
    ctx.beginPath();
    ctx.moveTo(cx, cy - hh); ctx.lineTo(cx + hw, cy); ctx.lineTo(cx, cy + hh); ctx.lineTo(cx - hw, cy);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ff3b6b';
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath();
      ctx.moveTo(cx + i * 9 - 3, cy - hh + 4);
      ctx.lineTo(cx + i * 9, cy - hh - 5);
      ctx.lineTo(cx + i * 9 + 3, cy - hh + 4);
      ctx.closePath(); ctx.fill();
    }
    noGlow();
    const look = e.face > 0 ? 3 : -3;
    ctx.fillStyle = '#ffd24a';
    ctx.beginPath(); ctx.arc(cx + look, cy, 4.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#1a0510';
    ctx.beginPath(); ctx.arc(cx + look * 1.4, cy, 2, 0, Math.PI * 2); ctx.fill();
  }

  function drawHopper(cx, cy, e) {
    const hw = e.w / 2;
    const stretch = e.onGround ? 1 : 1.16;          // stretch upward mid-hop
    const hh = (e.h / 2) * stretch;
    glow('#ff7a6f', 12);
    ctx.fillStyle = '#3a1512';
    roundRect(cx - hw, cy - hh, e.w, hh * 2, 11); ctx.fill();
    noGlow();
    ctx.fillStyle = '#ff7a6f';
    roundRect(cx - hw + 3, cy - hh + 3, e.w - 6, hh * 2 - 6, 8); ctx.fill();
    // eyes look toward travel
    ctx.fillStyle = '#1a0510';
    const lx = e.vx >= 0 ? 1.5 : -1.5;
    ctx.beginPath(); ctx.arc(cx - 5 + lx, cy - 2, 2.6, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + 5 + lx, cy - 2, 2.6, 0, Math.PI * 2); ctx.fill();
    // little feet
    ctx.fillStyle = '#ff7a6f';
    ctx.fillRect(cx - 8, cy + hh - 2, 5, 3); ctx.fillRect(cx + 3, cy + hh - 2, 5, 3);
  }

  function drawChaser(cx, cy, e, alerted) {
    const hw = e.w / 2, hh = e.h / 2;
    const flick = e.state === 'alert' && (Math.floor(e.timer * 20) % 2 === 0);
    const eyeCol = alerted ? '#ff2b30' : '#12ffe8';
    // legs (stride faster when chasing)
    glow(alerted ? '#ff2b30' : '#ff5a5f', 8);
    ctx.strokeStyle = '#ff8f92'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    const stride = Math.sin(e.bob * (alerted ? 2.6 : 1.1)) * 5;
    ctx.beginPath(); ctx.moveTo(cx - 5, cy + hh - 8); ctx.lineTo(cx - 5 - stride, cy + hh); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx + 5, cy + hh - 8); ctx.lineTo(cx + 5 + stride, cy + hh); ctx.stroke();
    noGlow();
    // torso
    glow(alerted ? '#ff2b30' : '#ff5a5f', alerted ? 18 : 9);
    ctx.fillStyle = '#241019';
    roundRect(cx - hw, cy - hh, e.w, e.h - 6, 5); ctx.fill();
    noGlow();
    ctx.strokeStyle = alerted ? '#ff2b30' : 'rgba(255,90,95,0.6)';
    ctx.lineWidth = 1.6; ctx.strokeRect(cx - hw + 2, cy - hh + 2, e.w - 4, e.h - 10);
    // scanning visor eye
    if (!flick) {
      glow(eyeCol, 12); ctx.fillStyle = eyeCol;
      const look = (e.face || 1) * 4;
      roundRect(cx - 6 + look, cy - hh + 7, 12, 5, 2); ctx.fill(); noGlow();
    }
    // antenna beacon
    ctx.strokeStyle = alerted ? '#ff2b30' : '#ff8f92'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(cx, cy - hh); ctx.lineTo(cx, cy - hh - 6); ctx.stroke();
    ctx.fillStyle = alerted ? '#ff2b30' : '#ffd24a';
    ctx.beginPath(); ctx.arc(cx, cy - hh - 7, 2, 0, Math.PI * 2); ctx.fill();
  }

  function drawFlyer(cx, cy, e, alerted) {
    const hw = e.w / 2, hh = e.h / 2;
    const attack = e.state === 'windup' || e.state === 'dive';
    const glowC = attack ? '#ff2b30' : '#ff3b6b';
    // dive streak
    if (e.state === 'dive') {
      ctx.globalAlpha = 0.5; glow('#ff2b30', 16);
      ctx.strokeStyle = '#ff2b30'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(cx, cy - 22); ctx.lineTo(cx, cy); ctx.stroke();
      noGlow(); ctx.globalAlpha = 1;
    }
    // winged body
    glow(glowC, e.state === 'windup' ? 20 : 12);
    ctx.fillStyle = '#2a0d1a';
    ctx.beginPath();
    ctx.moveTo(cx - hw, cy);
    ctx.lineTo(cx - hw * 0.3, cy - hh * 0.7);
    ctx.lineTo(cx + hw * 0.3, cy - hh * 0.7);
    ctx.lineTo(cx + hw, cy);
    ctx.lineTo(cx + hw * 0.3, cy + hh * 0.5);
    ctx.lineTo(cx - hw * 0.3, cy + hh * 0.5);
    ctx.closePath(); ctx.fill();
    noGlow();
    // spiked underside — signals "don't stomp me"
    ctx.fillStyle = glowC;
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath();
      ctx.moveTo(cx + i * 7 - 3, cy + hh * 0.5 - 2);
      ctx.lineTo(cx + i * 7, cy + hh * 0.5 + 7);
      ctx.lineTo(cx + i * 7 + 3, cy + hh * 0.5 - 2);
      ctx.closePath(); ctx.fill();
    }
    // core eye (blinks during wind-up)
    const eyeC = e.state === 'windup' ? ((Math.floor(e.timer * 24) % 2) ? '#ff2b30' : '#ffd24a') : glowC;
    glow(eyeC, 10); ctx.fillStyle = eyeC;
    ctx.beginPath(); ctx.arc(cx, cy - 1, 4, 0, Math.PI * 2); ctx.fill(); noGlow();
  }

  function drawTurret(cx, cy, e, alerted) {
    const hw = e.w / 2, hh = e.h / 2;
    const charging = e.state === 'charge';
    // base
    glow('#ff5a5f', charging ? 16 : 7);
    ctx.fillStyle = '#241019';
    ctx.beginPath();
    ctx.moveTo(cx - hw, cy + hh); ctx.lineTo(cx - hw * 0.6, cy - hh * 0.2);
    ctx.lineTo(cx + hw * 0.6, cy - hh * 0.2); ctx.lineTo(cx + hw, cy + hh);
    ctx.closePath(); ctx.fill();
    noGlow();
    ctx.strokeStyle = 'rgba(255,90,95,0.6)'; ctx.lineWidth = 1.5; ctx.stroke();
    // dome
    ctx.fillStyle = '#3a1620';
    ctx.beginPath(); ctx.arc(cx, cy - hh * 0.2, hw * 0.55, Math.PI, 0); ctx.fill();
    // barrel aims at hero
    const fc = e.face || 1;
    ctx.save(); ctx.translate(cx, cy - hh * 0.25);
    glow(charging ? '#ff2b30' : '#ff5a5f', charging ? 18 : 6);
    ctx.fillStyle = charging ? '#ff2b30' : '#ff8f92';
    ctx.fillRect(fc > 0 ? 2 : -20, -3, 18, 6);
    if (charging) { ctx.fillStyle = '#ffd24a'; ctx.beginPath(); ctx.arc(fc * 20, 0, 3.5, 0, Math.PI * 2); ctx.fill(); }
    noGlow(); ctx.restore();
  }

  function drawShots() {
    for (const s of shots) {
      const x = s.x - scrollX;
      if (x < -20 || x > W + 20) continue;
      ctx.globalAlpha = 0.3; ctx.fillStyle = '#ff5a5f';
      ctx.beginPath(); ctx.ellipse(x - Math.sign(s.vx) * 9, s.y, 5, 3, 0, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
      glow('#ff2b30', 12); ctx.fillStyle = '#ff5a5f';
      ctx.beginPath(); ctx.ellipse(x, s.y, 7, 4, 0, 0, Math.PI * 2); ctx.fill();
      noGlow();
      ctx.fillStyle = '#ffd24a';
      ctx.beginPath(); ctx.arc(x, s.y, 2.2, 0, Math.PI * 2); ctx.fill();
    }
  }

  // draw a 2-segment limb (upper + lower) with rounded joints
  function limb(x0, y0, x1, y1, x2, y2, wUp, wLo, col, gl) {
    glow(col, gl); ctx.strokeStyle = col; ctx.lineCap = 'round';
    ctx.lineWidth = wUp; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
    ctx.lineWidth = wLo; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    noGlow();
  }

  function drawHero() {
    const x = heroScreenX(), y = hero.y;
    const cx = x + HW / 2;

    // blink while invulnerable after a hit
    if (hero.inv > 0 && Math.floor(hero.inv * 18) % 2 === 0) return;

    // ── energy ghost trail ──
    for (let i = 0; i < hero.trail.length; i++) {
      const fr = i / hero.trail.length;
      ctx.globalAlpha = fr * 0.22;
      glow('#ff5a5f', 10); ctx.fillStyle = '#ff5a5f';
      ctx.beginPath(); ctx.arc(hero.trail[i].x, hero.trail[i].y, 9 * fr, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1; noGlow();

    // contact shadow on the ground (fades with height)
    if (hero.y + HH < H) {
      ctx.globalAlpha = hero.onGround ? 0.3 : 0.14;
      ctx.fillStyle = '#050208';
      ctx.beginPath(); ctx.ellipse(cx, y + HH + 1, HW * 0.72, 4.5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }

    const now = performance.now() / 1000;
    const air = !hero.onGround;
    const running = hero.onGround && hero.moving;
    const rising = hero.vy < -1;
    const p = hero.run;
    const s = Math.sin(p), foot = HH / 2 - 1;       // ~17
    const legCol = '#ff8f92', armCol = '#ff7a80', bodyCol = '#ff5a5f';

    ctx.save();
    const idleBob = (hero.onGround && !hero.moving) ? Math.sin(hero.breathe * 2.2) * 0.8 : 0;
    const PRES = 1.16;                                 // visual presence scale — collision box (HW/HH) unchanged
    ctx.translate(cx, y + HH - (HH / 2) * PRES + idleBob);   // anchor at the feet so they stay on the platform
    const f = hero.face < 0 ? -1 : 1;
    ctx.scale(f * PRES, PRES);                         // +x is now "forward"
    // squash/stretch: squash on landing, stretch while falling fast
    const stretch = air ? Math.max(-0.05, Math.min(0.12, hero.vy * 0.011)) : 0;
    ctx.scale(1 + hero.squash * 0.22 - stretch * 0.5, 1 - hero.squash * 0.22 + stretch);
    // lean forward when running, plus air tilt
    const tilt = (running ? 0.14 : 0) + Math.max(-0.24, Math.min(0.24, hero.vy * 0.016));
    ctx.rotate(tilt);

    // ── trailing energy scarf (behind, waves with motion) ──
    ctx.strokeStyle = hexA('#12ffe8', 0.85); ctx.lineCap = 'round'; ctx.lineWidth = 3;
    glow('#12ffe8', 8); ctx.beginPath(); ctx.moveTo(-3, -HH / 2 + 9);
    for (let i = 1; i <= 4; i++) {
      const xx = -3 - i * 5;
      const yy = -HH / 2 + 9 + Math.sin(now * 6 + i * 0.9 + p) * 3 + (air ? -i * 1.6 : i * 0.4);
      ctx.lineTo(xx, yy);
    }
    ctx.stroke(); noGlow();

    // ── legs (behind body drawn first) ──
    if (air) {
      const tuck = rising ? 1 : 0;
      limb(-3, 5, -5, 11 - 3 * tuck, -7, 16 - 7 * tuck, 5, 4, legCol, 6);        // back leg
      limb(3, 5, 7, 10 - tuck, 10, 15 - 5 * tuck, 5, 4, legCol, 6);              // front leg (raised)
    } else if (running) {
      limb(-2, 5, -2 - s * 7, 11, -2 - s * 12, foot, 5, 4, legCol, 6);
      limb(2, 5, 2 + s * 7, 11, 2 + s * 12, foot, 5, 4, legCol, 6);
    } else {
      limb(-2, 5, -3, 11, -3, foot, 5, 4, legCol, 5);
      limb(2, 5, 3, 11, 3, foot, 5, 4, legCol, 5);
    }

    // ── back arm ──
    if (air) limb(-2, -HH / 2 + 12, -7, rising ? -HH / 2 + 5 : 0, -11, rising ? -HH / 2 - 2 : 6, 4, 3, armCol, 5);
    else if (running) limb(-2, -HH / 2 + 12, -6 + s * 6, -2, -9 + s * 9, 2, 4, 3, armCol, 5);
    else limb(-2, -HH / 2 + 12, -6, -1, -7, 6 + idleBob * 0.5, 4, 3, armCol, 4);

    // ── torso (glowing coral, tapered) ──
    glow(bodyCol, 18); ctx.fillStyle = bodyCol;
    ctx.beginPath();
    ctx.moveTo(-7, -HH / 2 + 8); ctx.lineTo(7, -HH / 2 + 8);
    ctx.quadraticCurveTo(9, -HH / 2 + 14, 6, 6);
    ctx.lineTo(-6, 6); ctx.quadraticCurveTo(-9, -HH / 2 + 14, -7, -HH / 2 + 8);
    ctx.closePath(); ctx.fill(); noGlow();
    // chest core light
    ctx.fillStyle = '#ffb9bb'; roundRect(-4, -HH / 2 + 12, 8, 10, 3); ctx.fill();
    glow('#12ffe8', 8); ctx.fillStyle = '#8ffff4';
    ctx.beginPath(); ctx.arc(0, -HH / 2 + 15, 2, 0, Math.PI * 2); ctx.fill(); noGlow();

    // ── head + cyan visor ──
    glow(bodyCol, 12); ctx.fillStyle = '#ffd0d2';
    ctx.beginPath(); ctx.arc(1.5, -HH / 2 + 1, 7.5, 0, Math.PI * 2); ctx.fill(); noGlow();
    // helmet crest
    ctx.fillStyle = bodyCol;
    ctx.beginPath(); ctx.arc(1.5, -HH / 2 + 1, 7.5, Math.PI * 1.15, Math.PI * 2.05); ctx.fill();
    // visor
    glow('#12ffe8', 10); ctx.fillStyle = '#12ffe8';
    roundRect(3, -HH / 2 - 2, 8, 4.5, 2); ctx.fill(); noGlow();
    ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.fillRect(8, -HH / 2 - 1.5, 2, 1.5);

    // ── front arm (over torso) ──
    if (air) limb(2, -HH / 2 + 12, 8, rising ? -HH / 2 + 4 : 4, 12, rising ? -HH / 2 - 3 : 10, 4, 3, armCol, 5);
    else if (running) limb(2, -HH / 2 + 12, 6 - s * 6, -2, 9 - s * 9, 2, 4, 3, armCol, 5);
    else limb(2, -HH / 2 + 12, 6, -1, 7, 6 - idleBob * 0.5, 4, 3, armCol, 4);

    ctx.restore();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function heartPath(cx, cy, s) {
    const r = s * 0.5;
    ctx.beginPath();
    ctx.moveTo(cx, cy + r * 0.95);              // bottom tip
    ctx.lineTo(cx - r, cy - r * 0.1);           // left shoulder
    ctx.lineTo(cx + r, cy - r * 0.1);           // right shoulder
    ctx.closePath();
    ctx.moveTo(cx - r * 0.5, cy - r * 0.1);
    ctx.arc(cx - r * 0.5, cy - r * 0.32, r * 0.55, 0, Math.PI * 2);  // left lobe
    ctx.moveTo(cx + r * 0.5, cy - r * 0.1);
    ctx.arc(cx + r * 0.5, cy - r * 0.32, r * 0.55, 0, Math.PI * 2);  // right lobe
  }

  function drawHeart(cx, cy, s, filled) {
    heartPath(cx, cy, s);
    if (filled) {
      glow('#ff5a5f', 10); ctx.fillStyle = '#ff5a5f'; ctx.fill(); noGlow();
    } else {
      ctx.fillStyle = 'rgba(255,90,95,0.14)'; ctx.fill();
      ctx.strokeStyle = 'rgba(255,90,95,0.55)'; ctx.lineWidth = 1.3; ctx.stroke();
    }
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
      glow(p.col, 6); ctx.fillStyle = p.col;
      ctx.fillRect(p.x - p.sz / 2, p.y - p.sz / 2, p.sz, p.sz);
    }
    ctx.globalAlpha = 1; noGlow();
    for (const f of floats) {
      ctx.globalAlpha = Math.min(1, f.life * 1.4);
      glow(f.col, 12); ctx.fillStyle = f.col;
      ctx.font = 'bold 22px "Bebas Neue", cursive';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(f.text, f.x, f.y);
      noGlow();
    }
    ctx.globalAlpha = 1;
  }

  function fmtTime(s) {
    if (s < 60) return s.toFixed(1) + 's';
    const m = Math.floor(s / 60); return m + ':' + (s - m * 60).toFixed(1).padStart(4, '0');
  }

  function drawHUD() {
    // ── Health hearts — top-left ──
    for (let i = 0; i < maxHp; i++) drawHeart(24 + i * 22, 18, 15, i < hero.hp);

    // Score (below hearts)
    glow(theme.accent, 12); ctx.fillStyle = theme.accent;
    ctx.font = 'bold 32px "Bebas Neue", cursive';
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText(score.toLocaleString(), 16, 32);
    noGlow();

    // coins tally (below score)
    ctx.fillStyle = '#ffd24a'; glow('#ffd24a', 8);
    ctx.beginPath(); ctx.arc(23, 82, 6, 0, Math.PI * 2); ctx.fill(); noGlow();
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.font = 'bold 16px "Bebas Neue", cursive';
    ctx.fillText('x ' + coinCount, 34, 73);

    // mode + danger tier (top centre)
    ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.font = '11px Barlow';
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillText((levelSpec ? levelSpec.name : 'ENDLESS') + '   ·   DANGER ' + dangerIdx +
                 ' ' + diff.name + '   ·   x' + diff.mult.toFixed(1), W / 2, 10);

    // top-right: level timer + finish progress, or endless best + distance
    ctx.textAlign = 'right';
    if (finite) {
      glow('#12ffe8', 6); ctx.fillStyle = '#bff8f2';
      ctx.font = 'bold 18px "Bebas Neue", cursive';
      ctx.fillText(fmtTime(elapsed), W - 16, 24); noGlow();
      const prog = Math.max(0, Math.min(1, (hero.wx - HERO_HOME) / (finishX - HERO_HOME)));
      const bw = 130, bx = W - 16 - bw, by = 46;
      ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fillRect(bx, by, bw, 4);
      glow('#12ffe8', 5); ctx.fillStyle = '#12ffe8'; ctx.fillRect(bx, by, bw * prog, 4); noGlow();
    } else {
      ctx.fillStyle = 'rgba(255,255,255,0.28)'; ctx.font = '11px Barlow';
      ctx.fillText('BEST  ' + best.toLocaleString(), W - 16, 24);
      glow('#ff8f92', 8); ctx.fillStyle = '#ff8f92';
      ctx.font = 'bold 18px "Bebas Neue", cursive';
      ctx.fillText(Math.floor(maxProgress / 40) + ' M', W - 16, 38); noGlow();
    }
  }

  // ── Render frame ────────────────────────────────────────────────
  function draw() {
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

    drawBg();
    if (state !== 'select') {
      drawPlatforms();
      drawCoins();
      drawFinish();
      drawEnemies();
      drawShots();
      drawParticles();
      if (state === 'playing') drawHero();
    }

    if (flash > 0) {
      ctx.globalAlpha = flash * 0.4; ctx.fillStyle = flashCol;
      ctx.fillRect(-20, -20, W + 40, H + 40); ctx.globalAlpha = 1;
    }
    ctx.restore();

    // static vignette + scanline overlay (one cheap drawImage)
    ctx.drawImage(overlay, 0, 0);

    if (state === 'playing' || state === 'gameover' || state === 'levelcomplete') drawHUD();
  }

  // ── Safe pre-init so nothing is undefined before first game ──────
  theme = DEFAULT_THEME; diff = DANGERS[1]; dangerIdx = 1; maxHp = MAX_HP;
  finite = false; finishX = Infinity; finishFlag = null;
  resetWorld();
  hero = { wx: HERO_HOME, y: LEVELS_Y[0] - HH, vy: 0, onGround: true,
           jumps: 2, maxJumps: 2, trail: [], run: 0, hp: MAX_HP, inv: 0, face: 1,
           moving: false, breathe: 0, squash: 0 };
  score = 0; coinCount = 0; maxProgress = 0; bonusScore = 0; elapsed = 0;
  shake = 0; flash = 0; flashCol = '#ff5a5f'; nextHeal = HEAL_STEP;

  // ── Loop ────────────────────────────────────────────────────────
  function loop(t) {
    if (!lastT) lastT = t;
    const dt = Math.min((t - lastT) / 1000, 1 / 30);
    lastT = t;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // ── Select screen + post-game (DOM overlays) ─────────────────────
  let selCard = 0, selDanger = 1;
  try { const m = localStorage.getItem('nr_sel_mode'); const idx = MODES.findIndex(x => x.id === m); if (idx >= 0) selCard = idx; } catch (e) {}
  try { const d = +(localStorage.getItem('nr_sel_danger')); if (d >= 0 && d < DANGERS.length) selDanger = d; } catch (e) {}
  let stripEl = null, cardEls = [];

  function bestLabel(m) {
    try {
      if (m.id === 'endless') { const b = +(localStorage.getItem('nr_best') || 0); return b ? ('BEST ' + b.toLocaleString()) : 'NO SCORE YET'; }
      const s = +(localStorage.getItem('nr_lb_' + m.id) || 0), t = +(localStorage.getItem('nr_lt_' + m.id) || 0);
      return s ? ('BEST ' + s.toLocaleString() + (t ? ('  ·  ' + fmtTime(t)) : '')) : 'NOT CLEARED';
    } catch (e) { return ''; }
  }

  function buildSelectUI() {
    stripEl = document.getElementById('car-strip');
    stripEl.innerHTML = MODES.map((m, i) =>
      '<div class="card" data-i="' + i + '">' +
        '<div class="card-tag">' + (m.id === 'endless' ? 'ENDLESS' : ('LEVEL ' + i)) + '</div>' +
        '<div class="card-name">' + m.name + '</div>' +
        '<div class="card-desc">' + m.desc + '</div>' +
        '<div class="card-best" data-best="' + i + '"></div>' +
      '</div>').join('');
    cardEls = Array.from(stripEl.querySelectorAll('.card'));
    cardEls.forEach(el => el.addEventListener('click', () => {
      const i = +el.dataset.i; if (i === selCard) doStart(); else setCard(i);
    }));
    document.getElementById('car-left').addEventListener('click', () => cardStep(-1));
    document.getElementById('car-right').addEventListener('click', () => cardStep(1));
    // touch swipe on the carousel
    let sx = null;
    const cw = document.getElementById('carousel');
    cw.addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, { passive: true });
    cw.addEventListener('touchend', e => {
      if (sx == null) return;
      const dx = e.changedTouches[0].clientX - sx;
      if (Math.abs(dx) > 36) cardStep(dx < 0 ? 1 : -1);
      sx = null;
    }, { passive: true });
    // danger pips
    const dg = document.getElementById('danger');
    dg.innerHTML = DANGERS.map((d, i) => '<div class="pip" data-d="' + i + '">' + i + '</div>').join('');
    Array.from(dg.querySelectorAll('.pip')).forEach(el => el.addEventListener('click', () => setDanger(+el.dataset.d)));
    document.getElementById('start-btn').addEventListener('click', doStart);
    document.getElementById('pg-retry').addEventListener('click', retry);
    document.getElementById('pg-select').addEventListener('click', backToSelect);
  }

  function renderCarousel() {
    if (!stripEl || !cardEls.length) return;
    const cw = document.getElementById('carousel').clientWidth || 320;
    const fc = cardEls[selCard];
    // centre the focused card using its real layout position (gap-agnostic + responsive)
    const tx = cw / 2 - (fc.offsetLeft + fc.offsetWidth / 2);
    stripEl.style.transform = 'translateY(-50%) translateX(' + tx + 'px)';
    cardEls.forEach((el, i) => {
      el.classList.toggle('focus', i === selCard);
      if (i !== selCard) el.style.opacity = Math.max(0.22, 0.62 - Math.abs(i - selCard) * 0.16);
      const b = el.querySelector('.card-best'); if (b) b.textContent = bestLabel(MODES[i]);
    });
  }

  function renderDanger() {
    const dg = document.getElementById('danger'); if (!dg) return;
    Array.from(dg.querySelectorAll('.pip')).forEach((el, i) => el.classList.toggle('on', i === selDanger));
    const d = DANGERS[selDanger];
    document.getElementById('danger-info').innerHTML =
      '<b>DANGER ' + selDanger + ' · ' + d.name + '</b> — start with <b>' + d.hearts + '</b> hearts · ' +
      'enemies ×' + d.spd.toFixed(2) + ' speed, ×' + d.density.toFixed(2) + ' density · ' +
      'gaps ×' + d.gapF.toFixed(2) + ' · score <b>×' + d.mult.toFixed(1) + '</b>';
  }

  function clampCard(i) { return Math.max(0, Math.min(MODES.length - 1, i)); }
  function setCard(i) { i = clampCard(i); const ch = i !== selCard; selCard = i; renderCarousel(); if (ch && window.SFX) SFX.play('click'); }
  function cardStep(dir) { setCard(selCard + dir); }
  function setDanger(i) { i = Math.max(0, Math.min(DANGERS.length - 1, i)); const ch = i !== selDanger; selDanger = i; renderDanger(); if (ch && window.SFX) SFX.play('click'); }
  function dangerStep(dir) { setDanger(selDanger + dir); }
  function doStart() { startGame(MODES[selCard].id, selDanger); }
  function retry() { startGame(gameMode, dangerIdx); }
  function backToSelect() { if (window.SFX) SFX.play('click'); theme = DEFAULT_THEME; finishFlag = null; finite = false; state = 'select'; syncUI(); }

  function showPostGame() {
    const win = state === 'levelcomplete';
    const t = document.getElementById('pg-title');
    t.textContent = win ? 'LEVEL COMPLETE' : 'WASTED';
    t.className = win ? 'pg-title win' : 'pg-title';
    const rows = ['SCORE <b>' + currentScore().toLocaleString() + '</b>',
                  'COINS ' + coinCount + '   ·   DANGER ' + dangerIdx + ' ×' + diff.mult.toFixed(1)];
    if (win) rows.push('TIME <b>' + fmtTime(elapsed) + '</b>');
    rows.push('BEST ' + best.toLocaleString());
    document.getElementById('pg-stats').innerHTML = rows.map(r => '<div>' + r + '</div>').join('');
    syncUI();
  }

  function syncUI() {
    document.getElementById('select').style.display = state === 'select' ? 'flex' : 'none';
    document.getElementById('pg').style.display = (state === 'gameover' || state === 'levelcomplete') ? 'flex' : 'none';
    const pad = document.getElementById('pad'); if (pad) pad.style.display = state === 'playing' ? '' : 'none';
    const hint = document.getElementById('hint'); if (hint) hint.style.visibility = state === 'playing' ? 'visible' : 'hidden';
    if (state === 'select') { renderCarousel(); renderDanger(); }
  }

  buildSelectUI();
  window.addEventListener('resize', () => { if (state === 'select') renderCarousel(); });
  // start on the select screen
  state = 'select';
  syncUI();
  // render carousel once fonts/layout settle (offsetWidth needs layout)
  requestAnimationFrame(() => { renderCarousel(); renderDanger(); });

  // expose current score for the floating trophy button
  window.__lbCurrentScore = () => currentScore();
})();

// ── Fullscreen ────────────────────────────────────────────────────
(function () {
  const btn = document.getElementById('fs-btn');
  const enterIcon = document.getElementById('fs-enter');
  const exitIcon  = document.getElementById('fs-exit');
  document.addEventListener('fullscreenchange', function () {
    const inFs = !!document.fullscreenElement;
    enterIcon.style.display = inFs ? 'none' : '';
    exitIcon.style.display  = inFs ? '' : 'none';
  });
  btn.addEventListener('click', function () {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen({ navigationUI: 'hide' })
        .then(function () {
          if (screen.orientation && screen.orientation.lock)
            screen.orientation.lock('landscape').catch(function () {});
        }).catch(function () {});
    } else {
      document.exitFullscreen().catch(function () {});
    }
  });
})();
</script>
<script src="/sfx.js"></script>
<script src="/leaderboard.js" data-game="platformer" data-color="#ff5a5f"></script>
</body>
